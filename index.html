  if(a==='otnueva'){O.form=nuevoForm(null);O.q='';render();window.scrollTo(0,0);return toast(`Nueva OT N° ${O.form.numero}: marcá el personal`)}
  if(a==='cargo'){O.cargo=t.dataset.c;return render()}
  if(a==='todos'){const q=O.q.trim().toLowerCase();O.personas.filter(p=>(O.cargo==='Todos'||p.cargo===O.cargo)&&(!q||[p.nombre,p.ci,p.cargo].some(v=>String(v||'').toLowerCase().includes(q)))).forEach(p=>{if(!O.form.sel.some(s=>s.pid===p.id))O.form.sel.push({pid:p.id,obs:''})});return render()}
  if(a==='ninguno'){O.form.sel=[];return render()}
  if(a==='nuevap'){O.pedit={nombre:'',ci:'',cargo:O.cargo!=='Todos'?O.cargo:''};render();const i=document.getElementById('op-nombre');if(i)i.focus();return}
  if(a==='editp'){O.pedit={...O.personas.find(p=>p.id===t.dataset.id)};return render()}
  if(a==='cancelap'){O.pedit=null;return render()}
  if(a==='guardap')return guardarP();
  if(a==='confp'){O.pconf=t.dataset.id;return render()}
  if(a==='borrap'){try{await window.OTB.delPersona(t.dataset.id);O.personas=O.personas.filter(p=>p.id!==t.dataset.id);O.form.sel=O.form.sel.filter(s=>s.pid!==t.dataset.id);O.pconf=null;render();toast('Persona borrada')}catch(err){toast('No se pudo borrar')}return}
  if(a==='delpersonal'){const obra=S.obra;const act=S.personal.filter(p=>p.obra_id===obra&&p.activo!==false);let n=0;
    for(const p of act){const ci=String(p.ci||'').replace(/\D/g,'');if(O.personas.some(x=>ci&&String(x.ci).replace(/\D/g,'')===ci||x.nombre.toLowerCase()===String(p.nombre).toLowerCase()))continue;
      const np={id:nid(),obra_id:O.oid,nombre:String(p.nombre).trim(),ci:p.ci||'',cargo:p.categoria||''};try{await window.OTB.savePersona(np);O.personas.push(np);n++}catch(err){}}
    render();return toast(n?`${n} persona${n>1?'s':''} del personal agregada${n>1?'s':''} a la base`:'El personal de la obra ya está en la base')}
  if(a==='pdf'){if(!O.form.sel.length)return toast('Marcá al menos una persona');return pdfOT(O.form.numero,O.form.fecha,datosForm())}
  if(a==='xls'){if(!O.form.sel.length)return toast('Marcá al menos una persona');return xlsOT(O.form.numero,O.form.fecha,datosForm())}
  if(a==='hpdf'&&ot)return pdfOT(ot.numero,ot.fecha,ot.datos);
  if(a==='hxls'&&ot)return xlsOT(ot.numero,ot.fecha,ot.datos);
  if(a==='abrir'&&ot){const d=ot.datos;const busca=p=>{const ci=String(p.ci||'').replace(/\D/g,'');const x=O.personas.find(y=>y.id===p.pid)||O.personas.find(y=>ci&&String(y.ci||'').replace(/\D/g,'')===ci)||O.personas.find(y=>y.nombre.toLowerCase()===String(p.nombre||'').toLowerCase());return x?{pid:x.id,obs:p.obs||''}:null};
    O.form={id:ot.id,numero:ot.numero,fecha:ot.fecha,...d,sel:(d.personas||[]).map(busca).filter(Boolean)};O.vista='nueva';render();window.scrollTo(0,0);return}
  if(a==='duplicar'&&ot){O.form=nuevoForm(ot);O.vista='nueva';render();window.scrollTo(0,0);return toast('Copia lista con la fecha de hoy')}
  if(a==='confot'){O.cconf=t.dataset.id;return render()}
  if(a==='borraot'&&ot){try{await window.OTB.del(ot.id);O.ots=O.ots.filter(x=>x.id!==ot.id);O.cconf=null;render();toast('OT borrada')}catch(err){toast('No se pudo borrar')}return}
});
document.addEventListener('change',async e=>{
  if(!dentro(e))return;const t=e.target;
  if(t.form&&t.form.id==='ot-f'&&(t.name==='desde'||t.name==='hasta')){leerCampos();if(t.name==='desde'&&O.form.hasta&&O.form.hasta<O.form.desde)O.form.hasta='';const el=document.querySelector('#ot-f .ot-per');const f=O.form;if(el)el.innerHTML=f.desde&&f.hasta&&f.hasta<f.desde?'<b style="color:var(--bad)">La fecha final es anterior a la inicial.</b>':periodo(f)?esc(periodo(f))+(dias(f)>1?` · ${dias(f)} días corridos`:''):'Poné desde qué fecha y hasta cuándo se realizan los trabajos.';const h=document.querySelector('#ot-f [name=hasta]');if(h){h.min=f.desde||'';h.value=f.hasta||''}return}
  if(t.dataset.osel){leerCampos();if(t.checked){if(!O.form.sel.some(s=>s.pid===t.dataset.osel))O.form.sel.push({pid:t.dataset.osel,obs:''})}else O.form.sel=O.form.sel.filter(s=>s.pid!==t.dataset.osel);return render()}
  if(t.id==='ot-imp'&&t.files[0]){if(!window.XLSX)return toast('No se pudo cargar el lector de Excel');let L=[];
    try{const wb=XLSX.read(await t.files[0].arrayBuffer(),{type:'array'});const nz=x=>String(x??'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();
      for(const n of wb.SheetNames){const rows=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:false,defval:''});
        const h=rows.findIndex(r=>r.some(c=>/nombre/.test(nz(c)))&&r.some(c=>/^c\.?i\.?$|cedula|^ci /.test(nz(c))||nz(c)==='ci'));if(h<0)continue;
        const hr=rows[h].map(nz);const cn=hr.findIndex(c=>/nombre/.test(c)),cc=hr.findIndex(c=>/^c\.?i|cedula/.test(c)),cg=hr.findIndex(c=>/cargo|categ|funci/.test(c));
        for(const r of rows.slice(h+1)){const nm=String(r[cn]||'').trim().replace(/\s+/g,' ');if(!nm||/condiciones|proveedor/i.test(nm))continue;L.push({nombre:nm,ci:String(r[cc]||'').replace(/[^\d]/g,''),cargo:cg>=0?String(r[cg]||'').trim().replace(/\s+/g,' '):''})}}}
    catch(err){return toast('No se pudo leer el archivo')}
    let n=0;for(const p of L){const ci=p.ci;if(O.personas.some(x=>ci&&String(x.ci||'').replace(/\D/g,'')===ci||x.nombre.toLowerCase()===p.nombre.toLowerCase()))continue;
      const np={id:nid(),obra_id:O.oid,...p};try{await window.OTB.savePersona(np);O.personas.push(np);n++}catch(err){}}
    t.value='';render();return toast(L.length?(n?`${n} persona${n>1?'s':''} importada${n>1?'s':''} a esta obra`:'Todas las personas del Excel ya estaban cargadas'):'No encontré una tabla con columnas Nombre y CI')}
  if(t.id==='ot-copiar'&&t.value){let L=[];try{L=await window.OTB.personas(t.value)}catch(err){}let n=0;
    for(const p of L){const ci=String(p.ci||'').replace(/\D/g,'');if(O.personas.some(x=>ci&&String(x.ci||'').replace(/\D/g,'')===ci||x.nombre.toLowerCase()===p.nombre.toLowerCase()))continue;
      const np={id:nid(),obra_id:O.oid,nombre:p.nombre,ci:p.ci||'',cargo:p.cargo||''};try{await window.OTB.savePersona(np);O.personas.push(np);n++}catch(err){}}
    render();return toast(n?`${n} persona${n>1?'s':''} copiada${n>1?'s':''} a esta obra`:'No había personas nuevas para copiar')}
  if(t.id==='ot-logo'&&t.files[0]){leerCampos();const fr=new FileReader();fr.onload=()=>{O.form.logo=fr.result;render()};fr.readAsDataURL(t.files[0])}
});
document.addEventListener('input',e=>{if(!dentro(e))return;const t=e.target;
  if(t.id==='ot-q'){leerCampos();O.q=t.value;return render()}
  if(t.dataset.oobs){const s=O.form.sel.find(x=>x.pid===t.dataset.oobs);if(s)s.obs=t.value}});
document.addEventListener('keydown',e=>{if(!dentro(e))return;if(e.key==='Enter'&&e.target.closest('.ot-pf')){e.preventDefault();guardarP()}});
document.addEventListener('submit',async e=>{if(!dentro(e))return;e.preventDefault();e.stopImmediatePropagation();if(e.target.id!=='ot-f')return;leerCampos();
  const f=O.form;f.numero=String(f.numero||'').trim();if(!f.numero)return toast('Poné el número de OT');if(!f.sel.length)return toast('Marcá al menos una persona');if(f.desde&&f.hasta&&f.hasta<f.desde)return toast('La fecha final de los trabajos es anterior a la inicial');
  const prev=O.ots.find(x=>x.id===f.id);if(prev&&String(prev.numero)!==f.numero)f.id=nid();
  const dup=O.ots.find(x=>x.id!==f.id&&String(x.numero)===f.numero);if(dup&&!f.confirmDup){f.confirmDup=true;return toast(`Ya existe la OT N° ${f.numero}. Tocá Guardar otra vez para guardarla igual, o cambiá el número.`)}delete f.confirmDup;const row={id:f.id,obra_id:O.oid,numero:f.numero,fecha:f.fecha,datos:datosForm()};
  try{await window.OTB.save(row)}catch(err){return toast('No se pudo guardar. ¿Ejecutaste el SQL 14?')}
  const i=O.ots.findIndex(x=>x.id===row.id);if(i>=0)O.ots[i]=row;else O.ots.unshift(row);render();toast(`OT N° ${f.numero} guardada`)},true);

const css=document.createElement('style');css.textContent=`

.ot-pt{display:flex;flex-direction:column;min-width:0}.ot-pt b{font-size:14px}
.ot-obs{width:110px}
.ot-pf{display:flex;gap:6px;flex-wrap:wrap}.ot-pf input{flex:1 1 140px}
.ot-cond{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.ot-cond textarea{font:inherit;text-transform:none;letter-spacing:0;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:14px}
@media (max-width:760px){#ot-q{width:100%!important;flex:1 1 100%}.ot-lista{grid-template-columns:1fr}}
`;document.head.appendChild(css);
})();
</script>
