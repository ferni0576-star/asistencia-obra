<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Gestión de Obra</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: herramienta de obra — cabecera fija, contenido en una columna, barra de pestañas abajo en el celular */
:root{
  --bg:#eef0ef; --panel:#ffffff; --ink:#1d2321; --muted:#5f6a66; --line:#d5dad7;
  --accent:#f2b705; --accent-ink:#1d2321; --ok:#1f7a5a; --ok-bg:#dcefe6; --warn:#a15c00; --warn-bg:#fbedd2;
  --bad:#b3261e; --bad-bg:#f8dedb; --chip:#e4e8e6; --edit:#fff8dc; --bar:#c9cfcc;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141817; --panel:#1d2321; --ink:#e8ecea; --muted:#9aa5a1; --line:#2f3835;
  --accent:#f2b705; --accent-ink:#141817; --ok:#5fcf9f; --ok-bg:#163a2c; --warn:#f0b35a; --warn-bg:#3a2a12;
  --bad:#ff8a80; --bad-bg:#3d1a17; --chip:#28302d; --edit:#2e2a14; --bar:#3a4441; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141817; --panel:#1d2321; --ink:#e8ecea; --muted:#9aa5a1; --line:#2f3835;
  --accent:#f2b705; --accent-ink:#141817; --ok:#5fcf9f; --ok-bg:#163a2c; --warn:#f0b35a; --warn-bg:#3a2a12;
  --bad:#ff8a80; --bad-bg:#3d1a17; --chip:#28302d; --edit:#2e2a14; --bar:#3a4441; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--ink);color:var(--bg);
  padding:10px 16px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;min-width:0}
.brand b{font-family:var(--f-display);font-size:22px;letter-spacing:.02em;text-transform:uppercase;line-height:1}
.brand span{font-size:13px;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand b i{font-style:normal;color:var(--accent)}
.obra-sel{margin-top:4px;background:transparent;color:var(--bg);border:1px solid color-mix(in srgb,var(--bg) 35%,transparent);border-radius:6px;padding:4px 8px;font-size:14px;max-width:100%}
.obra-sel option{color:var(--ink);background:var(--panel)}
nav.tabs{display:flex;gap:4px}
nav.tabs button{background:transparent;border:0;color:var(--bg);opacity:.7;padding:8px 12px;border-radius:8px;
  font-family:var(--f-display);font-size:17px;letter-spacing:.03em;text-transform:uppercase}
nav.tabs button[aria-current="true"]{opacity:1;background:var(--accent);color:var(--accent-ink)}
@media (max-width:760px){
  nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--ink);justify-content:space-around;
    padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:30}
  nav.tabs button{padding:8px 6px;font-size:15px}
  main{padding-bottom:84px!important}
}
.demo{background:var(--warn-bg);color:var(--warn);padding:8px 16px;font-size:13px;text-align:center}
main{max-width:1100px;margin:0 auto;padding:16px;padding-block:16px 40px;display:flex;flex-direction:column;gap:14px}
h2{font-family:var(--f-display);font-weight:700;font-size:28px;margin:0;text-transform:uppercase;letter-spacing:.02em;text-wrap:balance}
h3{font-family:var(--f-display);font-weight:600;font-size:20px;margin:0}
.sub{color:var(--muted);font-size:14px}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.bar.between{justify-content:space-between}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:9px 14px;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.icon{padding:9px 13px;font-family:var(--f-num)}
.btn:disabled{opacity:.5;cursor:default}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=email],input[type=password],select{
  background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-width:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.stat small{display:block;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.stat b{font-family:var(--f-num);font-size:20px}

/* Cargar */
.daynav{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.daynav .dlabel{font-family:var(--f-display);font-size:22px;font-weight:600;text-transform:capitalize}
.lista{display:flex;flex-direction:column}
.fila{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;align-items:center;padding:10px 12px;border-top:1px solid var(--line)}
.fila:first-child{border-top:0}
.fila .who b{display:block;font-weight:600}
.fila .who small{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.05em}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:8px 10px;font-weight:600;font-size:14px;border-left:1px solid var(--line)}
.seg button:first-child{border-left:0}
.seg button.on{background:var(--ok-bg);color:var(--ok)}
.seg button.on.parcial{background:var(--warn-bg);color:var(--warn)}
.seg button.on.falta{background:var(--bad-bg);color:var(--bad)}
.hs{font-family:var(--f-num);font-size:13px;color:var(--muted);min-width:44px;text-align:right}
.otro{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;background:var(--chip);padding:10px;border-radius:8px}
.otro label{display:flex;flex-direction:column;font-size:12px;color:var(--muted);gap:3px}
.otro .full{grid-column:1/-1}
@media (max-width:560px){.fila{grid-template-columns:1fr}.fila .acts{display:flex;justify-content:space-between;align-items:center;gap:8px}}

/* Tablas */
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
td.n,th.n{text-align:right;font-family:var(--f-num);font-variant-numeric:tabular-nums}
td.c,th.c{text-align:center}
tfoot td{font-weight:600;border-bottom:0;border-top:2px solid var(--ink)}
.cell{display:inline-block;min-width:34px;padding:2px 6px;border-radius:6px;font-family:var(--f-num);font-size:13px;border:0;background:transparent}
.cell.full{background:var(--ok-bg);color:var(--ok)}
.cell.part{background:var(--warn-bg);color:var(--warn)}
.cell.none{color:var(--muted)}
button.cell{cursor:pointer}

/* Liquidación */
.liq{padding:14px;display:flex;flex-direction:column;gap:10px}
.liq .hd{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:baseline}
.neto{display:flex;justify-content:space-between;align-items:center;background:var(--chip);border-radius:8px;padding:10px 12px}
.neto b{font-family:var(--f-num);font-size:20px}
.desc-add{display:grid;grid-template-columns:130px minmax(0,1fr) 130px auto;gap:6px}
@media (max-width:560px){.desc-add{grid-template-columns:1fr 1fr}}
.x{border:0;background:transparent;color:var(--bad);font-weight:700;padding:2px 8px}
.desc-edit{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1.6fr) 150px 130px;gap:8px;background:var(--chip);padding:10px;border-radius:8px;white-space:normal}
.desc-edit label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
.desc-edit .acciones{grid-column:1/-1}
.btn.peligro{color:var(--bad);margin-left:auto}
@media (max-width:640px){.desc-edit{grid-template-columns:1fr 1fr}}
.firmas{display:none}
.rango{padding:10px 12px;display:flex;flex-direction:column;gap:10px}
.rango label.fecha{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}

/* Personal */
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;padding:14px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.form label.chk{flex-direction:row;align-items:center;text-transform:none;font-size:14px;color:var(--ink)}
.pill{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--ok-bg);color:var(--ok);text-transform:uppercase;letter-spacing:.05em}
.pill.off{background:var(--chip);color:var(--muted)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);
  padding:8px 16px;border-radius:99px;font-size:14px;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.login{max-width:380px;margin:10vh auto;padding:24px;display:flex;flex-direction:column;gap:12px}
.err{color:var(--bad);font-size:14px}
.membrete{display:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

@media print{
  @page{size:A4 landscape;margin:10mm}
  :root{--bg:#fff;--panel:#fff;--ink:#000;--muted:#444;--line:#999;--chip:#f2f2f2;--ok-bg:#fff;--warn-bg:#fff;--ok:#000;--warn:#000}
  header.top,nav.tabs,.demo,.no-print,.toast{display:none!important}
  main{padding:0;max-width:none}
  .membrete{display:flex;justify-content:space-between;border-bottom:2px solid #000;padding-bottom:6px;margin-bottom:6px}
  .membrete b{font-family:var(--f-display);font-size:20px}
  .panel{border:0}
  .liq{break-inside:avoid;border:1px solid #000!important;margin-bottom:8mm}
  .firmas{display:flex;gap:40px;margin-top:22px}
  .firmas div{flex:1;border-top:1px solid #000;padding-top:4px;font-size:12px;text-align:center}
  th,td{padding:4px 6px}
}
#cert-root h2{font-family:var(--f-display);font-weight:700;font-size:28px;margin:0;text-transform:uppercase;letter-spacing:.02em}
#cert-root h3{font-family:var(--f-display);font-weight:600;font-size:20px;margin:0}
#cert-root .sub{color:var(--muted);font-size:14px}
#cert-root .bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#cert-root .between{justify-content:space-between}
#cert-root .btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:9px 14px;font-weight:600}
#cert-root .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
#cert-root .btn.ghost{background:transparent}
#cert-root .btn.sm{padding:5px 10px;font-size:13px}
#cert-root .btn:disabled{opacity:.45;cursor:not-allowed}
#cert-root input,#cert-root select{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
#cert-root .panel{background:var(--panel);border:1px solid var(--line);border-radius:10px}
#cert-root .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:10px}
#cert-root .kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
#cert-root .kpi small{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
#cert-root .kpi b{font-family:var(--f-num);font-size:20px}
#cert-root .kpi em{font-style:normal;font-size:13px;color:var(--muted)}
#cert-root .kpi.ok{border:2px solid var(--ok)}
#cert-root .kpi.ok b{color:var(--ok)}
#cert-root .kpi.bad{border:2px solid var(--bad)}
#cert-root .kpi.bad b{color:var(--bad)}
#cert-root .dot{display:inline-block;width:11px;height:11px;border-radius:50%;flex:none}
#cert-root .dot.rojo{background:var(--bad)}
#cert-root .dot.amarillo{background:var(--accent)}
#cert-root .dot.verde{background:var(--ok)}
#cert-root .alerta{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;padding:10px 14px;border-top:1px solid var(--line)}
#cert-root .alerta:first-child{border-top:0}
#cert-root .alerta .dot{margin-top:6px}
#cert-root .tw{overflow-x:auto}
#cert-root table{border-collapse:collapse;width:100%}
#cert-root th,#cert-root td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;vertical-align:middle}
#cert-root th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
#cert-root th.grp{text-align:center;border-bottom:2px solid var(--line);font-size:12px;color:var(--ink)}
#cert-root td.n,#cert-root th.n{text-align:right}
#cert-root td.desc{white-space:normal;min-width:220px;max-width:380px}
#cert-root tr.rubro td{background:var(--chip);font-weight:600;font-family:var(--f-display);font-size:16px;letter-spacing:.02em}
#cert-root tr.sector td{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding-top:10px}
#cert-root tr.subt td{font-weight:600;border-bottom:2px solid var(--line)}
#cert-root tr.over td{background:var(--bad-bg)}
#cert-root tr.has td.pres{background:var(--edit)}
#cert-root tfoot td{font-weight:700;border-top:2px solid var(--ink);border-bottom:0}
#cert-root td.pres input{width:90px;text-align:right;font-family:var(--f-num);padding:5px 6px}
#cert-root .track{height:8px;background:var(--bar);border-radius:99px;position:relative;overflow:hidden;min-width:80px}
#cert-root .track i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--ok)}
#cert-root .track i.rojo{background:var(--bad)}
#cert-root .mini{display:flex;align-items:center;gap:8px}
#cert-root .mini .pct{font-family:var(--f-num);font-size:12px;width:48px;text-align:right}
#cert-root .totales{position:sticky;bottom:0;z-index:10;display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px;padding:12px 14px;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 -6px 18px rgba(0,0,0,.06);align-items:center}
@media (max-width:760px){#cert-root .totales{bottom:calc(64px + env(safe-area-inset-bottom,0px))}}
#cert-root .totales div small{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
#cert-root .totales div b{font-family:var(--f-num);font-size:18px}
#cert-root .letras{grid-column:1/-1;font-size:13px;color:var(--muted)}
#cert-root .hint{font-size:13px;padding:8px 10px;border-radius:8px}
#cert-root .hint.rojo{background:var(--bad-bg);color:var(--bad)}
#cert-root .hint.verde{background:var(--ok-bg);color:var(--ok)}
#cert-root .hint.amarillo{background:var(--warn-bg);color:var(--warn)}
#cert-root .form{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;padding:14px;align-items:end}
#cert-root .form label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
#cert-root .form .wide{grid-column:span 2}
@media (max-width:520px){#cert-root .form .wide{grid-column:1/-1}}
#cert-root .chips{display:flex;gap:6px;flex-wrap:wrap}
#cert-root .chip{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:5px 12px;font-weight:600;font-size:14px}
#cert-root .chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
#cert-root .chip.nuevo{border-style:dashed}
#cert-root{display:flex;flex-direction:column;gap:16px}
#cert-root .subnav{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}
#cert-root .subnav select{max-width:100%}
#cert-root .totales{bottom:0}
@media (max-width:760px){#cert-root .totales{bottom:calc(64px + env(safe-area-inset-bottom,0px))}}
.subnav-p{display:flex;gap:6px;flex-wrap:wrap}
.chip-p{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:6px 14px;font-weight:600;font-size:14px}
.chip-p[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
@media (max-width:760px){nav.tabs{justify-content:space-around;gap:4px}nav.tabs button{flex:1;font-size:16px;padding:8px 6px}}
</style>

<style>
/* Libro de lluvias (por obra) */
:root{--ll:#1f5f96;--ll-ink:#ffffff;--ll-soft:#d6e5f2;--llp:#c9821c;--llp-soft:#f6e6cc}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--ll:#6aaee8;--ll-ink:#0d1a26;--ll-soft:#1d3a54;--llp:#e2a54c;--llp-soft:#4a3618}}
:root[data-theme="dark"]{--ll:#6aaee8;--ll-ink:#0d1a26;--ll-soft:#1d3a54;--llp:#e2a54c;--llp-soft:#4a3618}
@media (max-width:760px){nav.tabs{gap:0}nav.tabs button{padding:8px 3px;font-size:14px;letter-spacing:.01em}}
.ll-main{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:860px){.ll-main{grid-template-columns:minmax(0,1fr)}}
.ll-cal{padding:14px;display:flex;flex-direction:column;gap:16px}
.ll-legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--muted)}
.ll-legend i{display:inline-block;width:14px;height:14px;vertical-align:-2px;margin-right:6px;border-radius:3px;border:1px solid var(--line)}
.ll-legend .t{background:var(--ll);border-color:var(--ll)}
.ll-legend .p{background:linear-gradient(135deg,var(--llp) 50%,var(--llp-soft) 50%);border-color:var(--llp)}
.ll-legend .s{box-shadow:inset 0 0 0 2px var(--ll-soft)}
.ll-mes{font-size:18px;text-transform:capitalize;margin-bottom:6px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:baseline}
.ll-mes small{font-size:12px;text-transform:none;font-weight:400}
.ll-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.ll-dow{font-family:var(--f-num);font-size:11px;color:var(--muted);text-align:center;text-transform:uppercase}
.ll-day{border:1px solid var(--line);background:var(--panel);min-height:42px;padding:4px;border-radius:6px;font-family:var(--f-num);font-size:13px;
  text-align:left;display:flex;flex-direction:column;justify-content:space-between}
.ll-day:hover:not([disabled]){border-color:var(--ll)}
.ll-day[disabled]{opacity:.35;cursor:default;border-style:dashed}
.ll-day.sun{background:var(--bg)}
.ll-day.today{box-shadow:inset 0 0 0 2px var(--ink)}
.ll-day.sel{outline:2px solid var(--ink);outline-offset:1px}
.ll-day.total{background:var(--ll);border-color:var(--ll);color:var(--ll-ink)}
.ll-day.parcial{background:linear-gradient(135deg,var(--llp) 50%,var(--llp-soft) 50%);border-color:var(--llp)}
.ll-day.sin{box-shadow:inset 0 0 0 2px var(--ll-soft)}
.ll-day em{font-style:normal;font-size:10px}
.ll-form textarea{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-height:70px;resize:vertical;text-transform:none;letter-spacing:0}
.ll-seg{display:flex;flex-direction:column;gap:6px}
.ll-seg label{flex-direction:row!important;align-items:flex-start;gap:10px;text-transform:none!important;letter-spacing:0!important;font-size:14px!important;color:var(--ink)!important;
  border:1px solid var(--line);border-radius:8px;padding:8px 10px;cursor:pointer}
.ll-seg label:has(input:checked){border-color:var(--ink);background:var(--chip)}
.ll-seg input{margin-top:3px;accent-color:var(--ll)}
.ll-seg small{display:block;color:var(--muted);font-size:12px}
.ll-chips{display:flex;flex-wrap:wrap;gap:6px}
.ll-chips label{flex-direction:row!important;align-items:center;text-transform:none!important;letter-spacing:0!important;font-size:13px!important;color:var(--ink)!important;
  border:1px solid var(--line);border-radius:99px;padding:5px 11px;cursor:pointer}
.ll-chips label:has(input:checked){background:var(--ink);color:var(--panel)!important;border-color:var(--ink)}
.ll-chips input{position:absolute;opacity:0;pointer-events:none}
.ll-chips label:has(input:focus-visible){outline:3px solid var(--accent);outline-offset:2px}
.ll-confirm{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;align-items:center;border:1px solid var(--bad);border-radius:8px;padding:8px 10px;font-size:14px}
.ll-pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;white-space:nowrap}

.ll-pill.sin{background:var(--ll-soft);color:var(--ink)}
tr.ll-row{cursor:pointer}
tr.ll-row:hover td{background:var(--chip)}
td.wrap{white-space:normal;min-width:200px}
.ll-aviso{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;border:1px solid var(--ll);background:var(--ll-soft);border-radius:8px;padding:8px 12px;font-size:14px}
.ll-tag{display:inline-block;margin-top:2px;font-size:10px;padding:0 5px;border-radius:4px;background:var(--ll);color:var(--ll-ink);letter-spacing:.03em}
.ll-tag.parcial{background:var(--llp);color:#1d2321}
.ll-tag.sin{background:var(--ll-soft);color:var(--ink)}
.stat.ll b{color:var(--ll)}

const mins=t=>{if(!t)return null;const[h,m]=t.split(':').map(Number);return h*60+m};
const tramo=(a,b)=>{const x=mins(a),y=mins(b);return(x!=null&&y!=null&&y>x)?(y-x)/60:0};

/* ---------- almacenamiento: local (prueba) o Supabase (nube) ---------- */
function backendLocal(){
  const K='asistencia_obra_v1'; let d=null;
  try{d=JSON.parse(localStorage.getItem(K)||'null')}catch(e){}
  if(!d){
    const personal=DEMO.personal.map(p=>({...p,id:uid()}));
    const byName=Object.fromEntries(personal.map(p=>[p.nombre,p.id]));
    const asistencia=DEMO.asistencia.map(a=>{const r={id:uid(),personal_id:byName[a.nombre],fecha:a.fecha,
      ent_am:a.ent_am,sal_am:a.sal_am,ent_pm:a.ent_pm,sal_pm:a.sal_pm,obs:''};r.horas=horasDe(r);return r});
    d={personal,asistencia,descuentos:[],ajustes:null};
  }
  if(!d.obras){const id=uid();d.obras=[{id,nombre:'Locales comerciales',cliente:'Vanguard S.A',ubicacion:'Cambyretá, Itapúa',inicio:'2026-09-02',activa:true}];
    d.personal.forEach(p=>{p.obra_id=p.obra_id||id});d.asistencia.forEach(a=>{a.obra_id=a.obra_id||id});d.descuentos.forEach(x=>{x.obra_id=x.obra_id||id})}
  if(!d.lluvias){const o=d.obras.find(x=>/locales comerciales/i.test(x.nombre))||d.obras[0];d.lluvias=[];
    if(o){if(!o.ubicacion)o.ubicacion='Cambyretá, Itapúa';if(!o.inicio)o.inicio='2026-09-02';d.lluvias=DEMO_LLUVIAS.map(r=>({id:uid(),obra_id:o.id,...r}))}}
  const save=()=>{try{localStorage.setItem(K,JSON.stringify(d))}catch(e){}};
  save();
  return{
    async obras(){return d.obras.slice()},
    async saveObra(o){if(o.id){const i=d.obras.findIndex(x=>x.id===o.id);d.obras[i]={...d.obras[i],...o}}else{o.id=uid();d.obras.push(o)}save();return o},
    async personal(){return d.personal.slice()},
    async savePersonal(p){if(p.id){const i=d.personal.findIndex(x=>x.id===p.id);d.personal[i]={...d.personal[i],...p}}else{p.id=uid();d.personal.push(p)}save();return p},
    async asistencias(a,b){return d.asistencia.filter(r=>r.fecha>=a&&r.fecha<=b)},
    async ultimaFecha(){return d.asistencia.reduce((m,r)=>r.fecha>m?r.fecha:m,'')},
    async upsertAsis(r){const i=d.asistencia.findIndex(x=>x.personal_id===r.personal_id&&x.fecha===r.fecha);
      if(i>=0)d.asistencia[i]={...d.asistencia[i],...r};else d.asistencia.push({id:uid(),...r});save()},
    async borrarAsis(pid,f){d.asistencia=d.asistencia.filter(x=>!(x.personal_id===pid&&x.fecha===f));save()},
    async descuentos(a,b){return d.descuentos.filter(r=>r.fecha>=a&&r.fecha<=b)},
    async addDesc(r){d.descuentos.push({id:uid(),...r});save()},
    async delDesc(id){d.descuentos=d.descuentos.filter(x=>x.id!==id);save()},
    async updDesc(id,r){const i=d.descuentos.findIndex(x=>x.id===id);if(i>=0)d.descuentos[i]={...d.descuentos[i],...r};save()},
    async ajustes(){return d.ajustes},
    async saveAjustes(v){d.ajustes=v;save()},
    async lluvias(oid){return d.lluvias.filter(r=>r.obra_id===oid)},
    async saveLluvia(r){const i=d.lluvias.findIndex(x=>x.obra_id===r.obra_id&&x.fecha===r.fecha);
      if(i>=0)d.lluvias[i]={...d.lluvias[i],...r};else d.lluvias.push({id:uid(),...r});save()},
    async delLluvia(oid,f){d.lluvias=d.lluvias.filter(x=>!(x.obra_id===oid&&x.fecha===f));save()},
    async contratistas(oid){if(!d.contratistas){const o=d.obras.find(x=>/locales comerciales/i.test(x.nombre))||d.obras[0];
        d.contratistas=SEMILLA_CONTRATISTAS.map(c=>({...JSON.parse(JSON.stringify(c)),id:uid(),obra_id:o?o.id:null}));save()}
      return d.contratistas.filter(c=>c.obra_id===oid).map(c=>JSON.parse(JSON.stringify(c)))},
    async saveContratista(c){const v=JSON.parse(JSON.stringify(c));const i=d.contratistas.findIndex(x=>x.id===c.id);if(i>=0)d.contratistas[i]=v;else d.contratistas.push(v);save()},
  };
}
function backendNube(sb){
  const ok=({data,error})=>{if(error){toast('Error: '+error.message);throw error}return data};
  const normA=r=>({...r,ent_am:t5(r.ent_am),sal_am:t5(r.sal_am),ent_pm:t5(r.ent_pm),sal_pm:t5(r.sal_pm),horas:Number(r.horas)});
  return{
    async obras(){return ok(await sb.from('obras').select('*').order('creado'))},
    async saveObra(o){const row={...o};if(!row.id)delete row.id;return ok(await sb.from('obras').upsert(row).select().single())},
    async personal(){return ok(await sb.from('personal').select('*')).map(p=>({...p,jornada:Number(p.jornada)}))},
    async savePersonal(p){const row={...p};if(!row.id)delete row.id;return ok(await sb.from('personal').upsert(row).select().single())},
    async asistencias(a,b){return ok(await sb.from('asistencia').select('*').gte('fecha',a).lte('fecha',b)).map(normA)},
    async ultimaFecha(){const r=ok(await sb.from('asistencia').select('fecha').order('fecha',{ascending:false}).limit(1));return r[0]?.fecha||''},
    async upsertAsis(r){const row={...r};delete row.id;for(const k of['ent_am','sal_am','ent_pm','sal_pm'])if(!row[k])row[k]=null;
      ok(await sb.from('asistencia').upsert(row,{onConflict:'personal_id,fecha'}))},
    async borrarAsis(pid,f){ok(await sb.from('asistencia').delete().eq('personal_id',pid).eq('fecha',f))},
    async descuentos(a,b){return ok(await sb.from('descuentos').select('*').gte('fecha',a).lte('fecha',b)).map(x=>({...x,monto:Number(x.monto)}))},
    async addDesc(r){ok(await sb.from('descuentos').insert(r))},
    async delDesc(id){ok(await sb.from('descuentos').delete().eq('id',id))},
    async updDesc(id,r){ok(await sb.from('descuentos').update(r).eq('id',id))},
    async ajustes(){const r=ok(await sb.from('ajustes').select('valor').eq('clave','general'));return r[0]?.valor||null},
    async saveAjustes(v){ok(await sb.from('ajustes').upsert({clave:'general',valor:v}))},
    async lluvias(oid){return ok(await sb.from('lluvias').select('*').eq('obra_id',oid).order('fecha'))
      .map(r=>({...r,horas:Number(r.horas)||0,mm:r.mm==null?null:Number(r.mm),actividades:r.actividades||[],observaciones:r.observaciones||''}))},
    async saveLluvia(r){const row={...r};delete row.id;ok(await sb.from('lluvias').upsert(row,{onConflict:'obra_id,fecha'}))},
    async delLluvia(oid,f){ok(await sb.from('lluvias').delete().eq('obra_id',oid).eq('fecha',f))},
    async contratistas(oid){if(!oid)return[];return ok(await sb.from('contratistas').select('*').eq('obra_id',oid).order('creado'))},
    async saveContratista(c){ok(await sb.from('contratistas').upsert({id:c.id,obra_id:c.obra_id,nombre:c.nombre,tipo:c.tipo,cuadrilla:!!c.cuadrilla,items:c.items,certs:c.certs,des:c.des}))},
  };
}

function periodo(ref){const d=parse(ref);const off=(d.getDay()-Number(S.aj.inicioSemana)+7)%7;const a=addD(ref,-off);return{a,b:addD(a,6)}}
const ndias=(a,b)=>Math.round((parse(b)-parse(a))/864e5)+1;
const diasDe=({a,b})=>Array.from({length:ndias(a,b)},(_,i)=>addD(a,i));
const rango=()=>S.rango||periodo(S.ref);
const MAX_DIAS=93;

async function cargarRango(a,b){
  const rows=await DB.asistencias(a,b);
  for(const k of Object.keys(S.asis)){const f=k.split('|')[1];if(f>=a&&f<=b)delete S.asis[k]}
  for(const r of rows)S.asis[key(r.personal_id,r.fecha)]=r;
}
async function refrescar(){
  S.cargando=true;
  S.lluv=S.obra?await DB.lluvias(S.obra):[];
  if(S.tab==='cargar')await cargarRango(S.dia,S.dia);
  if(S.tab==='planilla'||S.tab==='liquidacion'){const p=rango();await cargarRango(p.a,p.b);S.desc=await DB.descuentos(p.a,p.b)}
  S.cargando=false;render();
}

/* ---------- vistas ---------- */
const presets=()=>({
  completa:{ent_am:S.aj.am_ent,sal_am:S.aj.am_sal,ent_pm:S.aj.pm_ent,sal_pm:S.aj.pm_sal},
  manana:{ent_am:S.aj.am_ent,sal_am:S.aj.am_sal,ent_pm:'',sal_pm:''},
  tarde:{ent_am:'',sal_am:'',ent_pm:S.aj.pm_ent,sal_pm:S.aj.pm_sal}});
function estadoDe(r){
  if(!r)return'falta';const P=presets();
  const eq=(x,y)=>['ent_am','sal_am','ent_pm','sal_pm'].every(k=>(t5(x[k])||'')===(y[k]||''));
  if(eq(r,P.completa))return'completa';if(eq(r,P.manana))return'manana';if(eq(r,P.tarde))return'tarde';return'otro';
}

  const regs=activos().map(p=>S.asis[key(p.id,S.dia)]).filter(Boolean);
  const hs=regs.reduce((s,r)=>s+r.horas,0);
  const monto=regs.reduce((s,r)=>{const p=S.personal.find(x=>x.id===r.personal_id);return s+r.horas*costoHora(p)},0);
  const sinMarcar=activos().filter(p=>!S.asis[key(p.id,S.dia)]).length;
  const filas=lista.map(p=>{
    const r=S.asis[key(p.id,S.dia)];const e=estadoDe(r);const ab=S.abierto===p.id||e==='otro';

      <div class="who"><b>${esc(p.nombre)}</b><small>${esc(p.categoria||'')}${p.activo===false?' · inactivo':''}</small></div>
      <div class="acts bar">
        <div class="seg">${b('completa','Completa')}${b('manana','Mañana','parcial')}${b('tarde','Tarde','parcial')}${b('otro','Otro','parcial')}${b('falta','Falta','falta')}</div>
        <span class="hs">${r?fmtH(r.horas)+' h':'—'}</span>
      </div>
      ${ab?`<div class="otro">
        <label>Entrada mañana<input type="time" id="t-${p.id}-ent_am" data-pid="${p.id}" data-f="ent_am" value="${t5(r?.ent_am)}"></label>
        <label>Salida mañana<input type="time" id="t-${p.id}-sal_am" data-pid="${p.id}" data-f="sal_am" value="${t5(r?.sal_am)}"></label>

function datosPeriodo(){
  const p=rango();const dias=diasDe(p);
  const conDatos=new Set(Object.values(S.asis).filter(r=>r.fecha>=p.a&&r.fecha<=p.b&&enObra(r)).map(r=>r.personal_id));
  const descO=S.desc.filter(enObra);
  for(const d of descO)conDatos.add(d.personal_id);
  const gente=ordenar(S.personal.filter(x=>(deObra(x)&&x.activo!==false)||conDatos.has(x.id)));
  const filas=gente.map(x=>{
    const regs=dias.map(f=>{const r=S.asis[key(x.id,f)];return r&&enObra(r)?r:null});
    const horas=regs.reduce((s,r)=>s+(r?r.horas:0),0);
    const ch=costoHora(x);const bruto=Math.round(horas*ch);
    const desc=descO.filter(d=>d.personal_id===x.id);
    const totDesc=desc.reduce((s,d)=>s+Number(d.monto),0);
    return{p:x,regs,horas:Math.round(horas*100)/100,dias:horas/(Number(S.aj.horasJornada)||9),ch,bruto,desc,totDesc,neto:bruto-totDesc};
  });
  return{per:p,dias,filas};
}

/* ---------- libro de lluvias (por obra) ---------- */
const AFL={total:'Obra parada',parcial:'Parcial',sin:'Sin afectar'};
const ACTS_LL=['Excavación','Fundaciones','Hormigonado','Mampostería','Reboque exterior','Contrapiso','Techo / cubierta','Pintura exterior','Instalaciones','Limpieza / acopio'];
const MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const hJL=()=>Number(S.aj.horasLluvia)||8;
const perdido=r=>r.afectacion==='total'?1:r.afectacion==='parcial'?Math.min(1,(Number(r.horas)||0)/hJL()):0;
const n1=v=>String(Math.round((v||0)*100)/100).replace('.',',');
const ddmmyy=s=>`${dm(s)}/${parse(s).getFullYear()}`;
function inicioObra(){
  const o=obraAct();const pri=S.lluv.reduce((m,r)=>!m||r.fecha<m?r.fecha:m,'');
  const c=[o?.inicio,pri].filter(Boolean).sort()[0];
  return c||addD(hoy,-60);
}
function avisoLluvia(f){
  const r=S.lluv.find(x=>x.fecha===f);if(!r)return'';
  const txt=r.afectacion==='total'?'obra parada por lluvia':r.afectacion==='parcial'?`afectación parcial por lluvia (${n1(r.horas)} h perdidas)`:'llovió sin afectar los trabajos';
  return `<div class="ll-aviso"><span><b>Día de lluvia:</b> ${txt}.</span><button class="btn ghost" data-act="irll" data-f="${f}">Ver en libro de lluvias</button></div>`;
}
function tagLluvia(f){const r=S.lluv.find(x=>x.fecha===f);return r?`<br><span class="ll-tag ${r.afectacion}" title="${AFL[r.afectacion]}">${r.afectacion==='total'?'LLUVIA':r.afectacion==='parcial'?'LL. '+n1(r.horas)+'h':'llovió'}</span>`:''}

function vLluvias(){
  if(!S.obra)return `<h2>Libro de lluvias</h2><div class="panel liq sub">Creá tu primera obra en Ajustes.</div>`;
  const o=obraAct();const ini=inicioObra();
  const regs=S.lluv.slice().sort((a,b)=>a.fecha<b.fecha?-1:1);
  const by=Object.fromEntries(regs.map(r=>[r.fecha,r]));
  let tot=0,par=0,eq=0;regs.forEach(r=>{if(r.afectacion==='total')tot++;if(r.afectacion==='parcial')par++;eq+=perdido(r)});

  const meses=[];const s=parse(ini),e=parse(hoy);
  for(let y=s.getFullYear(),m=s.getMonth();y<e.getFullYear()||(y===e.getFullYear()&&m<=e.getMonth());){
    const first=new Date(y,m,1),nd=new Date(y,m+1,0).getDate();let ml=0,mr=0;
    let cel=DC.map(d=>`<div class="ll-dow">${d}</div>`).join('')+'<div></div>'.repeat(first.getDay());
    for(let d=1;d<=nd;d++){
      const f=`${y}-${pad(m+1)}-${pad(d)}`;const r=by[f];if(r){mr++;ml+=perdido(r)}
      const cls=['ll-day',new Date(y,m,d).getDay()===0?'sun':'',f===hoy?'today':'',f===S.llF?'sel':'',r?r.afectacion:''].filter(Boolean).join(' ');
      cel+=`<button type="button" class="${cls}" data-act="llday" data-f="${f}" ${f<ini||f>hoy?'disabled':''} aria-label="${d} de ${MESES[m]}${r?', '+AFL[r.afectacion]:''}"><span>${d}</span>${r&&r.afectacion==='parcial'?`<em>${n1(r.horas)} h</em>`:''}</button>`;
    }
    meses.push(`<div><h3 class="ll-mes">${MESES[m]} ${y} <small class="sub num">${mr} con lluvia · ${n1(ml)} perdidos</small></h3><div class="ll-grid">${cel}</div></div>`);
    m++;if(m>11){m=0;y++}
  }
  meses.reverse();

  const r=by[S.llF];const af=r?.afectacion||'total';const hj=hJL();
  const horas=af==='total'?hj:af==='sin'?0:(r?.horas??hj/2);
  const acts=[...new Set([...ACTS_LL,...(r?.actividades||[])])];
  const d=parse(S.llF);
  const form=`<form class="panel form ll-form" id="fll">
    <h3 style="grid-column:1/-1">${r?'Corregir':'Registrar'} · ${DIAS[d.getDay()]} ${dm(S.llF)}</h3>
    <label style="grid-column:1/-1">Fecha<input type="date" id="ll-fecha" name="fecha" value="${S.llF}" min="${ini}" max="${hoy}" required></label>
    <div class="ll-seg" style="grid-column:1/-1" role="radiogroup" aria-label="Cómo afectó la lluvia">
      ${[['total','Obra parada todo el día','No se pudo trabajar'],['parcial','Afectación parcial','Se perdieron algunas horas o se trabajó bajo techo'],['sin','Llovió sin afectar','Queda anotado, no suma días perdidos']]
        .map(([v,t,sm])=>`<label><input type="radio" name="af" value="${v}" ${af===v?'checked':''}><span><b>${t}</b><small>${sm}</small></span></label>`).join('')}
    </div>
    <label>Horas perdidas<input type="number" id="ll-horas" name="horas" min="0" max="12" step="0.5" value="${horas}" ${af!=='parcial'?'disabled':''}></label>
    <label>Lluvia (mm)<input type="number" id="ll-mm" name="mm" min="0" step="1" value="${r?.mm??''}" placeholder="opcional"></label>
    <div style="grid-column:1/-1;display:flex;flex-direction:column;gap:6px"><span class="sub" style="font-size:12px;text-transform:uppercase;letter-spacing:.05em">Trabajos afectados</span>
      <div class="ll-chips">${acts.map((x,i)=>`<label><input type="checkbox" id="ll-act-${i}" name="act" value="${esc(x)}" ${(r?.actividades||[]).includes(x)?'checked':''}>${esc(x)}</label>`).join('')}</div></div>
    <label style="grid-column:1/-1">Observaciones<textarea id="ll-obs" name="observaciones" placeholder="Ej.: terreno anegado, se suspendió el hormigonado">${esc(r?.observaciones||'')}</textarea></label>
    <div class="bar" style="grid-column:1/-1"><button class="btn primary">${r?'Actualizar día':'Guardar día'}</button>
      ${S.llF!==hoy?`<button type="button" class="btn ghost" data-act="llhoy">Ir a hoy</button>`:''}
      ${r?`<button type="button" class="btn ghost peligro" data-act="lldel">Borrar este día</button>`:''}</div>
    ${S.llConf&&r?`<div class="ll-confirm"><span>¿Borrar el registro del <b>${ddmmyy(S.llF)}</b>?</span><button type="button" class="btn peligro" data-act="llsi">Sí, borrar</button><button type="button" class="btn ghost" data-act="llno">Cancelar</button></div>`:''}
  </form>`;

  const filas=regs.slice().reverse().map(x=>`<tr class="ll-row" data-act="llday" data-f="${x.fecha}">
    <td class="num">${ddmmyy(x.fecha)}</td><td>${DC[parse(x.fecha).getDay()]}</td><td><span class="ll-pill ${x.afectacion}">${AFL[x.afectacion]}</span></td>
    <td class="n">${x.afectacion==='sin'?'—':n1(x.horas)}</td><td class="n">${n1(perdido(x))}</td><td class="n">${x.mm==null||x.mm===''?'—':x.mm}</td>
    <td class="wrap">${esc((x.actividades||[]).join(', ')||'—')}</td><td class="wrap">${esc(x.observaciones||'—')}</td></tr>`).join('');

  const salida=EN_MARCO?`<span class="sub no-print">La constancia en PDF se descarga desde tu página publicada.</span>`
    :`<button class="btn primary no-print" data-act="llpdf" ${regs.length?'':'disabled'}>Descargar constancia (PDF)</button>`;
  return `
  <div class="bar between"><div><h2>Libro de lluvias</h2><div class="sub">${esc(nombreObra())}${o?.ubicacion?' · '+esc(o.ubicacion):''} · desde ${ddmmyy(ini)}${o?.inicio?'':' (cargá el inicio de obra en Ajustes)'}</div></div><div class="bar">${salida}</div></div>
  <div class="stats">
    <div class="stat ll"><small>Días perdidos (equiv.)</small><b>${n1(eq)}</b></div>
    <div class="stat"><small>Obra parada</small><b>${tot}</b></div>
    <div class="stat"><small>Afectación parcial</small><b>${par}</b></div>
    <div class="stat"><small>Días con lluvia</small><b>${regs.length}</b></div>
  </div>
  <div class="ll-main">
    <section class="panel ll-cal" aria-label="Calendario de jornadas">
      <div class="ll-legend"><span><i class="t"></i>Obra parada</span><span><i class="p"></i>Parcial</span><span><i class="s"></i>Llovió sin afectar</span></div>
      ${meses.join('')}
    </section>
    ${form}
  </div>
  <div class="panel tw"><table>
    <thead><tr><th>Fecha</th><th>Día</th><th>Afectación</th><th class="n">Horas perd.</th><th class="n">Días perd.</th><th class="n">mm</th><th>Trabajos afectados</th><th>Observaciones</th></tr></thead>
    <tbody>${filas||'<tr><td colspan="8" class="sub">Todavía no hay días de lluvia en esta obra. Tocá un día del calendario para anotarlo.</td></tr>'}</tbody>
  </table></div>
  <p class="sub">Días perdidos = jornadas paradas + horas perdidas ÷ ${hj} en las parciales. Tocá una fila o un día para corregirlo.</p>`;
}

function buildPdfLluvias(jsPDF,recs,hoyISO,logo,info){
  const DOWL=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
  const f=s=>ddmmyy(s);
  const hj=info.hj;
  const lostD=r=>r.afectacion==='total'?1:r.afectacion==='parcial'?Math.min(1,(Number(r.horas)||0)/hj):0;
  const nf=v=>String(Math.round(v*100)/100).replace('.',',');
  const list=recs.slice().sort((a,b)=>a.fecha<b.fecha?-1:1);

  y=doc.lastAutoTable.finalY+8;

    columnStyles:{0:{cellWidth:17},1:{cellWidth:16},2:{cellWidth:17},3:{cellWidth:12,halign:'right'},4:{cellWidth:11,halign:'right'},5:{cellWidth:24},6:{cellWidth:'auto'}}});
  y=doc.lastAutoTable.finalY+6;
  if(y>240){doc.addPage();y=TOP}

async function guardarAsis(pid,campos){
  const prev=S.asis[key(pid,S.dia)]||{personal_id:pid,fecha:S.dia,ent_am:'',sal_am:'',ent_pm:'',sal_pm:'',obs:''};
  const r={...prev,...campos,obra_id:S.obra};r.horas=horasDe(r);
  S.asis[key(pid,S.dia)]=r;render();
  await DB.upsertAsis({personal_id:pid,fecha:S.dia,obra_id:S.obra,ent_am:r.ent_am,sal_am:r.sal_am,ent_pm:r.ent_pm,sal_pm:r.sal_pm,horas:r.horas,obs:r.obs||''});
  toast('Guardado');
}
document.addEventListener('click',async ev=>{
  const t=ev.target.closest('[data-tab],[data-act]');if(!t)return;
  if(t.dataset.tab){S.tab=t.dataset.tab;if(S.tab!=='contratistas')S.lastP=S.tab;S.edit=null;render();return refrescar()}
  const a=t.dataset.act;
  if(a==='dia'){S.dia=addD(S.dia,+t.dataset.n);S.abierto=null;return refrescar()}
  if(a==='hoy'){S.dia=hoy;return refrescar()}
  if(a==='sem'){const n=+t.dataset.n;
    if(S.rango){const L=ndias(S.rango.a,S.rango.b);S.rango={a:addD(S.rango.a,n*L),b:addD(S.rango.b,n*L)}}
    else S.ref=addD(S.ref,7*n);return refrescar()}
  if(a==='semhoy'){S.rango=null;S.ref=hoy;return refrescar()}
  if(a==='semanal'){if(S.rango)S.ref=S.rango.b;S.rango=null;return refrescar()}
  if(a==='rapido'){const d=parse(hoy);if(t.dataset.k==='mesant')d.setMonth(d.getMonth()-1);
    const ini=new Date(d.getFullYear(),d.getMonth(),1),fin=new Date(d.getFullYear(),d.getMonth()+1,0);
    S.rango={a:iso(ini),b:iso(fin)};return refrescar()}
  if(a==='ir'){S.dia=t.dataset.f;S.tab='cargar';S.lastP='cargar';return refrescar()}
  if(a==='marcar'){
    const pid=t.dataset.pid,k=t.dataset.k;
    if(k==='falta'){delete S.asis[key(pid,S.dia)];S.abierto=null;render();await DB.borrarAsis(pid,S.dia);return toast('Marcado ausente')}
    if(k==='otro'){S.abierto=S.abierto===pid?null:pid;return render()}
    S.abierto=null;return guardarAsis(pid,presets()[k]);
  }
  if(a==='todos'){
    const P=presets().completa;const faltan=activos().filter(p=>!S.asis[key(p.id,S.dia)]);
    for(const p of faltan){const r={personal_id:p.id,fecha:S.dia,obra_id:S.obra,...P,obs:''};r.horas=horasDe(r);S.asis[key(p.id,S.dia)]=r}
    render();for(const p of faltan){const r=S.asis[key(p.id,S.dia)];await DB.upsertAsis({...r})}
    return toast(`${faltan.length} cargados`);
  }
  if(a==='deldesc'){await DB.delDesc(t.dataset.id);S.desc=S.desc.filter(d=>d.id!==t.dataset.id);S.editDesc=null;render();return toast('Descuento eliminado')}
  if(a==='editdesc'){S.editDesc=t.dataset.id;return render()}
  if(a==='canceldesc'){S.editDesc=null;return render()}
  if(a==='nuevo'){S.edit={activo:true,obra_id:S.obra,numero:(Math.max(0,...S.personal.filter(deObra).map(p=>p.numero||0))+1)};return render()}
  if(a==='editar'){S.edit={...S.personal.find(p=>p.id===t.dataset.pid)};return render()}
  if(a==='cancelar'){S.edit=null;return render()}
  if(a==='nuevaobra'){S.editObra={activa:true};return render()}
  if(a==='editobra'){S.editObra={...S.obras.find(o=>o.id===t.dataset.id)};return render()}
  if(a==='cancelarobra'){S.editObra=null;return render()}
  if(a==='llday'){S.llF=t.dataset.f;S.llConf=false;render();if(window.innerWidth<860)document.getElementById('fll')?.scrollIntoView({behavior:'smooth'});return}
  if(a==='llhoy'){S.llF=hoy;S.llConf=false;return render()}
  if(a==='lldel'){S.llConf=true;return render()}
  if(a==='llno'){S.llConf=false;return render()}
  if(a==='llsi'){const f=S.llF;await DB.delLluvia(S.obra,f);S.lluv=S.lluv.filter(r=>r.fecha!==f);S.llConf=false;render();return toast('Día borrado')}
  if(a==='irll'){S.llF=t.dataset.f;S.llConf=false;S.tab='lluvias';S.lastP='lluvias';return refrescar()}
  if(a==='llpdf'){return descargarConstancia()}
  if(a==='imprimir'){return window.print()}
  if(a==='excel'){return exportarExcel()}
  if(a==='salir'){await SB.auth.signOut();location.reload()}
});
let deb={};
document.addEventListener('input',ev=>{
  const t=ev.target;
  if(t.id==='filtro'){S.filtro=t.value;return render()}
  if(t.dataset.pid&&t.dataset.f){const pid=t.dataset.pid,f=t.dataset.f;clearTimeout(deb[pid+f]);
    deb[pid+f]=setTimeout(()=>{if(t.type==='text'){const r=S.asis[key(pid,S.dia)];if(!r)return;r.obs=t.value;DB.upsertAsis({...r}).then(()=>toast('Guardado'))}},600)}
});
document.addEventListener('change',ev=>{
  const t=ev.target;
  if(t.id==='dia'&&t.value){S.dia=t.value;return refrescar()}
  if(t.id==='inactivos'){S.inactivos=t.checked;return render()}
  if(t.id==='ll-fecha'&&t.value){S.llF=t.value;S.llConf=false;return render()}
  if(t.name==='af'&&t.form?.id==='fll'){const h=document.getElementById('ll-horas');
    if(t.value==='total'){h.value=hJL();h.disabled=true}else if(t.value==='sin'){h.value=0;h.disabled=true}
    else{h.disabled=false;if(!(Number(h.value)>0&&Number(h.value)<hJL()))h.value=hJL()/2;h.focus()}return}
  if(t.id==='obra-sel'){elegirObra(t.value);S.edit=null;S.abierto=null;return refrescar()}
  if((t.id==='r-a'||t.id==='r-b')&&t.value){
    let{a,b}=rango();if(t.id==='r-a'){a=t.value;if(b<a)b=a}else{b=t.value;if(b<a)a=b}
    if(ndias(a,b)>MAX_DIAS){toast(`Máximo ${MAX_DIAS} días por planilla`);if(t.id==='r-a')b=addD(a,MAX_DIAS-1);else a=addD(b,-(MAX_DIAS-1))}
    S.rango={a,b};return refrescar()}
  if(t.dataset.pid&&t.dataset.f&&t.type==='time'){S.abierto=t.dataset.pid;guardarAsis(t.dataset.pid,{[t.dataset.f]:t.value})}
});
document.addEventListener('submit',async ev=>{
  ev.preventDefault();const f=ev.target;const fd=Object.fromEntries(new FormData(f));
  if(f.id==='fll'){
    const fecha=fd.fecha;const ini=inicioObra();
    if(!fecha||fecha>hoy||fecha<ini)return toast('Elegí una fecha entre el inicio de obra y hoy');

  const U=['','uno','dos','tres','cuatro','cinco','seis','siete','ocho','nueve','diez','once','doce','trece','catorce','quince','dieciséis','diecisiete','dieciocho','diecinueve','veinte','veintiuno','veintidós','veintitrés','veinticuatro','veinticinco','veintiséis','veintisiete','veintiocho','veintinueve'];

  const C=['','ciento','doscientos','trescientos','cuatrocientos','quinientos','seiscientos','setecientos','ochocientos','novecientos'];
  const c999=x=>{if(x===100)return 'cien';const c=Math.floor(x/100),r=x%100;let s=C[c];
    if(r){s+=(s?' ':'')+(r<30?U[r]:D[Math.floor(r/10)]+(r%10?' y '+U[r%10]:''))}return s};
  const parts=[];const mm=Math.floor(n/1e6),miles=Math.floor((n%1e6)/1000),resto=n%1000;
  if(mm)parts.push(mm===1?'un millón':c999(mm).replace(/uno$/,'un')+' millones');
  if(miles)parts.push(miles===1?'mil':c999(miles).replace(/uno$/,'un')+' mil');
  if(resto)parts.push(c999(resto));

function vCertificado(){
  const ult=D.certs.length?D.certs[D.certs.length-1].n:0;
  if(S.cert==null||S.cert<1)S.cert=ult||1;
  const nuevo=S.cert===ult+1;
  if(nuevo&&!S.per)S.per=propuestaPeriodo();
  const c=nuevo?{n:ult+1,pres:S.borrador}:D.certs.find(x=>x.n===S.cert);
  const ant=acumHasta(c.n-1);
  const pago=!nuevo&&D.des.find(d=>d.cert===c.n);
  const solapa=nuevo&&D.certs.find(x=>x.desde&&!(addDay(S.per,6)<x.desde||S.per>x.hasta));
  const q=(S.buscar||'').toLowerCase();
  const rows=[];let lastR=null,lastS=null;const sub={};
  let tO=0,tA=0,aO=0,aA=0,over=[];
  for(const it of D.items){
    const a=ant[it.id]||0,p=Number(c.pres[it.id]||0),ac=a+p;
    const mA=a*it.pu,mP=p*it.pu,mAc=ac*it.pu;
    if(it.sec==='ADIC'){tA+=mP;aA+=mAc}else{tO+=mP;aO+=mAc}
    sub[it.rubro]=sub[it.rubro]||{mA:0,mP:0,mAc:0,tot:0};const s=sub[it.rubro];s.mA+=mA;s.mP+=mP;s.mAc+=mAc;s.tot+=it.cant*it.pu;
    if(ac>it.cant+1e-9)over.push(it);
    const visible=(q?(it.desc+' '+it.n+' '+it.rubro).toLowerCase().includes(q):true)&&(S.soloAvance?(nuevo?it.pu>0:(ac>0||p>0)):true);
    if(!visible)continue;
    if(it.rubro!==lastR){rows.push(`<tr class="rubro"><td colspan="13">${esc(it.rubro)}</td></tr>`);lastR=it.rubro;lastS=null}
    if(it.sector&&it.sector!==lastS){rows.push(`<tr class="sector"><td></td><td colspan="12">${esc(it.sector)}</td></tr>`);lastS=it.sector}
    rows.push(`<tr class="${ac>it.cant+1e-9?'over':''} ${p?'has':''}"><td class="num">${esc(it.n)}</td><td class="desc">${esc(it.desc)}</td><td>${esc(it.unidad)}</td>
      <td class="n">${qf(it.cant)}</td><td class="n">${gs(it.pu)}</td>
      <td class="n">${qf(a)}</td>
      <td class="n pres">${nuevo?`<input type="number" step="any" min="0" id="p-${it.id}" data-id="${it.id}" value="${p||''}" aria-label="Presente ${esc(it.desc)}">`:qf(p)}</td>
      <td class="n">${qf(ac)}</td><td class="n">${it.cant?pct(ac/it.cant):''}</td>
      <td class="n">${gs(mA)}</td><td class="n">${gs(mP)}</td><td class="n">${gs(mAc)}</td>
      <td class="n">${gs(it.cant*it.pu)}</td></tr>`);
  }
  const total=tO+tA;
  const chips=D.certs.map(x=>`<button class="chip" data-cact="vercert" data-n="${x.n}" aria-pressed="${x.n===S.cert}">N°${x.n}</button>`).join('')+
    `<button class="chip nuevo" data-cact="vercert" data-n="${ult+1}" aria-pressed="${nuevo}">+ Nuevo N°${ult+1}</button>`;
  return `
  <div class="bar between"><div><h2>Certificado N°${c.n}</h2><div class="sub">${esc(D.nombre)} · ${esc(D.tipo)} · ${esc(OBRA.obra)}</div>
    ${!nuevo&&c.desde?`<div class="sub">Período <b>${ddm(c.desde)} al ${ddm(c.hasta)}</b>${pago?` · pagado el <b>${ddm(pago.fecha)}</b>`:` · pago previsto el <b>${ddm(addDay(c.hasta,1))}</b>`}</div>`:''}</div><div class="chips">${chips}</div></div>
  ${nuevo?`<div class="panel form" style="grid-template-columns:repeat(auto-fit,minmax(170px,1fr))">
    <label>Desde (sábado)<input type="date" id="c-desde" value="${S.per}"></label>
    <label>Hasta (viernes)<input type="date" value="${addDay(S.per,6)}" disabled></label>
    <label>Pago (sábado)<input type="date" value="${addDay(S.per,7)}" disabled></label>
    ${solapa?`<div class="hint rojo" style="grid-column:1/-1">Este período se superpone con el certificado N°${solapa.n} (${ddm(solapa.desde)} al ${ddm(solapa.hasta)}). Elegí la semana siguiente.</div>`:''}
  </div>`:''}
  ${nuevo?`<div class="hint amarillo">Cargá solo la columna <b>Presente</b> (lo medido esta semana). Anterior y Acumulado se calculan de los certificados ya emitidos, así no se pueden desfasar.</div>`:''}
  <div class="bar">
    <input type="search" id="buscar" placeholder="Buscar ítem o rubro" value="${esc(S.buscar)}" style="flex:1;min-width:200px">
    <label class="bar sub"><input type="checkbox" id="solo" ${S.soloAvance?'checked':''}> ${nuevo?'Solo ítems con precio':'Solo ítems con avance'}</label>
  </div>
  <div class="panel tw"><table>
    <thead>
      <tr><th colspan="5"></th><th class="grp" colspan="4">Cantidades</th><th class="grp" colspan="3">Montos Gs</th><th></th></tr>
      <tr><th>N°</th><th>Rubro</th><th>Unid.</th><th class="n">Cant.</th><th class="n">P. unit.</th><th class="n">Anterior</th><th class="n">Presente</th><th class="n">Acumulado</th><th class="n">% avance</th><th class="n">Anterior</th><th class="n">Presente</th><th class="n">Acumulado</th><th class="n">P. total</th></tr>
    </thead>
    <tbody>${rows.join('')||'<tr><td colspan="13" class="sub">Ningún ítem coincide con el filtro.</td></tr>'}</tbody>
  </table></div>
  <div class="totales">
    <div><small>Total certificado</small><b>${gs(tO)}</b></div>
    <div><small>Total adicional</small><b>${gs(tA)}</b></div>
    <div><small>Total a pagar Gs</small><b>${gs(total)}</b></div>
    <div><small>Acumulado contrato</small><b>${pct(aO/(resumen().orig||1))}</b></div>
    ${nuevo?`<button class="btn primary" data-cact="emitir" ${(!total||over.length||solapa)?'disabled':''}>Emitir certificado N°${c.n}</button>`:`<button class="btn" data-cact="pagar" data-n="${c.n}" ${pago?'disabled':''}>${pago?'Pagado el '+ddm(pago.fecha):'Registrar pago'+(c.hasta?' del '+ddm(addDay(c.hasta,1)):'')}</button>`}
    <div class="letras">En letras: ${total?letras(total)+' guaraníes':'—'}</div>
    ${over.length?`<div class="hint rojo letras">No se puede emitir: ${over.map(i=>esc(i.n+' '+i.desc.slice(0,40))).join(' · ')} supera${over.length>1?'n':''} la cantidad contratada. Si es trabajo extra, cargalo como adicional en Contrato.</div>`:''}
  </div>`;
}

  const R=resumen();const ad=D.items.filter(i=>i.sec==='ADIC');
  const certA=ad.reduce((s,i)=>s+(R.ac[i.id]||0)*i.pu,0);
  const pctA=R.orig?R.adic/R.orig:0;
  return `
  <div><h2>Adicionales</h2><div class="sub">${esc(D.nombre)} · obra extra fuera del contrato original, con su propio control y pago</div></div>
  <div class="kpis">
    <div class="kpi ${pctA>0.05?'bad':''}"><small>Total adicionales</small><b>${mill(R.adic)}</b><em>${pct(pctA)} sobre el contrato original${pctA>0.05?' · supera el 5%':''}</em></div>
    <div class="kpi"><small>Certificado</small><b>${mill(certA)}</b><em>${pct(R.adic?certA/R.adic:0)} de los adicionales</em></div>
    <div class="kpi"><small>Pagado</small><b>${mill(R.desA)}</b><em>saldo ${mill(R.adic-R.desA)}</em></div>
  </div>
  <div class="panel tw"><table>
    <thead><tr><th>N°</th><th>Adicional</th><th>Aprobado</th><th>Unid.</th><th class="n">Cant.</th><th class="n">P. unit.</th><th class="n">Total</th><th class="n">Certificado</th><th>Avance</th></tr></thead>
    <tbody>${ad.map(i=>{const a=R.ac[i.id]||0;return `<tr class="${a>i.cant+1e-9?'over':''}"><td class="num">${esc(i.n)}</td><td class="desc">${esc(i.desc)}${i.motivo?`<div class="sub">${esc(i.motivo)}</div>`:''}</td><td class="num">${i.aprobado?fdm(i.aprobado):'—'}</td><td>${esc(i.unidad)}</td><td class="n">${qf(i.cant)}</td><td class="n">${gs(i.pu)}</td><td class="n">${gs(i.cant*i.pu)}</td><td class="n">${qf(a)}</td><td>${barra(i.cant?a/i.cant:0,a>i.cant+1e-9)}</td></tr>`}).join('')||'<tr><td colspan="9" class="sub">Sin adicionales por ahora.</td></tr>'}</tbody>
    <tfoot><tr><td></td><td>Total adicionales</td><td colspan="4"></td><td class="n">${gs(R.adic)}</td><td class="n">${gs(certA)}</td><td></td></tr></tfoot>
  </table></div>
  <form class="panel form" id="f-adic">
    <h3 style="grid-column:1/-1">Agregar adicional</h3>
    <label class="wide">Descripción<input id="a-desc" name="desc" required placeholder="Ej.: Reparación de vallado por tormenta"></label>
    <label class="wide">Motivo<input id="a-mot" name="motivo" placeholder="Ej.: pedido del cliente, lluvia, cambio de proyecto"></label>
    <label>Aprobado el<input id="a-apr" name="aprobado" type="date" value="${hoy}"></label>
    <label>Unidad<input id="a-un" name="unidad" required placeholder="gl"></label>
    <label>Cantidad<input id="a-cant" name="cant" type="number" step="any" min="0" required></label>
    <label>Precio unitario Gs<input id="a-pu" name="pu" type="number" step="any" min="0" required></label>
    <button class="btn primary">Agregar adicional</button>
  </form>
  <p class="sub">Los adicionales aparecen en cada certificado debajo del contrato original, en su propio rubro, y se suman aparte como "Total adicional".</p>`;
}

const TABS=[['contratistas','Todos'],['resumen','Resumen'],['certificado','Certificados'],['desembolsos','Desembolsos'],['contrato','Contrato'],['adicionales','Adicionales']];
function render(){
  const ROOT=document.getElementById('cert-root');if(!ROOT)return;
  const o=window.ASIS_OBRA&&window.ASIS_OBRA();if(o){OBRA.obra=o.nombre;OBRA.cliente=o.cliente||'';OBRA.direccion=o.ubicacion||''}
  const oid=o?o.id:null;
  if(oid!==OBRA_CARGADA){ROOT.innerHTML='<p class="sub">Cargando contratistas…</p>';asegurar(oid);return}
  if(!D&&S.tab!=='contratistas')S.tab='contratistas';
  const V={contratistas:vContratistas,resumen:vResumen,certificado:vCertificado,desembolsos:vDesembolsos,contrato:vContrato,adicionales:vAdicionales}[S.tab];
  const foco=document.activeElement&&document.activeElement.id;
  ROOT.innerHTML=`<div class="subnav">
    <div class="subnav-p">${TABS.map(([k,t])=>`<button class="chip-p" data-ctab="${k}" aria-pressed="${S.tab===k}">${t}</button>`).join('')}</div>
    ${S.tab!=='contratistas'?`<select id="sel" aria-label="Contratista">${ALL.contratistas.map((c,i)=>`<option value="${i}" ${i===S.sel?'selected':''}>${esc(c.nombre)} · ${esc(c.tipo.replace('Mano de obra · ',''))}</option>`).join('')}</select>`:''}
  </div>${V()}`;
  if(foco){const el=document.getElementById(foco);if(el&&ROOT.contains(el))el.focus()}
  if(S.tab==='contratistas')llenarMO();
  if(S.tab==='resumen'&&D.cuadrilla)cruceHTML().then(h=>{const e=document.getElementById('cruce');if(e)e.innerHTML=h});
}
window.CERT={mount:render};
document.addEventListener('click',e=>{
  if(!document.getElementById('cert-root'))return;const t=e.target.closest('[data-ctab],[data-cact]');if(!t)return;
  if(t.dataset.ctab){S.tab=t.dataset.ctab;render();return}
  const a=t.dataset.cact;
  if(a==='abrir'){usar(+t.dataset.i);S.tab='resumen';render();window.scrollTo(0,0);return}
  if(a==='vercert'){S.cert=+t.dataset.n;S.soloAvance=true;return render()}
  if(a==='emitir'){const ult=D.certs.length?D.certs[D.certs.length-1].n:0;const pres={};for(const[k,v]of Object.entries(S.borrador))if(Number(v))pres[k]=Number(v);
    D.certs.push({n:ult+1,fecha:hoy,desde:S.per,hasta:addDay(S.per,6),pres});S.borrador={};S.per=null;S.cert=ult+1;guardar();render();return toast(`Certificado N°${ult+1} emitido`)}
  if(a==='pagar'){const c=D.certs.find(x=>x.n===+t.dataset.n);const m=montoCert(c);D.des.push({sem:D.des.length+1,fecha:c.hasta?addDay(c.hasta,1):hoy,orig:m.o,adic:m.ad,total:m.t,cert:c.n});D.des.sort((a,b)=>a.fecha<b.fecha?-1:1);guardar();render();return toast('Pago registrado en Desembolsos')}

});
document.addEventListener('input',e=>{
  if(!document.getElementById('cert-root'))return;const t=e.target;
  if(t.id==='buscar'){S.buscar=t.value;return render()}
  if(t.dataset.id){S.borrador[t.dataset.id]=t.value===''?0:Number(t.value);clearTimeout(S.k);S.k=setTimeout(render,350)}
});
document.addEventListener('change',e=>{if(!document.getElementById('cert-root'))return;if(e.target.id==='solo'){S.soloAvance=e.target.checked;render()}if(e.target.id==='contrato-todo'){S.contratoTodo=e.target.checked;return render()}if(e.target.id==='c-desde'&&e.target.value){const v=sabado(e.target.value);if(v!==e.target.value)toast('Ajustado al sábado '+v.slice(8,10)+'/'+v.slice(5,7));S.per=v;return render()}if(e.target.id==='sel'){usar(+e.target.value);if(S.tab==='contratistas')S.tab='resumen';render()}});
document.addEventListener('submit',e=>{
  if(!document.getElementById('cert-root')||!document.getElementById('cert-root').contains(e.target))return;
  e.preventDefault();e.stopImmediatePropagation();const f=e.target;const fd=Object.fromEntries(new FormData(f));
  if(f.id==='f-datos'){D.nombre=fd.nombre.trim();D.tipo=fd.tipo.trim();guardar();render();return toast('Datos guardados')}
  if(f.id==='f-nuevo'){ALL.contratistas.push({id:(crypto.randomUUID?crypto.randomUUID():'c'+Date.now()),obra_id:OBRA_CARGADA,nombre:fd.nombre.trim(),tipo:fd.tipo.trim(),cuadrilla:false,items:[],certs:[],des:[]});usar(ALL.contratistas.length-1);S.tab='contrato';guardar();render();return toast('Contratista agregado: cargá su contrato')}
  if(f.id==='f-item'){D.items.push({id:'o'+Date.now(),sec:'ORIG',rubro:fd.rubro.trim(),sector:'',n:fd.n.trim(),desc:fd.desc.trim(),unidad:fd.unidad.trim(),cant:Number(fd.cant),pu:Number(fd.pu)});guardar();render();return toast('Ítem agregado al contrato')}
  if(f.id==='f-adic'){const ad=D.items.filter(i=>i.sec==='ADIC');const n='1.'+(ad.length+1);
    D.items.push({id:'a'+Date.now(),sec:'ADIC',rubro:'ADICIONALES',sector:'',n,desc:fd.desc.trim(),motivo:(fd.motivo||'').trim(),aprobado:fd.aprobado||null,unidad:fd.unidad.trim(),cant:Number(fd.cant),pu:Number(fd.pu)});guardar();render();toast('Adicional '+n+' agregado')}
});

})();
</script>
</html>
