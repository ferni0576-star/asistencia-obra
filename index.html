  const falt=L.reduce((s,p)=>s+p.items.filter(i=>estItem(i)!=='ok').length,0);
  const q=M.q.trim().toLowerCase();
  const vis=L.filter(p=>(M.filtro==='todos'||estPed(p)===M.filtro)&&(!q||String(p.numero).includes(q)||(p.ref||'').toLowerCase().includes(q)||(p.proveedor||'').toLowerCase().includes(q)||p.items.some(i=>(i.desc||'').toLowerCase().includes(q))));
  const F=[['todos','Todos',L.length],['pend','Pendientes',cuenta.pend],['parcial','Parciales',cuenta.parcial],['ok','Completos',cuenta.ok]];
  return `
  <div class="bar between"><div><h2>Pedidos de materiales</h2><div class="sub">${esc(OB().nombre)}</div></div>
    <button class="btn primary" data-mact="nuevo">+ Nuevo pedido</button></div>
  <div class="kpis">
    <div class="kpi"><small>Pedidos</small><b>${L.length}</b><em>${cuenta.ok} completos</em></div>
    <div class="kpi"><small>Esperando llegada</small><b>${cuenta.pend+cuenta.parcial}</b><em>${cuenta.parcial} con llegada parcial</em></div>
    <div class="kpi"><small>Materiales sin llegar</small><b>${falt}</b><em>${falt?'<button class="btn sm ghost" data-mtab="faltantes" style="padding:0">Ver faltantes →</button>':'todo llegó'}</em></div>
  </div>
  <div class="bar between">
    <div class="subnav-p">${F.map(([k,t,n])=>`<button class="chip-p" data-mact="filtro" data-f="${k}" aria-pressed="${M.filtro===k}">${t} <span class="num">${n}</span></button>`).join('')}</div>
    <input type="text" id="m-buscar" placeholder="Buscar N°, referencia o material" value="${esc(M.q)}" style="flex:1;max-width:320px">
  </div>
  <div class="m-lista">${vis.map(p=>{const e=estPed(p);const n=p.items.length,ok=llegados(p);const t=total(p);
    return `<div class="panel m-card"><button class="m-abrir" data-mact="ver" data-id="${p.id}">
      <div class="m-n num">N° ${esc(p.numero)}</div>
      <div class="m-info"><b>${esc(p.ref||'Sin referencia')} ${window.APROB?window.APROB.chip('pedido',p.id):''}</b><span class="sub">${fch(p.fecha)}${p.proveedor?' · '+esc(p.proveedor):''} · ${n} ítem${n===1?'':'s'}${t?' · Gs '+gs(t):''}</span>
        <span class="m-prog" aria-label="${ok} de ${n} llegaron"><i style="width:${n?Math.round(ok/n*100):0}%"></i></span></div>
      <div class="m-est">${badge(e)}<span class="sub num">${ok}/${n}</span></div></button>
      <div class="m-acc"><span class="sub">Descargar:</span><button class="btn sm" data-mact="pdf-ped" data-id="${p.id}">PDF</button><button class="btn sm" data-mact="xls-ped" data-id="${p.id}">Excel</button></div></div>`}).join('')
    ||`<div class="panel sub" style="padding:16px">${L.length?'No hay pedidos con ese filtro.':'Todavía no hay pedidos en esta obra. Creá el primero con “+ Nuevo pedido”.'}</div>`}</div>`;
}

function filaChk(p,i,idx,conPedido){
  const e=estItem(i);const r=i.rec||{};const ab=M.abierto[i.id];
  const det=e==='ok'?`Llegó${i.cant&&r.cant!=null&&Number(r.cant)>Number(i.cant)?' '+fq(r.cant):''}${r.fecha?' el '+fdm(r.fecha):''}`:e==='parcial'?`Llegaron ${fq(r.cant)} de ${fq(i.cant)} · faltan ${fq(i.cant-r.cant)}${r.fecha?' · '+fdm(r.fecha):''}`:'Sin llegar';
  return `<div class="m-chk ${e}">
    <label class="m-box"><input type="checkbox" data-mchk="${p.id}" data-iid="${i.id}" ${e==='ok'?'checked':''} aria-label="Llegó ${esc(i.desc)}"><span></span></label>
    <div class="m-txt"><b>${esc(i.desc)}</b>
      <span class="sub">${conPedido?`N° ${esc(p.numero)} · ${esc(p.ref||'')} · `:''}<span class="num">${fq(i.cant)}</span> ${esc(i.ud||'')} · <span class="m-det ${e}">${det}</span>${r.obs?' · '+esc(r.obs):''}${(()=>{const dn=i.dest&&window.DEST_NOMBRE?window.DEST_NOMBRE(i.dest):'';return dn?' · <span class="m-dest">para '+esc(dn)+'</span>':''})()}</span></div>
    <button class="btn sm ghost" data-mact="abrir" data-iid="${i.id}" aria-expanded="${!!ab}">${ab?'Cerrar':'Parcial / nota'}</button>
    ${ab?`<div class="m-rec">
      <label>Cantidad que llegó<input type="text" inputmode="decimal" data-mrec="cant" data-pid="${p.id}" data-iid="${i.id}" value="${r.cant!=null?String(r.cant).replace('.',','):''}" placeholder="de ${fq(i.cant)}"></label>
      <label>Fecha de llegada<input type="date" data-mrec="fecha" data-pid="${p.id}" data-iid="${i.id}" value="${r.fecha||''}"></label>
      <label class="wide">Observación<input type="text" data-mrec="obs" data-pid="${p.id}" data-iid="${i.id}" value="${esc(r.obs||'')}" placeholder="Ej.: remisión 1234, llegó dañado…"></label>
    </div>`:''}
  </div>`;
}

function vVer(){
  const p=M.lista.find(x=>x.id===M.sel);if(!p){M.vista='lista';return vLista()}
  const e=estPed(p);const n=p.items.length,ok=llegados(p);const t=total(p);
  return `
  <div class="bar between"><button class="btn" data-mact="volver">← Pedidos</button>
    <div class="bar"><button class="btn sm ghost" data-mact="editar">Editar</button><button class="btn sm ghost" data-mact="duplicar">Duplicar</button>
      ${M.confirm?`<button class="btn sm" style="color:var(--bad)" data-mact="borrar">¿Borrar el pedido?</button>`:`<button class="btn sm ghost" data-mact="conf" aria-label="Borrar pedido">×</button>`}</div></div>
  ${window.APROB?window.APROB.banner('pedido',p.id,infoPed(p)):''}
  <div class="panel" style="padding:14px 16px;display:flex;flex-direction:column;gap:6px">
    <div class="bar between"><h2>Pedido N° ${esc(p.numero)}</h2>${badge(e)}</div>
    <div class="m-meta"><span><small>Fecha</small>${fch(p.fecha)}</span><span><small>Referencia</small>${esc(p.ref||'—')}</span>${p.proveedor?`<span><small>Proveedor elegido</small>${esc(p.proveedor)}</span>`:''}<span><small>Llegaron</small><b class="num">${ok} de ${n}</b></span>${t?`<span><small>Total</small><b class="num">Gs ${gs(t)}</b></span>`:''}</div>
    ${p.nota?`<div class="sub">${esc(p.nota)}</div>`:''}
    <div class="m-desc"><b>Descargar pedido</b><button class="btn primary" data-mact="pdf-ped">PDF</button><button class="btn primary" data-mact="xls-ped">Excel</button><button class="btn" data-mact="pdf-rec">PDF recepción</button></div>
  </div>
  ${window.CLI?'':vSugeridos(p)}
  <div class="panel">
    <div class="bar between" style="padding:12px 14px;border-bottom:1px solid var(--line)"><div><h3>Control de llegada a obra</h3><span class="sub">Tildá cada material cuando llega. Si llegó una parte, cargá la cantidad en “Parcial / nota”.</span></div>
      ${e!=='ok'?`<button class="btn sm" data-mact="todo">Llegó todo</button>`:`<button class="btn sm ghost" data-mact="nada">Desmarcar todo</button>`}</div>
    <div class="m-chks">${p.items.map((i,k)=>filaChk(p,i,k,false)).join('')||'<p class="sub" style="padding:14px">El pedido no tiene materiales.</p>'}</div>
  </div>`;
}


/* ---------- proveedores: directorio + sugerencias ---------- */
const RUBROS=[
 ['Corralón (arena, cemento, ladrillo)',/arena|piedra|triturad|cemento|\bcal\b|cal hidrat|ladrillo|bloque|suelo|relleno|cascote/],
 ['Hormigón elaborado',/hormig[oó]n elaborado|hormigon elaborado|h ?2[0-9]{2}/],
 ['Hierros y alambres',/varilla|hierro|alambre|malla|estribo|separador/],
 ['Maderas',/tabla|alfaj|puntal|madera|tirante|encofrado|terciad/],
 ['Chapas y techos',/chapa|teja|canaleta|cumbrera/],
 ['Electricidad',/cable|electroducto|el[eé]ctric|interruptor|tomacorriente|aislador|prensa|t[eé]rmic|preensambl|pimenton/],
 ['Plomería y sanitarios',/ca[nñ]o.*(agua|media|1\/2)|codo|uni[oó]n|\bt de\b|canilla|llave de paso|tefl[oó]n|cisterna|sisterna|inodoro|pvc|ca[nñ]o negro de media/],
 ['Impermeabilizantes y pinturas',/asf[aá]lt|impermeab|negrolin|vedacit|murokall|hidr[oó]fu|pintura|aislapol|brocha|rodillo/],
 ['Ferretería y herramientas',/clavo|bisagra|candado|cadena|disco|tornillo|tanza|hilo|cinta|balde|pala|carretilla|herramient|portacandado/],
 ['Seguridad (EPP)',/zapat[oó]n|casco|chaleco|cahaleco|guante|botas|anteojo|arn[eé]s/],
 ['Alquiler de equipos',/alquiler|motobomba|retroexcavad|sapito|compactad|andamio|mezcladora|hormigonera/]
];
const RN=RUBROS.map(x=>x[0]);
const rubroDe=d=>{const t=String(d||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');for(const[n,re]of RUBROS){const re2=new RegExp(re.source.normalize('NFD').replace(/[̀-ͯ]/g,''));if(re2.test(t))return n}return 'Otros'};
const PV={lista:null,cargando:false,edit:null,rubro:'Todos',q:'',confirm:null};
async function cargarPV(){if(PV.cargando)return;PV.cargando=true;const oid=M.oid;try{PV.lista=await window.PVB.list(oid)}catch(e){PV.lista=[]}PV.oid=oid;PV.cargando=false;render()}
const telWA=t=>{let d=String(t||'').replace(/\D/g,'');if(!d)return'';if(d.startsWith('00'))d=d.slice(2);if(d.startsWith('0'))d='595'+d.slice(1);else if(!d.startsWith('595')&&d.length<=9)d='595'+d;return d};
const mapa=q=>'https://www.google.com/maps/search/'+encodeURIComponent(q+' cerca de '+((OB()||{}).ubicacion||'Encarnación, Itapúa'));
function textoPedido(p,items,pv){const o=OB()||{};const emp=(typeof S!=='undefined'&&S.aj&&S.aj.empresa)||'Avaroga Arquitectura S.A';
  return `Hola${pv&&pv.contacto?' '+pv.contacto:''}, le escribe ${emp}. Necesitamos cotización y disponibilidad de entrega para el pedido N° ${p.numero}${p.ref?' ('+p.ref+')':''}, obra ${o.nombre||''}${o.ubicacion?' – '+o.ubicacion:''}:\n\n`+
    items.map((i,k)=>`${k+1}. ${i.desc} – ${fq(i.cant)} ${i.ud||''}`).join('\n')+`\n\nMuchas gracias.`}
function contactos(pv,p,items){const wa=telWA(pv.whatsapp||pv.telefono);const txt=p?textoPedido(p,items,pv):'';
  return `${wa?`<a class="btn sm pv-wa" target="_blank" rel="noopener" href="https://wa.me/${wa}${txt?'?text='+encodeURIComponent(txt):''}">${p?'Enviar por WhatsApp':'WhatsApp'}</a>`:''}
    ${pv.telefono?`<a class="btn sm" href="tel:${esc(String(pv.telefono).replace(/[^\d+]/g,''))}">Llamar</a>`:''}
    ${pv.email?`<a class="btn sm" href="mailto:${esc(pv.email)}${p?`?subject=${encodeURIComponent('Pedido de materiales N° '+p.numero)}&body=${encodeURIComponent(txt)}`:''}">Email</a>`:''}
    ${pv.direccion?`<a class="btn sm ghost" target="_blank" rel="noopener" href="https://www.google.com/maps/search/${encodeURIComponent(pv.direccion)}">Ubicación</a>`:''}`}
function sugerencias4(p){
  const L=PV.lista||[];const rub={};p.items.forEach(i=>{const r=rubroDe(i.desc);(rub[r]=rub[r]||[]).push(i)});
  const usados={};M.lista.forEach(q=>{if(!q.proveedor||q.id===p.id)return;q.items.forEach(i=>{const k=(i.desc||'').trim().toLowerCase();(usados[k]=usados[k]||new Set()).add(q.proveedor.trim().toLowerCase())})});
  const res=L.map(pv=>{const rs=pv.rubros||[];const nom=(pv.nombre||'').trim().toLowerCase();
    const cubre=p.items.filter(i=>rs.includes(rubroDe(i.desc))||(usados[(i.desc||'').trim().toLowerCase()]||new Set()).has(nom));
    const hist=p.items.filter(i=>(usados[(i.desc||'').trim().toLowerCase()]||new Set()).has(nom)).length;
    return{pv,cubre,hist,score:cubre.length*10+hist*3+(pv.favorito?2:0)}}).filter(x=>x.cubre.length).sort((a,b)=>b.score-a.score);
  const sinProv=Object.keys(rub).filter(r=>!res.some(x=>(x.pv.rubros||[]).includes(r)));
  const enDir=new Set(L.map(x=>(x.nombre||'').trim().toLowerCase()));
  const viejos=[...new Set(M.lista.filter(q=>q.proveedor&&!enDir.has(q.proveedor.trim().toLowerCase())).map(q=>q.proveedor.trim()))];
  return{res,rub,sinProv,viejos}}
const snap=pv=>({id:pv.id,nombre:pv.nombre,contacto:pv.contacto||'',telefono:pv.telefono||pv.whatsapp||'',email:pv.email||'',obs:''});
const esSug=(p,id)=>(p.sugeridos||[]).some(x=>x.id===id);
function picker(ctx,L){
  if(PV.lista===null){cargarPV();return '<p class="sub">Cargando tu lista…</p>'}
  if(!PV.lista.length)return `<p class="sub" style="margin:4px 0">Tu lista de proveedores está vacía. <button type="button" class="btn sm" data-mact="pv-nuevo">+ Agregar proveedor</button></p>`;
  const q=(M.pq||'').trim().toLowerCase();const ids=new Set((L||[]).map(x=>x.id));
  const vis=PV.lista.filter(pv=>!q||[pv.nombre,pv.contacto,(pv.rubros||[]).join(' ')].some(v=>(v||'').toLowerCase().includes(q))).sort((a,b)=>(ids.has(b.id)?1:0)-(ids.has(a.id)?1:0)||(b.favorito?1:0)-(a.favorito?1:0)||a.nombre.localeCompare(b.nombre));
  return `<div class="pv-pick">
    <input type="text" id="pick-q" placeholder="Buscar en mi lista (nombre o rubro)" value="${esc(M.pq||'')}">
    <div class="pv-pick-l">${vis.map(pv=>`<label class="${ids.has(pv.id)?'on':''}"><input type="checkbox" data-mpick="${pv.id}" data-ctx="${ctx}" ${ids.has(pv.id)?'checked':''}>
      <span><b>${esc(pv.nombre)}</b>${pv.favorito?' ★':''}<small>${[pv.contacto,pv.telefono].filter(Boolean).map(esc).join(' · ')}${(pv.rubros||[]).length?' · '+(pv.rubros||[]).map(r=>esc(r.split(' (')[0])).join(', '):''}</small></span></label>`).join('')||'<span class="sub">Ninguno coincide.</span>'}</div>
    <span class="sub">${ids.size} seleccionado${ids.size===1?'':'s'}</span></div>`}
function vParaCliente(p){const L=p.sugeridos||[];
  return `<div class="pv-cli">
    <div class="bar between"><div><b>Proveedores sugeridos al cliente</b> <span class="sub">· salen abajo del pedido (PDF y Excel) para que el cliente elija</span></div>
      <div class="bar"><button class="btn sm ${M.elegir?'primary':''}" data-mact="sug-lista">${M.elegir?'Listo':'Elegir de mi lista'}</button><button class="btn sm ghost" data-mact="sug-otro">+ Agregar otro</button></div></div>
    ${M.elegir?picker('ver',p.sugeridos):''}
    ${M.sugOtro?`<form class="pv-otro" id="sug-f"><input type="text" name="nombre" placeholder="Proveedor" required><input type="text" name="contacto" placeholder="Contacto"><input type="text" name="telefono" placeholder="Teléfono"><input type="text" name="obs" placeholder="Precio / plazo / obs."><button class="btn sm primary">Agregar</button><button type="button" class="btn sm ghost" data-mact="sug-otro">Cancelar</button></form>`:''}
    ${L.length?`<ol class="pv-lista">${L.map((x,k)=>`<li><div class="pv-info"><div class="bar" style="gap:6px"><b>${esc(x.nombre)}</b>${p.proveedor&&p.proveedor.trim().toLowerCase()===x.nombre.trim().toLowerCase()?'<span class="m-badge ok">Elegido por el cliente</span>':''}</div><span class="sub">${[x.contacto,x.telefono,x.email].filter(Boolean).map(esc).join(' · ')||'sin contacto'}</span></div>
      <input type="text" data-sobs="${k}" value="${esc(x.obs||'')}" placeholder="Precio, plazo u observación para el cliente">
      <div class="pv-btns"><button class="btn sm ghost" data-mact="elegido" data-k="${k}">Eligió el cliente</button><button class="btn sm ghost" data-mact="sug-up" data-k="${k}" ${k?'':'disabled'} aria-label="Subir">↑</button><button class="btn sm ghost" data-mact="sug-quitar" data-k="${k}" aria-label="Quitar">×</button></div></li>`).join('')}</ol>`
      :'<p class="sub" style="margin:4px 0 0">Todavía no elegiste proveedores para sugerir. Tocá “Sugerir al cliente” en los de abajo o agregá otro.</p>'}
  </div>`}
function vSugeridos(p){
  if(PV.lista===null){cargarPV();return '<div class="panel" style="padding:14px"><span class="sub">Buscando proveedores…</span></div>'}
  const{res,rub,sinProv,viejos}=sugerencias4(p);
  return `<div class="panel">
    <div class="bar between" style="padding:12px 14px;border-bottom:1px solid var(--line)"><div><h3>Proveedores sugeridos</h3><span class="sub">Según los materiales del pedido: ${Object.entries(rub).map(([r,i])=>esc(r)+' ('+i.length+')').join(' · ')}</span></div>
      <button class="btn sm" data-mtab="proveedores">Ver todos los proveedores</button></div>
    ${vParaCliente(p)}
    ${res.slice(0,6).map(({pv,cubre,hist})=>`<div class="pv-sug">
      <div class="pv-info"><div class="bar" style="gap:6px"><b>${esc(pv.nombre)}</b>${pv.favorito?'<span class="m-badge ok">Preferido</span>':''}${p.proveedor&&p.proveedor.trim().toLowerCase()===pv.nombre.trim().toLowerCase()?'<span class="m-badge warn">Elegido</span>':''}</div>
        <span class="sub">${pv.contacto?esc(pv.contacto)+' · ':''}${pv.telefono?esc(pv.telefono)+' · ':''}tiene ${cubre.length} de ${p.items.length} materiales${hist?' · ya le compraste '+hist:''}</span>
        <span class="sub pv-items">${cubre.slice(0,4).map(i=>esc(i.desc)).join(' · ')}${cubre.length>4?' · …':''}</span></div>
      <div class="pv-btns">${contactos(pv,p,cubre)}${esSug(p,pv.id)?`<button class="btn sm" data-mact="sug-quitarpv" data-pv="${pv.id}">✓ Sugerido</button>`:`<button class="btn sm primary" data-mact="sugerir" data-pv="${pv.id}">Sugerir al cliente</button>`}</div></div>`).join('')
      ||`<p class="sub" style="padding:12px 14px">Todavía no tenés proveedores cargados para estos materiales.</p>`}
    ${sinProv.length?`<div class="alerta"><i class="dot amarillo"></i><div><b>Sin proveedor en tu lista para:</b> ${sinProv.map(esc).join(', ')}
      <div class="bar" style="margin-top:6px">${sinProv.filter(r=>r!=='Otros').map(r=>`<a class="btn sm" target="_blank" rel="noopener" href="${mapa(r.split(' (')[0])}">Buscar ${esc(r.split(' (')[0].toLowerCase())} en el mapa</a>`).join('')}<button class="btn sm primary" data-mact="pv-nuevo" data-r="${esc(sinProv[0])}">+ Agregar proveedor</button></div></div></div>`:''}
    ${viejos.length?`<p class="sub" style="padding:0 14px 12px">Proveedores de pedidos anteriores sin contacto guardado: ${viejos.map(v=>`<button class="btn sm ghost" data-mact="pv-nuevo" data-n="${esc(v)}">${esc(v)} +</button>`).join(' ')}</p>`:''}
  </div>`}
function vProveedores(){

    .sort((a,b)=>(b.favorito?1:0)-(a.favorito?1:0)||a.nombre.localeCompare(b.nombre));

  ${PV.edit?vPVForm():''}
  <div class="subnav-p">${['Todos',...RN.filter(r=>usados.has(r))].map(r=>`<button class="chip-p" data-mact="pv-rubro" data-r="${esc(r)}" aria-pressed="${PV.rubro===r}">${esc(r.split(' (')[0])}</button>`).join('')}</div>
  <div class="pv-grid">${vis.map(pv=>`<div class="panel pv-card">
    <div class="bar between"><b>${esc(pv.nombre)}</b>${pv.favorito?'<span class="m-badge ok">Preferido</span>':''}</div>
    <span class="sub">${[pv.contacto,pv.telefono,pv.email].filter(Boolean).map(esc).join(' · ')||'Sin datos de contacto'}</span>
    ${pv.direccion?`<span class="sub">${esc(pv.direccion)}</span>`:''}
    <div class="pv-chips">${(pv.rubros||[]).map(r=>`<span>${esc(r.split(' (')[0])}</span>`).join('')}</div>

  if(a==='pv-editar'){PV.edit={...(PV.lista.find(x=>x.id===t.dataset.pv)||{})};render();window.scrollTo(0,0);return}

function avancePres(doc){if(!doc||!doc.items||!doc.items.length)return null;
  const a={...(doc.base||{})};for(const c of doc.certs||[])for(const[k,v]of Object.entries(c.pres||{}))a[k]=(a[k]||0)+v;
  let tot=0,ej=0;for(const i of doc.items){const p=(Number(i.mat)||0)+(Number(i.mo)||0);tot+=(Number(i.cant)||0)*p;ej+=Math.min(Number(i.cant)||0,a[i.id]||0)*p}
  return tot?ej/tot*100:null}

function achicar(file){return new Promise((ok,no)=>{const img=new Image();const u=URL.createObjectURL(file);
  img.onload=()=>{const M=900;let w=img.naturalWidth,h=img.naturalHeight;const k=Math.min(1,M/Math.max(w,h));w=Math.round(w*k);h=Math.round(h*k);
    const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);URL.revokeObjectURL(u);ok(c.toDataURL('image/jpeg',0.72))};
  img.onerror=()=>{URL.revokeObjectURL(u);no(new Error('img'))};img.src=u})}

  const C=[['Contratista','Tipo','Ítem','Descripción','Unidad','Cantidad','Precio unit.','Sección']];R.contratistas.forEach(c=>(c.items||[]).forEach(i=>C.push([c.nombre,c.tipo||'',i.n||'',i.desc||'',i.unidad||'',i.cant??'',i.pu??i.precio??'',i.sec||''])));add('Contratistas',C);

async function respaldo(lista){

    const nombre=lista.length===1?`Respaldo_${limpio(lista[0].nombre)}_${hoyI()}`:`Respaldo_todas_las_obras_${hoyI()}`;
    let accesos=[];try{accesos=window.USR?(await window.USR.list())||[]:[]}catch(e){}
    const json={app:'Control de Obras',version:2,empresa:S.aj.empresa,fecha:new Date().toISOString(),ajustes:S.aj,accesos,obras:R};
    if(window.XLSX){const wb=XLSX.utils.book_new();R.forEach((r,k)=>hojas(wb,r,R.length>1?String(k+1):''));await window.BAJAR_XLSX(wb,nombre+'.xlsx')}

}

(function(){
/* ============ Tareas por obra: lista, tablero y calendario; cada tarea con descripción con formato y fotos ============ */
const T={oid:undefined,lista:[],cargando:false,verHechas:false,q:'',vista:'lista',abierta:null,editDesc:false,borrador:null,prev:false,guia:false,conf:null,menu:null,mes:null,fotoGrande:null,avisoSQL:false};
try{const v=localStorage.getItem('tareas_vista');if(['lista','tablero','calendario'].includes(v))T.vista=v}catch(e){}
const hoyT=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const sumD=(s,n)=>{const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const DS=['dom','lun','mar','mié','jue','vie','sáb'];const MES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const fTxt=s=>{if(!s)return '';const h=hoyT();if(s===h)return 'hoy';if(s===sumD(h,1))return 'mañana';if(s===sumD(h,-1))return 'ayer';const d=new Date(s+'T12:00:00');return `${DS[d.getDay()]} ${s.slice(8,10)}/${s.slice(5,7)}`};
const PRI={alta:['Alta','bad'],media:['Media','warn'],baja:['Baja','ok']};
const EST={pendiente:'Pendiente',curso:'En curso',hecha:'Hecha'};
const nid=()=>(crypto.randomUUID?crypto.randomUUID():'t'+Date.now().toString(36)+Math.random().toString(36).slice(2,7));
const OB=()=>window.ASIS_OBRA&&window.ASIS_OBRA()||null;
const estado=t=>t.hecha?'hecha':(t.estado==='curso'?'curso':'pendiente');
const desc=t=>t.nota||'';
const fotos=t=>Array.isArray(t.adjuntos)?t.adjuntos:[];

async function cargar(oid){if(T.cargando)return;T.cargando=true;
  try{T.lista=await window.TDB.list(oid)}catch(e){T.lista=[];toast('No se pudieron leer las tareas. ¿Ejecutaste el SQL 12?')}
  T.oid=oid;T.cargando=false;render()}
async function guardar(t){try{const r=await window.TDB.save(t);if(r&&r.sinColumnas&&!T.avisoSQL){T.avisoSQL=true;toast('Para guardar "En curso" y las fotos ejecutá el SQL 17 en Supabase')}}catch(e){toast('No se pudo guardar la tarea. Revisá la conexión.')}}

/* ---------- texto con formato (markdown simple y seguro) ---------- */
const escT=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function enLinea(s){
  s=escT(s);
  s=s.replace(/`([^`]+)`/g,'<code>$1</code>');
  s=s.replace(/\[([^\]]+)\]\(((?:https?:\/\/|mailto:)[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  s=s.replace(/(^|[\s(])((?:https?:\/\/)[^\s<]+[^\s<.,;:)])/g,'$1<a href="$2" target="_blank" rel="noopener">$2</a>');
  s=s.replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/(^|[^*])\*([^*\s][^*]*)\*/g,'$1<i>$2</i>').replace(/(^|\W)_([^_\s][^_]*)_(?=\W|$)/g,'$1<i>$2</i>').replace(/~~([^~]+)~~/g,'<s>$1</s>');
  return s}
function md(txt,interactivo){
  const L=String(txt||'').replace(/\r/g,'').split('\n');let h='',lista=null,tabla=null;
  const cerrar=()=>{if(lista){h+=lista==='ol'?'</ol>':'</ul>';lista=null}if(tabla){h+='</tbody></table></div>';tabla=null}};
  L.forEach((ln,i)=>{let m;
    if(/^\s*\|.*\|\s*$/.test(ln)){const cel=ln.trim().slice(1,-1).split('|').map(c=>c.trim());if(cel.every(c=>/^:?-{2,}:?$/.test(c)))return;
      if(!tabla){cerrar();tabla=true;h+='<div class="md-tw"><table><thead><tr>'+cel.map(c=>`<th>${enLinea(c)}</th>`).join('')+'</tr></thead><tbody>';return}
      h+='<tr>'+cel.map(c=>`<td>${enLinea(c)}</td>`).join('')+'</tr>';return}
    if((m=ln.match(/^\s*[-*] \[( |x|X)\] (.*)$/))){if(lista!=='chk'){cerrar();lista='chk';h+='<ul class="md-chk">'}
      const ok=m[1]!==' ';h+=`<li class="${ok?'ok':''}"><label><input type="checkbox" ${ok?'checked':''} ${interactivo?`data-tline="${i}"`:'disabled'}><span>${enLinea(m[2])}</span></label></li>`;return}
    if((m=ln.match(/^\s*[-*] (.*)$/))){if(lista!=='ul'){cerrar();lista='ul';h+='<ul>'}h+=`<li>${enLinea(m[1])}</li>`;return}
    if((m=ln.match(/^\s*\d+[.)] (.*)$/))){if(lista!=='ol'){cerrar();lista='ol';h+='<ol>'}h+=`<li>${enLinea(m[1])}</li>`;return}
    cerrar();
    if((m=ln.match(/^(#{1,3}) (.*)$/))){const n=m[1].length+2;h+=`<h${n}>${enLinea(m[2])}</h${n}>`;return}
    if(/^\s*(-{3,}|\*{3,})\s*$/.test(ln)){h+='<hr>';return}
    if((m=ln.match(/^> ?(.*)$/))){h+=`<blockquote>${enLinea(m[1])}</blockquote>`;return}
    if(!ln.trim()){h+='<div class="md-sp"></div>';return}
    h+=`<p>${enLinea(ln)}</p>`});
  cerrar();return h}
const chkProg=s=>{const a=(String(s||'').match(/^\s*[-*] \[( |x|X)\] /gm)||[]);return a.length?{n:a.length,ok:a.filter(x=>/\[(x|X)\]/.test(x)).length}:null};
const plano=s=>String(s||'').replace(/^#{1,3} /gm,'').replace(/^\s*[-*] \[( |x|X)\] /gm,'').replace(/^\s*[-*] /gm,'· ').replace(/\*\*|~~|`/g,'').replace(/\[([^\]]+)\]\([^)]+\)/g,'$1').replace(/\n+/g,' ').trim();

/* ---------- vistas ---------- */
function grupos(L){const h=hoyT(),sem=sumD(h,7);const G=[['vencidas','Vencidas',[]],['hoy','Hoy',[]],['semana','Próximos 7 días',[]],['luego','Más adelante',[]],['sin','Sin fecha',[]]];
  const g=k=>G.find(x=>x[0]===k)[2];
  L.forEach(t=>{if(!t.fecha)g('sin').push(t);else if(t.fecha<h)g('vencidas').push(t);else if(t.fecha===h)g('hoy').push(t);else if(t.fecha<=sem)g('semana').push(t);else g('luego').push(t)});
  const pr={alta:0,media:1,baja:2};G.forEach(x=>x[2].sort((a,b)=>(a.fecha||'9').localeCompare(b.fecha||'9')||(pr[a.prioridad]??1)-(pr[b.prioridad]??1)));return G}
function marcas(t){const p=chkProg(desc(t));const f=fotos(t).length;const d=desc(t).trim();
  return `${estado(t)==='curso'?'<span class="tk-est">En curso</span>':''}${d?'<span class="tk-ic" title="Tiene descripción">≡</span>':''}${p?`<span class="tk-ic ${p.ok===p.n?'ok':''}" title="Lista de control">☑ ${p.ok}/${p.n}</span>`:''}${f?`<span class="tk-ic" title="Fotos">📷 ${f}</span>`:''}`}
function meta(t){const venc=!t.hecha&&t.fecha&&t.fecha<hoyT();
  return [t.fecha?`<span class="tk-f ${venc?'venc':''}">${venc?'venció ':''}${fTxt(t.fecha)}</span>`:'',t.prioridad&&t.prioridad!=='media'?`<span class="tk-p ${PRI[t.prioridad][1]}">${PRI[t.prioridad][0]}</span>`:'',t.responsable?esc(t.responsable):'',t.hecha&&t.hecha_el?'hecha '+fTxt(t.hecha_el):''].filter(Boolean).join(' · ')}
function fila(t){const venc=!t.hecha&&t.fecha&&t.fecha<hoyT();const d=plano(desc(t));
  return `<div class="tk ${t.hecha?'hecha':''} ${venc?'venc':''}">
    <label class="m-box"><input type="checkbox" data-tchk="${t.id}" ${t.hecha?'checked':''} aria-label="Hecha: ${esc(t.titulo)}"><span></span></label>
    <button class="tk-txt" data-tact="abrir" data-id="${t.id}"><b>${esc(t.titulo)}</b>
      <span class="sub">${meta(t)} ${marcas(t)}</span>${d?`<span class="tk-d">${esc(d.slice(0,140))}</span>`:''}</button>
  </div>`}
function vLista(pend,hechas,q){const G=grupos(pend);
  return `${G.filter(x=>x[2].length).map(([k,n,L])=>`<div class="panel tk-g g-${k}"><div class="tk-h"><b>${n}</b><span class="sub">${L.length}</span></div>${L.map(fila).join('')}</div>`).join('')
    ||`<div class="panel" style="padding:16px">${T.lista.length?(q?'Ninguna tarea coincide.':'No hay tareas pendientes. 👍'):'Todavía no hay tareas. Escribí la primera arriba y tocá Agregar.'}</div>`}
  ${hechas.length?`<div class="panel tk-g"><button class="tk-h tk-tog" data-tact="hechas"><b>Hechas</b><span class="sub">${hechas.length} · ${T.verHechas?'ocultar':'ver'}</span></button>${T.verHechas?hechas.map(fila).join(''):''}</div>`:''}`}
function tarjeta(t){const d=plano(desc(t));const f=fotos(t);const e=estado(t);const otros=Object.keys(EST).filter(k=>k!==e);
  return `<div class="kb-card ${t.prioridad==='alta'?'alta':''} ${!t.hecha&&t.fecha&&t.fecha<hoyT()?'venc':''}" draggable="true" data-drag="${t.id}">

    <button class="kb-t" data-tact="abrir" data-id="${t.id}"><b>${esc(t.titulo)}</b>${d?`<span class="tk-d">${esc(d.slice(0,90))}</span>`:''}</button>

  </div>`}
function vTablero(L){const pr={alta:0,media:1,baja:2};const ord=(a,b)=>(a.fecha||'9').localeCompare(b.fecha||'9')||(pr[a.prioridad]??1)-(pr[b.prioridad]??1);
  const col=k=>L.filter(t=>estado(t)===k).sort(k==='hecha'?(a,b)=>(b.hecha_el||'').localeCompare(a.hecha_el||''):ord);
  return `<div class="kb">${Object.entries(EST).map(([k,n])=>{const C=col(k);const vis=k==='hecha'&&!T.verHechas?C.slice(0,6):C;
    return `<div class="kb-col k-${k}" data-drop="${k}"><div class="kb-h"><b>${n}</b><span class="sub">${C.length}</span></div>
      <div class="kb-l">${vis.map(tarjeta).join('')||'<p class="sub kb-v">Arrastrá tareas acá</p>'}${k==='hecha'&&C.length>6?`<button class="btn sm ghost" data-tact="hechas">${T.verHechas?'Mostrar menos':'Ver las '+C.length}</button>`:''}</div></div>`}).join('')}</div>
  <p class="sub">Arrastrá las tarjetas entre columnas o usá los botones de cada tarjeta. Tocá una tarjeta para ver su descripción.</p>`}
function vCalendario(L){
  const m=T.mes||hoyT().slice(0,7);const [y,mm]=m.split('-').map(Number);const ini=new Date(y,mm-1,1);const dow=(ini.getDay()+6)%7;
  const start=sumD(m+'-01',-dow);const h=hoyT();const porDia={};L.forEach(t=>{if(t.fecha)(porDia[t.fecha]=porDia[t.fecha]||[]).push(t)});
  const sinF=L.filter(t=>!t.fecha&&!t.hecha);let cel='';
  for(let i=0;i<42;i++){const d=sumD(start,i);const fuera=d.slice(0,7)!==m;if(i>=35&&fuera&&d.slice(0,7)>m)break;const ts=(porDia[d]||[]).sort((a,b)=>(a.hecha?1:0)-(b.hecha?1:0));
    cel+=`<div class="cal-d ${fuera?'fuera':''} ${d===h?'hoy':''}" data-tact="dia" data-d="${d}"><span class="cal-n">${+d.slice(8,10)}</span>
      ${ts.slice(0,4).map(t=>`<button class="cal-t ${t.hecha?'hecha':''} p-${t.prioridad||'media'} ${!t.hecha&&d<h?'venc':''}" data-tact="abrir" data-id="${t.id}" title="${esc(t.titulo)}">${esc(t.titulo)}</button>`).join('')}${ts.length>4?`<span class="sub cal-mas">+${ts.length-4} más</span>`:''}</div>`}
  const ant=sumD(m+'-01',-1).slice(0,7),sig=sumD(m+'-01',32).slice(0,7);
  return `<div class="panel cal"><div class="bar between cal-top"><button class="btn sm" data-tact="mes" data-m="${ant}">‹</button><b>${MES[mm-1]} ${y}</b><div class="bar"><button class="btn sm ghost" data-tact="mes" data-m="${h.slice(0,7)}">Hoy</button><button class="btn sm" data-tact="mes" data-m="${sig}">›</button></div></div>

/* ---------- detalle de la tarea ---------- */
const TB=[
  ['tt','Tt',[['h1','Título'],['h2','Subtítulo'],['p','Texto normal']]],

    L.forEach(t=>{const d=plano(desc(t));const p=chkProg(desc(t));body.push(['',T2(t.titulo+(estado(t)==='curso'?' (en curso)':'')+(d?'\n'+d.slice(0,300):'')+(p?`\nLista de control: ${p.ok}/${p.n}`:'')),t.fecha?t.fecha.split('-').reverse().join('/'):'',PRI[t.prioridad||'media'][0],T2(t.responsable||'')])})});

/* ---------- edición de la descripción ---------- */
function envolver(a,b,ph){const ta=document.getElementById('tk-desc');if(!ta)return;const s=ta.selectionStart,e=ta.selectionEnd;const v=ta.value;const sel=v.slice(s,e)||ph;
  ta.value=v.slice(0,s)+a+sel+b+v.slice(e);T.borrador=ta.value;ta.focus();ta.setSelectionRange(s+a.length,s+a.length+sel.length)}
function lineas(fn){const ta=document.getElementById('tk-desc');if(!ta)return;const v=ta.value;let s=ta.selectionStart,e=ta.selectionEnd;
  const a=v.lastIndexOf('\n',s-1)+1;let b=v.indexOf('\n',e);if(b<0)b=v.length;const blk=v.slice(a,b).split('\n').map(fn).join('\n');
  ta.value=v.slice(0,a)+blk+v.slice(b);T.borrador=ta.value;ta.focus();ta.setSelectionRange(a,a+blk.length)}
function insertar(txt){const ta=document.getElementById('tk-desc');if(!ta)return;const s=ta.selectionStart;const v=ta.value;const pre=s&&v[s-1]!=='\n'?'\n':'';
  ta.value=v.slice(0,s)+pre+txt+v.slice(ta.selectionEnd);T.borrador=ta.value;ta.focus();const p=s+pre.length+txt.length;ta.setSelectionRange(p,p)}
const sinMarca=l=>l.replace(/^(#{1,3} |\s*[-*] \[( |x|X)\] |\s*[-*] |\s*\d+[.)] |> )/,'');
function accionEd(k){
  if(k==='b')return envolver('**','**','negrita');
  if(k==='i')return envolver('*','*','cursiva');
  if(k==='s')return envolver('~~','~~','tachado');
  if(k==='code')return envolver('`','`','código');
  if(k==='h1')return lineas(l=>'# '+sinMarca(l));
  if(k==='h2')return lineas(l=>'## '+sinMarca(l));
  if(k==='p')return lineas(sinMarca);
  if(k==='ul')return lineas(l=>'- '+sinMarca(l));
  if(k==='chk')return lineas(l=>'- [ ] '+sinMarca(l));
  if(k==='ol'){let n=0;return lineas(l=>(++n)+'. '+sinMarca(l))}
  if(k==='cita')return lineas(l=>'> '+sinMarca(l));
  if(k==='hr')return insertar('---\n');
  if(k==='tabla')return insertar('| Ítem | Cantidad | Observación |\n| --- | --- | --- |\n|  |  |  |\n');
  if(k==='hoy')return insertar(hoyT().split('-').reverse().join('/')+' ');
  if(k==='link'){const ta=document.getElementById('tk-desc');if(!ta)return;const s=ta.selectionStart,e=ta.selectionEnd,v=ta.value,sel=v.slice(s,e);const url=/^https?:\/\//.test(sel);
    const txt=url?'texto':(sel||'texto'),u=url?sel:'https://';const ins='['+txt+']('+u+')';ta.value=v.slice(0,s)+ins+v.slice(e);T.borrador=ta.value;ta.focus();
    const a=url?s+1:s+txt.length+3,b=url?s+1+txt.length:s+txt.length+3+u.length;ta.setSelectionRange(a,b)}
}
async function comprimir(file){return new Promise(ok=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const M=1280;let w=im.width,h=im.height;if(Math.max(w,h)>M){const k=M/Math.max(w,h);w=Math.round(w*k);h=Math.round(h*k)}
  const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);ok(c.toDataURL('image/jpeg',0.72))};im.onerror=()=>ok(null);im.src=r.result};r.onerror=()=>ok(null);r.readAsDataURL(file)})}

const dentro=e=>{const r=document.getElementById('tar-root');return r&&r.contains(e.target)};
document.addEventListener('click',async e=>{
  if(!dentro(e))return;
  const eb=e.target.closest('[data-ed]');
  if(eb){e.preventDefault();const k=eb.dataset.ed;const ta=document.getElementById('tk-desc');if(ta)T.borrador=ta.value;
    if(k==='menu'){T.menu=T.menu===eb.dataset.k?null:eb.dataset.k;render();return}
    T.menu=null;
    if(k==='prev'){T.prev=!T.prev;render();return}
    if(k==='guia'){T.guia=!T.guia;render();return}
    if(k==='img'){const i=document.getElementById('tk-foto');if(i)i.click();return}
    if(T.prev){T.prev=false;render();const t2=document.getElementById('tk-desc');if(t2)t2.focus()}
    accionEd(k);render();return}
  if(T.menu&&!e.target.closest('.ed-menu')){T.menu=null;render()}
  const b=e.target.closest('[data-tact]');if(!b)return;const a=b.dataset.tact;const t=T.lista.find(x=>x.id===(b.dataset.id||T.abierta));
  if(a==='f'){const f=document.querySelector('#tk-nf [name=fecha]');T.ultFecha=b.dataset.d===''?'':sumD(hoyT(),+b.dataset.d);if(f)f.value=T.ultFecha;document.getElementById('tk-titulo').focus();return}
  if(a==='vista'){T.vista=b.dataset.v;try{localStorage.setItem('tareas_vista',T.vista)}catch(err){}return render()}
  if(a==='abrir'&&t){e.stopPropagation();T.abierta=t.id;T.editDesc=false;T.borrador=null;T.prev=false;T.guia=false;T.conf=null;T.fotoGrande=null;return render()}
  if(a==='cerrar'){if(T.editDesc&&(T.borrador??desc(t||{}))!==desc(t||{})&&!confirm('Hay cambios sin guardar en la descripción. ¿Cerrar igual?'))return;T.abierta=null;T.editDesc=false;return render()}
  if(a==='edesc'||(a==='edesc2'&&!e.target.closest('a,input,label'))){T.editDesc=true;T.borrador=desc(t);T.prev=false;render();const ta=document.getElementById('tk-desc');if(ta){ta.focus();ta.setSelectionRange(ta.value.length,ta.value.length)}return}
  if(a==='cdesc'){T.editDesc=false;T.borrador=null;T.guia=false;return render()}
  if(a==='gdesc'&&t){const ta=document.getElementById('tk-desc');if(ta)T.borrador=ta.value;t.nota=(T.borrador||'').replace(/\s+$/,'');T.editDesc=false;T.borrador=null;T.guia=false;render();await guardar(t);return toast('Descripción guardada')}
  if(a==='verfoto'){T.fotoGrande=+b.dataset.i;return render()}
  if(a==='cerrarfoto'){T.fotoGrande=null;return render()}
  if(a==='quitafoto'&&t){t.adjuntos=fotos(t).filter((x,i)=>i!==+b.dataset.i);render();await guardar(t);return toast('Foto quitada')}
  if(a==='mover'&&t){mover(t,b.dataset.e);return}
  if(a==='mes'){T.mes=b.dataset.m;return render()}
  if(a==='dia'&&!e.target.closest('[data-tact="abrir"]')){T.ultFecha=b.dataset.d;const f=document.querySelector('#tk-nf [name=fecha]');if(f)f.value=b.dataset.d;const i=document.getElementById('tk-titulo');if(i){i.focus();i.scrollIntoView({block:'center',behavior:'smooth'})}toast('Escribí la tarea para el '+fTxt(b.dataset.d));return}
  if(a==='conf'){T.conf=b.dataset.id;return render()}
  if(a==='borrar'&&t){try{await window.TDB.del(t.id);T.lista=T.lista.filter(x=>x.id!==t.id);T.abierta=null;render();toast('Tarea borrada')}catch(err){toast('No se pudo borrar')}return}
  if(a==='hechas'){T.verHechas=!T.verHechas;return render()}
  if(a==='pdf')return pdf();
});
async function mover(t,e){if(estado(t)===e)return;t.estado=e==='hecha'?(t.estado||'pendiente'):e;t.hecha=e==='hecha';t.hecha_el=t.hecha?hoyT():null;if(!t.hecha)t.estado=e;render();await guardar(t);toast(e==='hecha'?'Tarea hecha ✓':'Movida a '+EST[e])}
document.addEventListener('change',async e=>{
  if(!dentro(e))return;const c=e.target;
  if(c.dataset.tchk){const t=T.lista.find(x=>x.id===c.dataset.tchk);if(!t)return;t.hecha=c.checked;t.hecha_el=c.checked?hoyT():null;if(!c.checked&&t.estado==='hecha')t.estado='pendiente';render();await guardar(t);if(c.checked)toast('Tarea hecha ✓');return}
  if(c.dataset.tline!=null){const t=T.lista.find(x=>x.id===T.abierta);if(!t)return;const L=desc(t).split('\n');const i=+c.dataset.tline;
    L[i]=L[i].replace(/\[( |x|X)\]/,c.checked?'[x]':'[ ]');t.nota=L.join('\n');render();await guardar(t);return}
  if(c.dataset.tprop){const t=T.lista.find(x=>x.id===T.abierta);if(!t)return;const k=c.dataset.tprop;
    if(k==='estado'){mover(t,c.value);return}
    t[k]=k==='fecha'?(c.value||null):c.value.trim();render();await guardar(t);return}
  if(c.id==='tk-tit'){const t=T.lista.find(x=>x.id===T.abierta);if(!t||!c.value.trim())return;t.titulo=c.value.trim();render();await guardar(t);return}
  if(c.id==='tk-foto'&&c.files&&c.files.length){const t=T.lista.find(x=>x.id===T.abierta);if(!t)return;const ta=document.getElementById('tk-desc');if(ta)T.borrador=ta.value;
    const nuevas=[];for(const f of [...c.files].slice(0,8)){const src=await comprimir(f);if(src)nuevas.push({id:nid(),nombre:f.name,src,fecha:hoyT()})}
    if(!nuevas.length)return toast('No se pudo leer la imagen');t.adjuntos=[...fotos(t),...nuevas];c.value='';render();await guardar(t);toast(nuevas.length>1?nuevas.length+' fotos agregadas':'Foto agregada')}
});
document.addEventListener('input',e=>{if(!dentro(e))return;if(e.target.id==='tk-q'){T.q=e.target.value;render()}if(e.target.id==='tk-desc')T.borrador=e.target.value});
document.addEventListener('keydown',e=>{
  if(!document.getElementById('tar-root'))return;
  if(e.key==='Escape'&&T.abierta){if(T.fotoGrande!=null){T.fotoGrande=null;render();return}if(T.menu){T.menu=null;render();return}if(T.editDesc){T.editDesc=false;T.borrador=null;render();return}T.abierta=null;render();return}
  const ta=e.target;if(ta.id!=='tk-desc')return;
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='b'){e.preventDefault();T.borrador=ta.value;accionEd('b');return}
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='i'){e.preventDefault();T.borrador=ta.value;accionEd('i');return}
  if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){e.preventDefault();document.querySelector('[data-tact="gdesc"]')?.click();return}
  if(e.key==='Enter'&&!e.shiftKey){const v=ta.value,s=ta.selectionStart;const a=v.lastIndexOf('\n',s-1)+1;const ln=v.slice(a,s);const m=ln.match(/^(\s*)([-*] \[( |x|X)\] |[-*] |(\d+)[.)] )(.*)$/);
    if(m){e.preventDefault();if(!m[5].trim()){ta.value=v.slice(0,a)+v.slice(s);ta.setSelectionRange(a,a)}else{const pre=m[1]+(m[4]?(+m[4]+1)+'. ':m[2].replace(/\[(x|X)\]/,'[ ]'));ta.value=v.slice(0,s)+'\n'+pre+v.slice(ta.selectionEnd);ta.setSelectionRange(s+1+pre.length,s+1+pre.length)}T.borrador=ta.value}}
});

function estPed(p){const its=p.items||[];if(!its.length)return['pend','Vacío'];const ok=its.filter(i=>i.rec&&(i.rec.cant==null||Number(i.rec.cant)>=Number(i.cant))).length;
  return ok===its.length?['ok','Llegó todo']:ok||its.some(i=>i.rec&&Number(i.rec.cant)>0)?['par','Llegó parte']:['pend','En camino']}
function resC(c){const I=Object.fromEntries((c.items||[]).map(i=>[i.id,i]));const tot=(c.items||[]).filter(i=>i.sec==='ORIG').reduce((s,i)=>s+i.cant*i.pu,0);let ce=0;
  (c.certs||[]).forEach(x=>Object.entries(x.pres||{}).forEach(([k,v])=>{const i=I[k];if(i&&i.sec==='ORIG')ce+=v*i.pu}));const cs=c.certs||[];
  return{f:tot?ce/tot:0,n:cs.length,ult:cs.length?(cs[cs.length-1].hasta||cs[cs.length-1].fecha||''):''}}

  const est=m=>m.manual!=null?m.manual:m.est;
  const L=R.M.filter(m=>(!q||m.nombre.toLowerCase().includes(q))&&(K.filtro==='todos'||(K.filtro==='pasado'?m.ped>est(m)+1e-9&&est(m)>0:K.filtro==='pend'?m.ped<est(m)-1e-9:true)));
  const pasados=R.M.filter(m=>est(m)>0&&m.ped>est(m)*1.0001).length;
  return `
  <div class="kpis">
    <div class="kpi"><small>Ítems del presupuesto con composición</small><b>${R.conC} de ${R.tot}</b><em>${R.sinF.length?`<b style="color:var(--warn)">${R.sinF.length} sin multiplicador</b> · `:''}${R.tot-R.conC?`<button class="btn sm ghost" data-kact="vista" data-v="items" style="padding:0">asignar los que faltan →</button>`:'todos asignados'}</em></div>
    <div class="kpi"><small>Materiales estimados</small><b>${R.M.filter(m=>est(m)>0).length}</b><em>para toda la obra</em></div>
    <div class="kpi"><small>Pedidos por encima de lo estimado</small><b style="${pasados?'color:var(--bad)':''}">${pasados}</b><em>${R.sinV.length?R.sinV.length+' renglones de pedidos sin vincular':'todo vinculado'}</em></div>
  </div>
  <div class="bar between"><div class="subnav-p">${[['todos','Todos'],['pend','Falta pedir'],['pasado','Pedido de más']].map(([k,t])=>`<button class="chip-p" data-kact="filtro" data-f="${k}" aria-pressed="${K.filtro===k}">${t}</button>`).join('')}</div>
    <div class="bar"><input type="text" id="k-q" placeholder="Buscar material" value="${esc(K.q)}" style="width:180px"><button class="btn" data-kact="pdf">PDF</button></div></div>
  <div class="panel tw"><table class="k-tab"><thead><tr><th>Material</th><th>Ud.</th><th class="n">Estimado</th><th class="n">Pedido</th><th class="n">Saldo</th><th style="width:22%">Avance del pedido</th></tr></thead><tbody>
    ${L.map(m=>{const e=est(m),s=e-m.ped,pc=e>0?m.ped/e:null;const ab=K.abierto===m.k;
      return `<tr class="k-row ${pc!=null&&pc>1.0001?'k-over':''}" data-kact="abrir" data-k="${esc(m.k)}"><td><b>${esc(m.nombre)}</b>${m.manual!=null?' <span class="sub">(ajustado)</span>':''}${m.sinConv.length?' <span class="k-warn">falta conversión</span>':''}</td><td>${esc(m.ud)}</td>
        <td class="n">${e?q2(e):'—'}</td><td class="n">${m.ped?q2(m.ped):'—'}</td><td class="n ${s<0?'k-neg':''}">${e?q2(s):'—'}</td>
        <td>${pc==null?'<span class="sub">no estimado</span>':`<div class="k-bar"><i style="width:${Math.min(100,pc*100)}%" class="${pc>1.0001?'r':pc>0.9?'a':''}"></i></div><span class="sub num">${Math.round(pc*100)}%</span>`}</td></tr>
      ${ab?`<tr class="k-det"><td colspan="6">${detalle(m)}</td></tr>`:''}`}).join('')||`<tr><td colspan="6" class="sub">${R.M.length?'Ningún material coincide.':'Asigná composiciones a los ítems del presupuesto para calcular los materiales.'}</td></tr>`}
  </tbody></table></div>
  ${R.sinV.length?`<div class="panel"><div class="bar between" style="padding:10px 14px;border-bottom:1px solid var(--line)"><div><b>Renglones de pedidos sin vincular</b> <span class="sub">· elegí a qué material estimado corresponden, o "No cuenta" (alquileres, EPP, herramientas)</span></div></div>
    <div class="tw"><table><tbody>${R.sinV.slice(0,80).map(x=>`<tr><td class="num">N° ${esc(x.p.numero)}</td><td>${esc(x.i.desc)}</td><td class="n">${q2(x.i.cant)} ${esc(x.i.ud||'')}</td>
      <td><select data-kalias="${esc(x.ak)}"><option value="">Elegir material…</option><option value="-">No cuenta</option>${R.M.filter(m=>m.est>0).map(m=>`<option value="${esc(m.k)}">${esc(m.nombre)} (${esc(m.ud)})</option>`).join('')}</select></td></tr>`).join('')}</tbody></table></div>
    ${R.sinV.length>80?`<p class="sub" style="padding:0 14px 10px">y ${R.sinV.length-80} más…</p>`:''}</div>`:''}
  <p class="sub">Estimado = cantidad de cada ítem del presupuesto × materiales por unidad de su composición. Es aproximado: revisá las composiciones en la pestaña <b>Composiciones</b> y ajustá a mano cualquier material tocando su fila.</p>`}
function detalle(m){const e=m.manual!=null?m.manual:m.est;
  return `<div class="k-d">
    <div><b>De dónde sale el estimado</b>${m.de.length?`<ul>${m.de.slice(0,30).map(d=>`<li>${esc(d.it.n)} ${esc(d.it.desc.slice(0,60))} <span class="sub">· ${esc(d.c.nombre)}</span> → <b>${q2(d.q)} ${esc(m.ud)}</b></li>`).join('')}${m.de.length>30?'<li class="sub">…</li>':''}</ul>`:'<p class="sub">Sin ítems del presupuesto.</p>'}
      <label class="sub k-man">Ajustar estimado a mano <input type="text" inputmode="decimal" data-kman="${esc(m.k)}" value="${m.manual!=null?q2(m.manual):''}" placeholder="${q2(m.est)}"> ${esc(m.ud)} ${m.manual!=null?`<button class="btn sm ghost" data-kact="sinman" data-k="${esc(m.k)}">Volver al calculado</button>`:''}</label></div>
    <div><b>Pedidos que lo descuentan</b>${m.pe.length?`<ul>${m.pe.map(x=>`<li>N° ${esc(x.p.numero)} · ${esc(x.i.desc)} · ${q2(x.i.cant)} ${esc(x.i.ud||'')}${x.f!==1?` × ${q2(x.f)} = <b>${q2(x.i.cant*x.f)} ${esc(m.ud)}</b>`:''} <button class="btn sm ghost" data-kact="desvincular" data-a="${esc(x.ak)}" title="No contar este renglón">×</button></li>`).join('')}</ul>`:'<p class="sub">Todavía no se pidió.</p>'}
      ${m.sinConv.map(x=>`<label class="sub k-man">N° ${esc(x.p.numero)} · ${esc(x.i.desc)} (${q2(x.i.cant)} ${esc(x.i.ud)}): 1 ${esc(x.i.ud)} = <input type="text" inputmode="decimal" data-kconv="${esc(x.ak)}" placeholder="?"> ${esc(m.ud)}</label>`).join('')}
    </div></div>`}

/* ---------- justificar pedidos: cada renglón va a un ítem del presupuesto ---------- */
const itemsP=()=>((K.pres&&K.pres.items)||[]);
const itemDe=id=>itemsP().find(i=>i.id===id);
const nomItem=it=>it?`${it.n} ${it.desc}`:'';
function sugDestino(texto){const tt=new Set(toks(texto));if(!tt.size)return null;let mejor=null,ms=0;
  for(const it of itemsP()){const ti=toks(it.desc);if(!ti.length)continue;let inter=0;ti.forEach(w=>{if(tt.has(w))inter++});
    const s=inter/Math.sqrt(ti.length*tt.size);if(inter&&s>ms){ms=s;mejor=it}}
  return ms>=0.3?mejor:null}
const optItems=sel=>{let lr=null,h='';for(const it of itemsP()){if(it.rubro!==lr){if(lr!==null)h+='</optgroup>';h+=`<optgroup label="${esc(it.rubro)}">`;lr=it.rubro}
  h+=`<option value="${it.id}" ${it.id===sel?'selected':''}>${esc((it.n+' '+it.desc).slice(0,80))}</option>`}return h+(lr!==null?'</optgroup>':'')};
function vJustificar(){
  const P=(window.MATERIALES_PEDIDOS?window.MATERIALES_PEDIDOS():[]).slice().sort((a,b)=>(b.fecha||'').localeCompare(a.fecha||'')||(b.numero||0)-(a.numero||0));
  const tot=P.reduce((s,p)=>s+p.items.length,0),just=P.reduce((s,p)=>s+p.items.filter(i=>i.dest).length,0);
  const q=K.qj.trim().toLowerCase();
  const vis=P.filter(p=>(!K.soloSinJ||p.items.some(i=>!i.dest))&&(!q||String(p.numero).includes(q)||(p.ref||'').toLowerCase().includes(q)||p.items.some(i=>(i.desc||'').toLowerCase().includes(q))));
  return `<p class="sub" style="margin:0">Indicá para qué ítem del presupuesto fue cada pedido (por ejemplo: puntales y chapas → <b>Vallado perimetral</b>; tablas → <b>Encofrado de columnas</b>). Así cada ítem muestra lo que se estimó y lo que se pidió para él, aunque la madera de encofrado no esté en la composición.</p>
  <div class="kpis"><div class="kpi"><small>Renglones justificados</small><b>${just} de ${tot}</b><em>${tot-just?(tot-just)+' sin destino':'todo justificado'}</em></div></div>
  <div class="bar between"><label class="bar sub"><input type="checkbox" id="k-solosinj" ${K.soloSinJ?'checked':''}> Solo pedidos con renglones sin destino</label><input type="text" id="k-qj" placeholder="Buscar pedido o material" value="${esc(K.qj)}" style="width:220px"></div>
  ${vis.map(p=>{const sug=sugDestino(p.ref||'');const comun=p.items.length&&p.items.every(i=>i.dest&&i.dest===p.items[0].dest)?p.items[0].dest:'';
    return `<div class="panel k-jp"><div class="k-jh"><div><b>N° ${esc(p.numero)} · ${esc(p.ref||'Sin referencia')}</b> <span class="sub">${esc((p.fecha||'').split('-').reverse().join('/'))}</span></div>
      <label class="sub k-jall">Todo el pedido para: <select data-kjall="${p.id}"><option value="">— elegir ítem —</option>${sug&&!comun?`<option value="${sug.id}">★ Sugerido: ${esc(nomItem(sug).slice(0,70))}</option>`:''}<option value="-" ${comun==='-'?'selected':''}>Obra en general (sin ítem)</option>${optItems(comun)}</select></label></div>
      <table class="k-jt"><tbody>${p.items.map(i=>{const it=itemDe(i.dest);return `<tr class="${i.dest?'':'k-sinj'}"><td>${esc(i.desc)}</td><td class="n">${q2(i.cant)} ${esc(i.ud||'')}</td>
        <td><select data-kjp="${p.id}" data-kji="${i.id}"><option value="">Sin destino</option><option value="-" ${i.dest==='-'?'selected':''}>Obra en general</option>${optItems(i.dest)}</select></td></tr>`}).join('')}</tbody></table></div>`}).join('')||'<div class="panel" style="padding:16px">No hay pedidos para mostrar.</div>'}`}
function vPorItem(pedidos){
  const est={},ped={};
  for(const it of itemsP()){if(!(it.cant>0))continue;const{c}=asignacion(it);if(!c)continue;const f=K.dat.factor[it.id]!=null?K.dat.factor[it.id]:factorAuto(it,c).f;if(f==null)continue;
    for(const m of c.mats){const cc=canon(m.mat,m.ud);const k=clave(cc);(est[it.id]=est[it.id]||{})[k]=(est[it.id][k]||{nombre:cc.nombre,ud:cc.ud,q:0});est[it.id][k].q+=f*m.cant}}
  for(const p of pedidos)for(const i of p.items||[]){if(!i.dest||i.dest==='-')continue;(ped[i.dest]=ped[i.dest]||[]).push({p,i})}
  const ids=itemsP().filter(it=>est[it.id]||ped[it.id]);
  const gen=pedidos.flatMap(p=>(p.items||[]).filter(i=>i.dest==='-').map(i=>({p,i})));
  return `<p class="sub" style="margin:0">Por cada ítem del presupuesto: materiales estimados y los pedidos que justificaste para él (en <b>Justificar pedidos</b>).</p>
  ${ids.map(it=>{const E=est[it.id]||{},J=ped[it.id]||[];const ab=K.abiertoI===it.id;
    const usados=new Set();const filas=Object.entries(E).map(([k,e])=>{const js=J.filter(x=>{const cc=canon(x.i.desc,x.i.ud);return nz(cc.nombre)===nz(e.nombre)});js.forEach(x=>usados.add(x));
      let pq=0,sinc=false;js.forEach(x=>{const u=nud(x.i.ud);if(u===e.ud)pq+=x.i.cant;else{const cv=K.dat.conv[nz(x.i.desc)+'|'+u];const kg=String(x.i.desc).match(/(\d+(?:[.,]\d+)?)\s*kg/i);const f=cv!=null?cv:(e.ud==='kg'&&kg?window.numES(kg[1]):e.ud==='kg'&&/cemento/i.test(x.i.desc)?50:null);if(f==null)sinc=true;else pq+=x.i.cant*f}});
      return `<tr><td>${esc(e.nombre)}</td><td>${esc(e.ud)}</td><td class="n">${q2(e.q)}</td><td class="n">${pq?q2(pq):'—'}${sinc?' <span class="k-warn">conv.</span>':''}</td><td class="n ${e.q-pq<0?'k-neg':''}">${q2(e.q-pq)}</td></tr>`}).join('');
    const otros=J.filter(x=>!usados.has(x));
    return `<div class="panel k-pi"><button class="k-pih" data-kact="abrirI" data-id="${it.id}"><span><b>${esc(it.n)} ${esc(it.desc)}</b><span class="sub"> · ${q2(it.cant)} ${esc(it.unidad)}</span></span><span class="sub">${Object.keys(E).length} estimado${Object.keys(E).length===1?'':'s'} · ${J.length} pedido${J.length===1?'':'s'} ${ab?'▲':'▼'}</span></button>
      ${ab?`${filas?`<div class="tw"><table><thead><tr><th>Material estimado</th><th>Ud.</th><th class="n">Estimado</th><th class="n">Pedido</th><th class="n">Saldo</th></tr></thead><tbody>${filas}</tbody></table></div>`:''}
        ${otros.length?`<div style="padding:8px 14px"><b class="sub">Otros pedidos para este ítem</b><ul class="k-ul">${otros.map(x=>`<li>N° ${esc(x.p.numero)} · ${esc(x.i.desc)} · ${q2(x.i.cant)} ${esc(x.i.ud||'')}</li>`).join('')}</ul></div>`:''}`:''}</div>`}).join('')||'<div class="panel" style="padding:16px">Todavía no hay ítems con estimado o pedidos justificados.</div>'}
  ${gen.length?`<div class="panel k-pi"><button class="k-pih" data-kact="abrirI" data-id="-"><span><b>Obra en general</b></span><span class="sub">${gen.length} renglones ${K.abiertoI==='-'?'▲':'▼'}</span></button>${K.abiertoI==='-'?`<ul class="k-ul" style="padding:8px 30px">${gen.map(x=>`<li>N° ${esc(x.p.numero)} · ${esc(x.i.desc)} · ${q2(x.i.cant)} ${esc(x.i.ud||'')}</li>`).join('')}</ul>`:''}</div>`:''}`}

function vItems(){
  const its=((K.pres&&K.pres.items)||[]).filter(i=>i.cant>0);let lr=null;const rows=[];
  for(const it of its){const a=asignacion(it);if(K.soloSin&&(a.c||a.no))continue;
    if(it.rubro!==lr){rows.push(`<tr class="rubro"><td colspan="5">${esc(it.rubro)}</td></tr>`);lr=it.rubro}
    const f=K.dat.factor[it.id];
    rows.push(`<tr><td class="num">${esc(it.n)}</td><td class="desc">${esc(it.desc)}</td><td class="n">${q2(it.cant)} ${esc(it.unidad)}</td>
      <td><select data-kasig="${it.id}" class="${a.auto?'k-auto':''}"><option value="">${a.auto?'':'Sin composición'}</option><option value="-" ${a.no?'selected':''}>No lleva materiales</option>${K.comps.map(c=>`<option value="${c.id}" ${a.c&&a.c.id===c.id?'selected':''}>${esc(c.rubro)} · ${esc(c.nombre)}</option>`).join('')}</select>${a.auto?' <span class="k-sug">sugerido</span>':''}</td>
      <td>${a.c?(()=>{const fa=factorAuto(it,a.c);return `<input type="text" inputmode="decimal" class="k-f ${fa.f==null&&f==null?'k-falta':''}" data-kfac="${it.id}" value="${f!=null?q2(f):''}" placeholder="${fa.f!=null?q2(fa.f):'?'}"> <span class="sub k-nota">${f!=null?'a mano':esc(fa.nota)} ${a.c.ud!=='gl'?esc(a.c.ud):''}</span>`})():''}</td></tr>`)}
  return `<div class="bar between"><p class="sub" style="margin:0">Cada ítem del presupuesto toma los materiales de una <b>composición</b> (lo que lleva 1 m², 1 m³, etc.). Las marcadas <span class="k-sug">sugerido</span> las eligió la app por el nombre: revisalas. El multiplicador es la cantidad del ítem; cambialo solo si hace falta.</p>
    <label class="bar sub"><input type="checkbox" id="k-solosin" ${K.soloSin?'checked':''}> Solo sin composición</label></div>
  <p class="sub" style="margin:0">El <b>multiplicador</b> pasa la cantidad del ítem a la unidad de la composición. La app lo calcula sola cuando puede (por ejemplo, encadenado en ml × la sección 0,30 × 0,15 que dice la descripción). Si queda en rojo, escribilo vos.</p>
  <div class="panel tw"><table><thead><tr><th>N°</th><th>Ítem</th><th class="n">Cantidad</th><th>Composición</th><th>Multiplicador</th></tr></thead><tbody>${rows.join('')||'<tr><td colspan="5" class="sub">No hay ítems.</td></tr>'}</tbody></table></div>`}
function vComps(){const c=K.cedit;
  return `<p class="sub" style="margin:0">Composiciones de esta obra (cada obra tiene las suyas: lo que cambies acá no afecta a otras obras). Arrancan con tu planilla "Composición Unitaria de Gastos"; podés corregirlas o crear nuevas.</p>
  ${c?`<form class="panel k-cf" id="k-cf"><div class="form" style="padding:0"><label>Rubro<input type="text" name="rubro" value="${esc(c.rubro||'')}"></label><label class="wide">Nombre<input type="text" name="nombre" value="${esc(c.nombre||'')}" required></label>
      <label>Materiales por<select name="ud">${['m2','m3','ml','un','gl'].map(u=>`<option ${u===c.ud?'selected':''}>${u}</option>`).join('')}</select></label></div>
    <table class="k-cm"><thead><tr><th>Material</th><th>Cantidad</th><th>Unidad</th><th></th></tr></thead><tbody>${c.mats.map((m,k)=>`<tr><td><input type="text" data-kcm="mat" data-i="${k}" value="${esc(m.mat)}"></td><td><input type="text" inputmode="decimal" data-kcm="cant" data-i="${k}" value="${q2(m.cant)}"></td><td><input type="text" data-kcm="ud" data-i="${k}" value="${esc(m.ud)}" style="width:70px"></td><td><button type="button" class="btn sm ghost" data-kact="cmquitar" data-i="${k}">×</button></td></tr>`).join('')}</tbody></table>
    <div class="bar"><button type="button" class="btn sm" data-kact="cmagregar">+ Material</button><button class="btn primary">Guardar composición</button><button type="button" class="btn ghost" data-kact="cancomp">Cancelar</button>
      ${c.id&&K.comps.some(x=>x.id===c.id)?(K.cdel===c.id?`<button type="button" class="btn" style="color:var(--bad)" data-kact="delcomp">¿Borrar?</button>`:`<button type="button" class="btn ghost" data-kact="confcomp">Borrar</button>`):''}</div></form>`
    :`<button class="btn primary" data-kact="nuevacomp" style="align-self:flex-start">+ Nueva composición</button>`}
  <div class="k-cgrid">${K.comps.map(x=>`<button class="panel k-cc" data-kact="editcomp" data-id="${x.id}"><span class="sub">${esc(x.rubro)} · por ${esc(x.ud)}</span><b>${esc(x.nombre)}</b><span class="sub">${x.mats.map(m=>`${esc(m.mat)} ${q2(m.cant)} ${esc(m.ud)}`).join(' · ')}</span></button>`).join('')}</div>`}

function render(){
  const root=document.getElementById('cmp-root');if(!root)return;const o=window.ASIS_OBRA&&window.ASIS_OBRA();const oid=o?o.id:null;
  if(oid!==K.oid){root.innerHTML='<p class="sub">Calculando materiales…</p>';cargar(oid);return}
  if(!K.pres||!(K.pres.items||[]).length){root.innerHTML='<div class="panel" style="padding:16px">Esta obra todavía no tiene presupuesto. Cargalo en <b>Presupuesto</b> (podés subir tu Excel) y acá se calculan los materiales de toda la obra.</div>';return}
  const foco=document.activeElement&&document.activeElement.id;
  const R=calcular(window.MATERIALES_PEDIDOS?window.MATERIALES_PEDIDOS():[]);K.ultimo=R;
  root.innerHTML=`<div class="bar between"><div><h2>Estimado vs pedido</h2><div class="sub">${esc(o.nombre)} · materiales de toda la obra según el presupuesto, descontando lo ya pedido</div></div></div>
    <div class="subnav-p">${[['mat','Materiales'],['just','Justificar pedidos'],['poritem','Por ítem'],['items','Composición por ítem'],['comps','Composiciones']].map(([k,t])=>`<button class="chip-p" data-kact="vista" data-v="${k}" aria-pressed="${K.vista===k}">${t}</button>`).join('')}</div>
    ${K.vista==='items'?vItems():K.vista==='comps'?vComps():K.vista==='just'?vJustificar():K.vista==='poritem'?vPorItem(window.MATERIALES_PEDIDOS?window.MATERIALES_PEDIDOS():[]):vMateriales(R)}`;
  if(foco){const el=document.getElementById(foco);if(el&&root.contains(el)){el.focus();if(el.setSelectionRange&&el.type==='text')el.setSelectionRange(el.value.length,el.value.length)}}}
window.DEST_NOMBRE=id=>id==='-'?'obra en general':(()=>{const it=itemDe(id);return it?(it.n+' '+it.desc).slice(0,50):''})();
window.COMPUTO={mount:render,reset:()=>{K.oid=undefined}};

function pdf(){if(!PDFK.ok())return;const o=window.ASIS_OBRA()||{};const R=K.ultimo;const doc=PDFK.nuevo('portrait');
  let y=PDFK.titulo(doc,'MATERIALES: ESTIMADO VS PEDIDO',[['Obra:',o.nombre],['Al:',new Date().toLocaleDateString('es-PY')],['Ítems con composición:',R.conC+' de '+R.tot]]);
  PDFK.tabla(doc,{startY:y,head:[['Material','Ud.','Estimado','Pedido','Saldo','%']],body:R.M.filter(m=>(m.manual??m.est)>0||m.ped>0).map(m=>{const e=m.manual??m.est;return[m.nombre,m.ud,e?q2(e):'—',m.ped?q2(m.ped):'—',e?q2(e-m.ped):'—',e?Math.round(m.ped/e*100)+'%':'']}),
    columnStyles:{1:{cellWidth:14},2:{halign:'right',cellWidth:26},3:{halign:'right',cellWidth:26},4:{halign:'right',cellWidth:26},5:{halign:'right',cellWidth:14}},
    didParseCell:d=>{if(d.section==='body'&&d.column.index===4&&String(d.cell.raw).startsWith('-'))d.cell.styles.textColor=[180,30,30]}});
  PDFK.cerrar(doc,`Materiales_estimado_vs_pedido_${o.nombre||''}`)}

const dentro=e=>{const r=document.getElementById('cmp-root');return r&&r.contains(e.target)};
document.addEventListener('click',async e=>{
  if(!dentro(e))return;const t=e.target.closest('[data-kact]');if(!t)return;const a=t.dataset.kact;
  if(e.target.closest('input,select,label')&&a==='abrir')return;
  if(a==='vista'){K.vista=t.dataset.v;K.cedit=null;return render()}
  if(a==='filtro'){K.filtro=t.dataset.f;return render()}
  if(a==='abrirI'){K.abiertoI=K.abiertoI===t.dataset.id?null:t.dataset.id;return render()}
  if(a==='abrir'){K.abierto=K.abierto===t.dataset.k?null:t.dataset.k;return render()}
  if(a==='sinman'){delete K.dat.manual[t.dataset.k];guardar();return render()}
  if(a==='desvincular'){K.dat.alias[t.dataset.a]='-';guardar();toast('Ese renglón ya no se descuenta');return render()}
  if(a==='pdf')return pdf();
  if(a==='nuevacomp'){K.cedit={rubro:'',nombre:'',ud:'m2',mats:[{mat:'',cant:0,ud:'kg'}]};return render()}
  if(a==='editcomp'){const c=K.comps.find(x=>x.id===t.dataset.id);K.cedit=JSON.parse(JSON.stringify(c));K.cdel=null;render();window.scrollTo(0,0);return}
  if(a==='cancomp'){K.cedit=null;return render()}
  if(a==='cmagregar'){K.cedit.mats.push({mat:'',cant:0,ud:'kg'});return render()}
  if(a==='cmquitar'){K.cedit.mats.splice(+t.dataset.i,1);return render()}
  if(a==='confcomp'){K.cdel=K.cedit.id;return render()}
  if(a==='delcomp'){try{await window.CMB.delComp(K.oid,K.cedit.id);K.comps=K.comps.filter(x=>x.id!==K.cedit.id);K.cedit=null;render();toast('Composición borrada')}catch(err){toast('No se pudo borrar')}return}
});
document.addEventListener('change',e=>{
  if(!dentro(e))return;const t=e.target;
  if(t.dataset.kjall){const p=(window.MATERIALES_PEDIDOS()||[]).find(x=>x.id===t.dataset.kjall);if(!p||!t.value)return;p.items.forEach(i=>i.dest=t.value);window.MDB.save(p).catch(()=>toast('No se pudo guardar'));toast(`Pedido N° ${p.numero} justificado`);return render()}
  if(t.dataset.kjp){const p=(window.MATERIALES_PEDIDOS()||[]).find(x=>x.id===t.dataset.kjp);const i=p&&p.items.find(x=>x.id===t.dataset.kji);if(!i)return;if(t.value)i.dest=t.value;else delete i.dest;window.MDB.save(p).catch(()=>toast('No se pudo guardar'));return render()}
  if(t.id==='k-solosinj'){K.soloSinJ=t.checked;return render()}
  if(t.dataset.kasig){if(t.value)K.dat.asign[t.dataset.kasig]=t.value;else delete K.dat.asign[t.dataset.kasig];delete K.dat.factor[t.dataset.kasig];guardar();return render()}
  if(t.dataset.kfac){const v=window.numES(t.value);if(v==null)delete K.dat.factor[t.dataset.kfac];else K.dat.factor[t.dataset.kfac]=v;guardar();return render()}
  if(t.dataset.kalias){if(t.value)K.dat.alias[t.dataset.kalias]=t.value;guardar();return render()}
  if(t.dataset.kman){const v=window.numES(t.value);if(v==null)delete K.dat.manual[t.dataset.kman];else K.dat.manual[t.dataset.kman]=v;guardar();return render()}
  if(t.dataset.kconv){const v=window.numES(t.value);if(v!=null&&v>0){K.dat.conv[t.dataset.kconv]=v;guardar();render()}return}
  if(t.id==='k-solosin'){K.soloSin=t.checked;return render()}
});
document.addEventListener('input',e=>{if(!dentro(e))return;const t=e.target;
  if(t.id==='k-q'){K.q=t.value;return render()}
  if(t.id==='k-qj'){K.qj=t.value;return render()}
  if(t.dataset.kcm&&K.cedit){const m=K.cedit.mats[+t.dataset.i];m[t.dataset.kcm]=t.dataset.kcm==='cant'?(window.numES(t.value)||0):t.value}});
document.addEventListener('submit',async e=>{if(!dentro(e))return;e.preventDefault();e.stopImmediatePropagation();const f=e.target;if(f.id!=='k-cf')return;
  const fd=Object.fromEntries(new FormData(f));const c={...K.cedit,rubro:fd.rubro.trim(),nombre:fd.nombre.trim(),ud:fd.ud,mats:K.cedit.mats.filter(m=>m.mat.trim()&&m.cant>0).map(m=>({mat:m.mat.trim(),cant:m.cant,ud:m.ud.trim()||'un'}))};
  if(!c.nombre)return toast('Poné un nombre');if(!c.mats.length)return toast('Agregá al menos un material');if(!c.id)c.id=crypto.randomUUID?crypto.randomUUID():'c'+Date.now();
  c.obra_id=K.oid;try{await window.CMB.saveComp(c)}catch(err){return toast('No se pudo guardar. ¿Ejecutaste el SQL 13?')}
  const i=K.comps.findIndex(x=>x.id===c.id);if(i>=0)K.comps[i]=c;else K.comps.push(c);K.cedit=null;render();toast('Composición guardada')},true);

`;document.head.appendChild(css);
})();

const O={oid:undefined,cargando:false,personas:[],ots:[],form:null,vista:'nueva',q:'',cargo:'Todos',pedit:null,pconf:null,cconf:null};
const hoyO=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const fOT=s=>s?s.split('-').reverse().join('.'):'';
const DSO=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];const fDia=s=>{if(!s)return '';const d=new Date(s+'T12:00:00');return DSO[d.getDay()]+' '+s.split('-').reverse().join('/')};
const periodo=d=>d.desde&&d.hasta&&d.hasta!==d.desde?`Del ${fDia(d.desde)} al ${fDia(d.hasta)}`:d.desde?(d.hasta?`${fDia(d.desde)} (un día)`:`Desde el ${fDia(d.desde)}`):'';
const dias=d=>d.desde&&d.hasta?Math.round((new Date(d.hasta)-new Date(d.desde))/864e5)+1:0;
const ciTxt=c=>{const d=String(c||'').replace(/\D/g,'');return d?gs(+d):String(c||'')};
const nid=()=>(crypto.randomUUID?crypto.randomUUID():'o'+Date.now().toString(36)+Math.random().toString(36).slice(2,7));
const OB=()=>window.ASIS_OBRA&&window.ASIS_OBRA()||null;

function selDe(d){const busca=p=>{const ci=String(p.ci||'').replace(/\D/g,'');const x=O.personas.find(y=>y.id===p.pid)||O.personas.find(y=>ci&&String(y.ci||'').replace(/\D/g,'')===ci)||O.personas.find(y=>y.nombre.toLowerCase()===String(p.nombre||'').toLowerCase());return x?{pid:x.id,obs:p.obs||''}:null};return(d.personas||[]).map(busca).filter(Boolean)}
function nuevoForm(base){const o=OB()||{};const ult=base||O.ots[0];const d=ult?JSON.parse(JSON.stringify(ult.datos)):null;
  return{id:nid(),numero:String((O.ots.reduce((m,x)=>Math.max(m,parseInt(x.numero)||0),0))+1),fecha:hoyO(),desde:hoyO(),hasta:'',
    contratista:d?d.contratista:'VANGUARD S.A',ruc:d?d.ruc:'80095183-2',direccion:d?d.direccion:(o.ubicacion||''),obra:d?d.obra:(o.nombre||''),

    sel:d&&base?selDe(d):[]}}
async function cargar(oid){if(O.cargando)return;O.cargando=true;
  try{[O.personas,O.ots]=await Promise.all([window.OTB.personas(oid),window.OTB.list(oid)]);O.ots.sort((a,b)=>(b.fecha||'').localeCompare(a.fecha||'')||(parseInt(b.numero)||0)-(parseInt(a.numero)||0))}
  catch(e){O.personas=O.personas||[];O.ots=[];toast('No se pudieron leer las OT. ¿Ejecutaste el SQL 14?')}
  O.oid=oid;O.cargando=false;O.form=nuevoForm(null);render()}

/* ---------- PDF (formato de la planilla) ---------- */
async function pdfOT(num,fecha,d){
  if(!window.jspdf||!window.jspdf.jsPDF||!window.jspdf.jsPDF.API.autoTable)return toast('No se pudo cargar el generador de PDF');
  const doc=new window.jspdf.jsPDF({unit:'mm',format:'a4'});const X=14,W=182;const T=window.pdfTxt||(x=>x);

  doc.setFont('helvetica','bold');doc.setFontSize(13);doc.text('ORDEN DE TRABAJO',X+118+32,num?22.5:25,{align:'center'});if(num){doc.setFontSize(11);doc.text('N° '+T(String(num)),X+118+32,29,{align:'center'})}
  doc.autoTable({startY:34,margin:{left:X,right:14},theme:'grid',tableWidth:W,styles:{font:'helvetica',fontSize:8.5,cellPadding:1.3,textColor:0,lineColor:0,lineWidth:0.2},
    columnStyles:{0:{cellWidth:38,fontStyle:'bold'},1:{cellWidth:W-38}},
    body:[['Fecha de la OT:',fOT(fecha)],...(periodo(d)?[['Período de trabajos:',T(periodo(d))]]:[]),['Contratista:',T(d.contratista||'')],['C.I. N° / RUC N°:',T(d.ruc||'')],['Dirección:',T(d.direccion||'')],['Obra:',T(d.obra||'')],['Servicio:',T(d.servicio||'')],['Horario de trabajo:',T(d.horario||'')]]});
  const body=[];for(let k=0;k<filas;k++){const p=P[k];body.push([k+1,p?T(p.nombre):'',p?ciTxt(p.ci):'',p?T(p.cargo||''):'',p?T(p.obs||''):''])}
  doc.autoTable({startY:doc.lastAutoTable.finalY,margin:{left:X,right:14,top:14,bottom:14},theme:'grid',tableWidth:W,
    head:[['ÍTEMS','NOMBRE Y APELLIDO','CI','CARGO','OBS']],body,
    styles:{font:'helvetica',fontSize:8.5,cellPadding:1.2,textColor:0,lineColor:0,lineWidth:0.2,minCellHeight:5.6},headStyles:{fillColor:[235,235,235],textColor:0,fontStyle:'bold',halign:'center'},
    columnStyles:{0:{cellWidth:16,halign:'center'},1:{cellWidth:72},2:{cellWidth:26,halign:'right'},3:{cellWidth:32,halign:'center'},4:{cellWidth:36}}});
  let y=doc.lastAutoTable.finalY;if(y>215){doc.addPage();y=14}
  doc.autoTable({startY:y+3,margin:{left:X,right:14},theme:'grid',tableWidth:W,styles:{font:'helvetica',fontSize:7.8,cellPadding:1.6,textColor:0,lineColor:0,lineWidth:0.2},
    head:[[{content:'Condiciones Particulares',styles:{fontStyle:'normal',fontSize:7,fillColor:false}}]],body:[[{content:T(d.cond||''),styles:{fontStyle:'bold'}}]]});
  y=doc.lastAutoTable.finalY+3;const cw=W/3;
  doc.rect(X,y,W,26);[1,2].forEach(i=>doc.line(X+cw*i,y,X+cw*i,y+26));doc.line(X,y+20,X+W,y+20);
  doc.setFont('helvetica','normal');doc.setFontSize(8);[d.f1,d.f2,d.f3].forEach((n,i)=>{if(n)doc.text(T(n),X+cw*i+cw/2,y+18,{align:'center'})});
  doc.setFont('helvetica','bold');['Proveedor/ Contratista','Supervisor de Obras','Seguridad Física'].forEach((t,i)=>doc.text(t,X+cw*i+cw/2,y+24.2,{align:'center'}));
  await window.BAJAR(`OT_${String(num).replace(/[^\w-]+/g,'_').padStart(2,'0')}_${(d.obra||'obra').replace(/[^\wáéíóúñÁÉÍÓÚÑ]+/g,'_').slice(0,40)}_${fecha}.pdf`,doc.output('blob'));

/* ---------- Excel con formato (ExcelJS) ---------- */
let xlP=null;const exceljs=()=>xlP||(xlP=new Promise((ok,no)=>{if(window.ExcelJS)return ok(window.ExcelJS);const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js';s.onload=()=>ok(window.ExcelJS);s.onerror=()=>{xlP=null;no(new Error('exceljs'))};document.head.appendChild(s)}));
async function xlsOT(num,fecha,d){
  let EX;try{EX=await exceljs()}catch(e){return toast('No se pudo cargar el generador de Excel')}
  const wb=new EX.Workbook();const ws=wb.addWorksheet(('OT_'+String(num).replace(/[^\w-]+/g,'_').padStart(2,'0')).slice(0,31),{pageSetup:{paperSize:9,orientation:'portrait',fitToPage:true,fitToWidth:1,fitToHeight:0,margins:{left:0.4,right:0.4,top:0.5,bottom:0.5,header:0.2,footer:0.2}}});
  ws.columns=[{width:15.4},{width:34.4},{width:13.8},{width:14},{width:13.1},{width:9}];
  const fino={style:'thin',color:{argb:'FF000000'}};const borde={top:fino,left:fino,bottom:fino,right:fino};
  const caja=(r1,c1,r2,c2)=>{for(let r=r1;r<=r2;r++)for(let c=c1;c<=c2;c++)ws.getCell(r,c).border=borde};
  ws.mergeCells('A1:C1');ws.mergeCells('D1:F1');ws.getRow(1).height=62;
  const t=ws.getCell('D1');t.value=num?'ORDEN DE TRABAJO\nN° '+num:'ORDEN DE TRABAJO';t.font={bold:true,size:14};t.alignment={horizontal:'center',vertical:'middle',wrapText:true};caja(1,1,1,6);
  try{const lg=d.logo||OT_LOGO_DEF;const ext=/image\/jpe?g/.test(lg)?'jpeg':'png';const id=wb.addImage({base64:lg,extension:ext});ws.addImage(id,{tl:{col:0.4,row:0.15},ext:{width:250,height:70}})}catch(e){}
  const enc=[['Fecha de la OT:',fOT(fecha)],...(periodo(d)?[['Período de trabajos:',periodo(d)]]:[]),['Contratista:',d.contratista],['C.I.N°/ Ruc N°:',d.ruc],['Dirección:',d.direccion],['Obra:',d.obra],['Servicio:',d.servicio],['Horario de trabajo',d.horario]];
  enc.forEach(([k,v],i)=>{const r=2+i;ws.getCell(r,1).value=k;ws.getCell(r,1).font={size:9};ws.mergeCells(r,2,r,6);ws.getCell(r,2).value=v||'';ws.getCell(r,2).font={size:9};caja(r,1,r,6)});
  const h=2+enc.length;['ÍTEMS','NOMBRE Y APELLIDO','CI','CARGO','OBS'].forEach((x,i)=>{const c=ws.getCell(h,i+1);c.value=x;c.font={bold:true,size:9};c.alignment={horizontal:'center'};c.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFEBEBEB'}}});
  ws.mergeCells(h,5,h,6);caja(h,1,h,6);
  const P=d.personas||[];const filas=Math.max(P.length,22);
  for(let k=0;k<filas;k++){const r=h+1+k;const p=P[k];ws.getCell(r,1).value=k+1;ws.getCell(r,1).alignment={horizontal:'center'};
    if(p){ws.getCell(r,2).value=p.nombre;const n=Number(String(p.ci).replace(/\D/g,''));const ci=ws.getCell(r,3);ci.value=n||p.ci;if(n)ci.numFmt='#,##0';ws.getCell(r,4).value=p.cargo||'';ws.getCell(r,4).alignment={horizontal:'center'};ws.getCell(r,5).value=p.obs||''}
    ws.mergeCells(r,5,r,6);caja(r,1,r,6)}
  let r=h+filas+2;ws.getCell(r,1).value='Condiciones Particulares';ws.getCell(r,1).font={size:8};ws.mergeCells(r,1,r,6);
  r++;ws.mergeCells(r,1,r,6);const cc=ws.getCell(r,1);cc.value=d.cond||'';cc.font={bold:true,size:9};cc.alignment={wrapText:true,vertical:'top'};ws.getRow(r).height=62;caja(r,1,r,6);
  r+=2;ws.getRow(r).height=40;ws.mergeCells(r,1,r,2);ws.mergeCells(r,3,r,4);ws.mergeCells(r,5,r,6);caja(r,1,r+2,6);
  r++;[[1,2,d.f1],[3,4,d.f2],[5,6,d.f3]].forEach(([a,b,v])=>{ws.mergeCells(r,a,r,b);const c=ws.getCell(r,a);c.value=v||'';c.alignment={horizontal:'center'};c.font={size:9}});
  r++;[[1,2,'Proveedor/ Contratista'],[3,4,'Supervisor de Obras'],[5,6,'Seguridad Física']].forEach(([a,b,v])=>{ws.mergeCells(r,a,r,b);const c=ws.getCell(r,a);c.value=v;c.alignment={horizontal:'center'};c.font={bold:true,size:9}});
  const buf=await wb.xlsx.writeBuffer();
  await window.BAJAR(`OT_${String(num).replace(/[^\w-]+/g,'_').padStart(2,'0')}_${(d.obra||'obra').replace(/[^\wáéíóúñÁÉÍÓÚÑ]+/g,'_').slice(0,40)}_${fecha}.xlsx`,new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
}

/* ---------- eventos ---------- */
const dentro=e=>{const r=document.getElementById('ot-root');return r&&r.contains(e.target)};
async function guardarP(){const p={...O.pedit,nombre:(document.getElementById('op-nombre').value||'').trim().replace(/\s+/g,' '),ci:(document.getElementById('op-ci').value||'').trim(),cargo:(document.getElementById('op-cargo').value||'').trim()};
  if(!p.nombre)return toast('Poné el nombre');const nuevo=!p.id;if(!p.id)p.id=nid();p.obra_id=O.oid;
  try{await window.OTB.savePersona(p)}catch(e){return toast('No se pudo guardar. ¿Ejecutaste el SQL 14?')}

  if(nuevo&&O.vista==='nueva'&&!O.form.sel.some(s=>s.pid===p.id))O.form.sel.push({pid:p.id,obs:''});O.pedit=null;render();toast(nuevo?'Persona agregada':'Persona actualizada')}
document.addEventListener('click',async e=>{
  if(!dentro(e))return;const t=e.target.closest('[data-oact]');if(!t)return;const a=t.dataset.oact;if(O.vista==='nueva')leerCampos();
