<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Control de Obras</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: herramienta de obra — cabecera fija, contenido en una columna, barra de pestañas abajo en el celular */
:root{
  --bg:#eef0ef; --panel:#ffffff; --ink:#1d2321; --muted:#5f6a66; --line:#d5dad7;
  --accent:#f2b705; --accent-ink:#1d2321; --ok:#1f7a5a; --ok-bg:#dcefe6; --warn:#a15c00; --warn-bg:#fbedd2;
  --bad:#b3261e; --bad-bg:#f8dedb; --chip:#e4e8e6; --edit:#fff8dc; --bar:#c9cfcc;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141817; --panel:#1d2321; --ink:#e8ecea; --muted:#9aa5a1; --line:#2f3835;
  --accent:#f2b705; --accent-ink:#141817; --ok:#5fcf9f; --ok-bg:#163a2c; --warn:#f0b35a; --warn-bg:#3a2a12;
  --bad:#ff8a80; --bad-bg:#3d1a17; --chip:#28302d; --edit:#2e2a14; --bar:#3a4441; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141817; --panel:#1d2321; --ink:#e8ecea; --muted:#9aa5a1; --line:#2f3835;
  --accent:#f2b705; --accent-ink:#141817; --ok:#5fcf9f; --ok-bg:#163a2c; --warn:#f0b35a; --warn-bg:#3a2a12;
  --bad:#ff8a80; --bad-bg:#3d1a17; --chip:#28302d; --edit:#2e2a14; --bar:#3a4441; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--ink);color:var(--bg);
  padding:10px 16px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;min-width:0}
.brand b{font-family:var(--f-display);font-size:22px;letter-spacing:.02em;text-transform:uppercase;line-height:1}
.brand span{font-size:13px;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand b i{font-style:normal;color:var(--accent)}
.obra-sel{margin-top:4px;background:transparent;color:var(--bg);border:1px solid color-mix(in srgb,var(--bg) 35%,transparent);border-radius:6px;padding:4px 8px;font-size:14px;max-width:100%}
.obra-sel option{color:var(--ink);background:var(--panel)}
nav.tabs{display:flex;gap:4px}
nav.tabs button{background:transparent;border:0;color:var(--bg);opacity:.7;padding:8px 12px;border-radius:8px;
  font-family:var(--f-display);font-size:17px;letter-spacing:.03em;text-transform:uppercase}
nav.tabs button[aria-current="true"]{opacity:1;background:var(--accent);color:var(--accent-ink)}
@media (max-width:760px){
  nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--ink);justify-content:space-around;
    padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:30}
  nav.tabs button{padding:8px 6px;font-size:15px}
  main{padding-bottom:84px!important}
}
.demo{background:var(--warn-bg);color:var(--warn);padding:8px 16px;font-size:13px;text-align:center}
main{max-width:1100px;margin:0 auto;padding:16px;padding-block:16px 40px;display:flex;flex-direction:column;gap:14px}
h2{font-family:var(--f-display);font-weight:700;font-size:28px;margin:0;text-transform:uppercase;letter-spacing:.02em;text-wrap:balance}
h3{font-family:var(--f-display);font-weight:600;font-size:20px;margin:0}
.sub{color:var(--muted);font-size:14px}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.bar.between{justify-content:space-between}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:9px 14px;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.icon{padding:9px 13px;font-family:var(--f-num)}
.btn:disabled{opacity:.5;cursor:default}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=email],input[type=password],select{
  background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-width:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.stat small{display:block;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.stat b{font-family:var(--f-num);font-size:20px}

/* Cargar */
.daynav{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.daynav .dlabel{font-family:var(--f-display);font-size:22px;font-weight:600;text-transform:capitalize}
.lista{display:flex;flex-direction:column}
.fila{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;align-items:center;padding:10px 12px;border-top:1px solid var(--line)}
.fila:first-child{border-top:0}
.fila .who b{display:block;font-weight:600}
.fila .who small{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.05em}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:8px 10px;font-weight:600;font-size:14px;border-left:1px solid var(--line)}
.seg button:first-child{border-left:0}
.seg button.on{background:var(--ok-bg);color:var(--ok)}
.seg button.on.parcial{background:var(--warn-bg);color:var(--warn)}
.seg button.on.falta{background:var(--bad-bg);color:var(--bad)}
.hs{font-family:var(--f-num);font-size:13px;color:var(--muted);min-width:44px;text-align:right}
.otro{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;background:var(--chip);padding:10px;border-radius:8px}
.otro label{display:flex;flex-direction:column;font-size:12px;color:var(--muted);gap:3px}
.otro .full{grid-column:1/-1}
@media (max-width:560px){.fila{grid-template-columns:1fr}.fila .acts{display:flex;justify-content:space-between;align-items:center;gap:8px}}

/* Tablas */
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
td.n,th.n{text-align:right;font-family:var(--f-num);font-variant-numeric:tabular-nums}
td.c,th.c{text-align:center}
tfoot td{font-weight:600;border-bottom:0;border-top:2px solid var(--ink)}
.cell{display:inline-block;min-width:34px;padding:2px 6px;border-radius:6px;font-family:var(--f-num);font-size:13px;border:0;background:transparent}
.cell.full{background:var(--ok-bg);color:var(--ok)}
.cell.part{background:var(--warn-bg);color:var(--warn)}
.cell.none{color:var(--muted)}
button.cell{cursor:pointer}

/* Liquidación */
.liq{padding:14px;display:flex;flex-direction:column;gap:10px}
.liq .hd{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:baseline}
.neto{display:flex;justify-content:space-between;align-items:center;background:var(--chip);border-radius:8px;padding:10px 12px}
.neto b{font-family:var(--f-num);font-size:20px}
.desc-add{display:grid;grid-template-columns:130px minmax(0,1fr) 130px auto;gap:6px}
@media (max-width:560px){.desc-add{grid-template-columns:1fr 1fr}}
.x{border:0;background:transparent;color:var(--bad);font-weight:700;padding:2px 8px}
.desc-edit{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1.6fr) 150px 130px;gap:8px;background:var(--chip);padding:10px;border-radius:8px;white-space:normal}
.desc-edit label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
.desc-edit .acciones{grid-column:1/-1}
.btn.peligro{color:var(--bad);margin-left:auto}
@media (max-width:640px){.desc-edit{grid-template-columns:1fr 1fr}}
.firmas{display:none}
.rango{padding:10px 12px;display:flex;flex-direction:column;gap:10px}
.rango label.fecha{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}

/* Personal */
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;padding:14px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.form label.chk{flex-direction:row;align-items:center;text-transform:none;font-size:14px;color:var(--ink)}
.pill{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--ok-bg);color:var(--ok);text-transform:uppercase;letter-spacing:.05em}
.pill.off{background:var(--chip);color:var(--muted)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);
  padding:8px 16px;border-radius:99px;font-size:14px;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.login{max-width:380px;margin:10vh auto;padding:24px;display:flex;flex-direction:column;gap:12px}
.err{color:var(--bad);font-size:14px}
.membrete{display:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

@media print{
  @page{size:A4 landscape;margin:10mm}
  :root{--bg:#fff;--panel:#fff;--ink:#000;--muted:#444;--line:#999;--chip:#f2f2f2;--ok-bg:#fff;--warn-bg:#fff;--ok:#000;--warn:#000}
  header.top,nav.tabs,.demo,.no-print,.toast{display:none!important}
  main{padding:0;max-width:none}
  .membrete{display:flex;justify-content:space-between;border-bottom:2px solid #000;padding-bottom:6px;margin-bottom:6px}
  .membrete b{font-family:var(--f-display);font-size:20px}
  .panel{border:0}
  .liq{break-inside:avoid;border:1px solid #000!important;margin-bottom:8mm}
  .firmas{display:flex;gap:40px;margin-top:22px}
  .firmas div{flex:1;border-top:1px solid #000;padding-top:4px;font-size:12px;text-align:center}
  th,td{padding:4px 6px}
}
#cert-root h2,#pres-root h2,#planos-root h2,#ped-root h2{font-family:var(--f-display);font-weight:700;font-size:28px;margin:0;text-transform:uppercase;letter-spacing:.02em}
#cert-root h3,#pres-root h3,#planos-root h3,#ped-root h3{font-family:var(--f-display);font-weight:600;font-size:20px;margin:0}
#cert-root .sub,#pres-root .sub,#planos-root .sub,#ped-root .sub{color:var(--muted);font-size:14px}
#cert-root .bar,#pres-root .bar,#planos-root .bar,#ped-root .bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#cert-root .between,#pres-root .between,#planos-root .between,#ped-root .between{justify-content:space-between}
#cert-root .btn,#pres-root .btn,#planos-root .btn,#ped-root .btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:9px 14px;font-weight:600}
#cert-root .btn.primary,#pres-root .btn.primary,#planos-root .btn.primary,#ped-root .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
#cert-root .btn.ghost,#pres-root .btn.ghost,#planos-root .btn.ghost,#ped-root .btn.ghost{background:transparent}
#cert-root .btn.sm,#pres-root .btn.sm,#planos-root .btn.sm,#ped-root .btn.sm{padding:5px 10px;font-size:13px}
#cert-root .btn:disabled,#pres-root .btn:disabled,#planos-root .btn:disabled,#ped-root .btn:disabled{opacity:.45;cursor:not-allowed}
#cert-root input,#pres-root input,#planos-root input,#ped-root input,#cert-root select,#pres-root select,#planos-root select,#ped-root select{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
#cert-root .panel,#pres-root .panel,#planos-root .panel,#ped-root .panel{background:var(--panel);border:1px solid var(--line);border-radius:10px}
#cert-root .kpis,#pres-root .kpis,#planos-root .kpis,#ped-root .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:10px}
#cert-root .kpi,#pres-root .kpi,#planos-root .kpi,#ped-root .kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
#cert-root .kpi small,#pres-root .kpi small,#planos-root .kpi small,#ped-root .kpi small{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
#cert-root .kpi b,#pres-root .kpi b,#planos-root .kpi b,#ped-root .kpi b{font-family:var(--f-num);font-size:20px}
#cert-root .kpi em,#pres-root .kpi em,#planos-root .kpi em,#ped-root .kpi em{font-style:normal;font-size:13px;color:var(--muted)}
#cert-root .kpi.ok,#pres-root .kpi.ok,#planos-root .kpi.ok,#ped-root .kpi.ok{border:2px solid var(--ok)}
#cert-root .kpi.ok b,#pres-root .kpi.ok b,#planos-root .kpi.ok b,#ped-root .kpi.ok b{color:var(--ok)}
#cert-root .kpi.bad,#pres-root .kpi.bad,#planos-root .kpi.bad,#ped-root .kpi.bad{border:2px solid var(--bad)}
#cert-root .kpi.bad b,#pres-root .kpi.bad b,#planos-root .kpi.bad b,#ped-root .kpi.bad b{color:var(--bad)}
#cert-root .dot,#pres-root .dot,#planos-root .dot,#ped-root .dot{display:inline-block;width:11px;height:11px;border-radius:50%;flex:none}
#cert-root .dot.rojo,#pres-root .dot.rojo,#planos-root .dot.rojo,#ped-root .dot.rojo{background:var(--bad)}
#cert-root .dot.amarillo,#pres-root .dot.amarillo,#planos-root .dot.amarillo,#ped-root .dot.amarillo{background:var(--accent)}
#cert-root .dot.verde,#pres-root .dot.verde,#planos-root .dot.verde,#ped-root .dot.verde{background:var(--ok)}
#cert-root .alerta,#pres-root .alerta,#planos-root .alerta,#ped-root .alerta{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;padding:10px 14px;border-top:1px solid var(--line)}
#cert-root .alerta:first-child,#pres-root .alerta:first-child,#planos-root .alerta:first-child,#ped-root .alerta:first-child{border-top:0}
#cert-root .alerta .dot,#pres-root .alerta .dot,#planos-root .alerta .dot,#ped-root .alerta .dot{margin-top:6px}
#cert-root .tw,#pres-root .tw,#planos-root .tw,#ped-root .tw{overflow-x:auto}
#cert-root table,#pres-root table,#planos-root table,#ped-root table{border-collapse:collapse;width:100%}
#cert-root th,#pres-root th,#planos-root th,#ped-root th,#cert-root td,#pres-root td,#planos-root td,#ped-root td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;vertical-align:middle}
#cert-root th,#pres-root th,#planos-root th,#ped-root th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
#cert-root th.grp,#pres-root th.grp,#planos-root th.grp,#ped-root th.grp{text-align:center;border-bottom:2px solid var(--line);font-size:12px;color:var(--ink)}
#cert-root td.n,#pres-root td.n,#planos-root td.n,#ped-root td.n,#cert-root th.n,#pres-root th.n,#planos-root th.n,#ped-root th.n{text-align:right}
#cert-root td.desc,#pres-root td.desc,#planos-root td.desc,#ped-root td.desc{white-space:normal;min-width:220px;max-width:380px}
#cert-root tr.rubro td,#pres-root tr.rubro td,#planos-root tr.rubro td,#ped-root tr.rubro td{background:var(--chip);font-weight:600;font-family:var(--f-display);font-size:16px;letter-spacing:.02em}
#cert-root tr.sector td,#pres-root tr.sector td,#planos-root tr.sector td,#ped-root tr.sector td{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding-top:10px}
#cert-root tr.subt td,#pres-root tr.subt td,#planos-root tr.subt td,#ped-root tr.subt td{font-weight:600;border-bottom:2px solid var(--line)}
#cert-root tr.over td,#pres-root tr.over td,#planos-root tr.over td,#ped-root tr.over td{background:var(--bad-bg)}
#cert-root tr.has td.pres,#pres-root tr.has td.pres,#planos-root tr.has td.pres,#ped-root tr.has td.pres{background:var(--edit)}
#cert-root tfoot td,#pres-root tfoot td,#planos-root tfoot td,#ped-root tfoot td{font-weight:700;border-top:2px solid var(--ink);border-bottom:0}
#cert-root td.pres input,#pres-root td.pres input,#planos-root td.pres input,#ped-root td.pres input{width:90px;text-align:right;font-family:var(--f-num);padding:5px 6px}
#cert-root .track,#pres-root .track,#planos-root .track,#ped-root .track{height:8px;background:var(--bar);border-radius:99px;position:relative;overflow:hidden;min-width:80px}
#cert-root .track i,#pres-root .track i,#planos-root .track i,#ped-root .track i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--ok)}
#cert-root .track i.rojo,#pres-root .track i.rojo,#planos-root .track i.rojo,#ped-root .track i.rojo{background:var(--bad)}
#cert-root .mini,#pres-root .mini,#planos-root .mini,#ped-root .mini{display:flex;align-items:center;gap:8px}
#cert-root .mini .pct,#pres-root .mini .pct,#planos-root .mini .pct,#ped-root .mini .pct{font-family:var(--f-num);font-size:12px;width:48px;text-align:right}
#cert-root .totales,#pres-root .totales,#planos-root .totales,#ped-root .totales{position:sticky;bottom:0;z-index:10;display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px;padding:12px 14px;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 -6px 18px rgba(0,0,0,.06);align-items:center}
@media (max-width:760px){#cert-root .totales,#pres-root .totales,#planos-root .totales,#ped-root .totales{bottom:calc(64px + env(safe-area-inset-bottom,0px))}}
#cert-root .totales div small,#pres-root .totales div small,#planos-root .totales div small,#ped-root .totales div small{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
#cert-root .totales div b,#pres-root .totales div b,#planos-root .totales div b,#ped-root .totales div b{font-family:var(--f-num);font-size:18px}
#cert-root .letras,#pres-root .letras,#planos-root .letras,#ped-root .letras{grid-column:1/-1;font-size:13px;color:var(--muted)}
#cert-root .hint,#pres-root .hint,#planos-root .hint,#ped-root .hint{font-size:13px;padding:8px 10px;border-radius:8px}
#cert-root .hint.rojo,#pres-root .hint.rojo,#planos-root .hint.rojo,#ped-root .hint.rojo{background:var(--bad-bg);color:var(--bad)}
#cert-root .hint.verde,#pres-root .hint.verde,#planos-root .hint.verde,#ped-root .hint.verde{background:var(--ok-bg);color:var(--ok)}
#cert-root .hint.amarillo,#pres-root .hint.amarillo,#planos-root .hint.amarillo,#ped-root .hint.amarillo{background:var(--warn-bg);color:var(--warn)}
#cert-root .form,#pres-root .form,#planos-root .form,#ped-root .form{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;padding:14px;align-items:end}
#cert-root .form label,#pres-root .form label,#planos-root .form label,#ped-root .form label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
#cert-root .form .wide,#pres-root .form .wide,#planos-root .form .wide,#ped-root .form .wide{grid-column:span 2}
@media (max-width:520px){#cert-root .form .wide,#pres-root .form .wide,#planos-root .form .wide,#ped-root .form .wide{grid-column:1/-1}}
#cert-root .chips,#pres-root .chips,#planos-root .chips,#ped-root .chips{display:flex;gap:6px;flex-wrap:wrap}
#cert-root .chip,#pres-root .chip,#planos-root .chip,#ped-root .chip{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:5px 12px;font-weight:600;font-size:14px}
#cert-root .chip[aria-pressed="true"],#pres-root .chip[aria-pressed="true"],#planos-root .chip[aria-pressed="true"],#ped-root .chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
#cert-root .chip.nuevo,#pres-root .chip.nuevo,#planos-root .chip.nuevo,#ped-root .chip.nuevo{border-style:dashed}
#cert-root,#pres-root,#planos-root{display:flex;flex-direction:column;gap:16px}
#cert-root .subnav{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}

function numES(v){if(v==null)return null;if(typeof v==='number')return isFinite(v)?v:null;let t=String(v).trim().replace(/\s|Gs\.?/gi,'');if(!t)return null;
  const c=t.lastIndexOf(','),d=t.lastIndexOf('.');
  if(c>=0&&d>=0){if(c>d)t=t.replace(/\./g,'').replace(',','.');else t=t.replace(/,/g,'')}

  else if(d>=0&&(t.match(/\./g).length>1||/^\d{1,3}(\.\d{3})+$/.test(t)&&t.length>5))t=t.replace(/\./g,'');

    async obras(){return d.obras.slice()},
    async saveObra(o){if(o.id){const i=d.obras.findIndex(x=>x.id===o.id);d.obras[i]={...d.obras[i],...o}}else{o.id=uid();d.obras.push(o)}save();return o},
    async personal(){return d.personal.slice()},
    async savePersonal(p){if(p.id){const i=d.personal.findIndex(x=>x.id===p.id);d.personal[i]={...d.personal[i],...p}}else{p.id=uid();d.personal.push(p)}save();return p},
    async asistencias(a,b){return d.asistencia.filter(r=>r.fecha>=a&&r.fecha<=b)},
    async ultimaFecha(){return d.asistencia.reduce((m,r)=>r.fecha>m?r.fecha:m,'')},
    async upsertAsis(r){const i=d.asistencia.findIndex(x=>x.personal_id===r.personal_id&&x.fecha===r.fecha);

const hoy=iso(new Date());
const S={lluv:[],llF:hoy,llConf:false,editDesc:null,tab:'cargar',dia:hoy,ref:hoy,rango:null,obras:[],obra:null,editObra:null,personal:[],asis:{},desc:[],aj:{...AJ_DEF},filtro:'',inactivos:false,abierto:null,edit:null,cargando:false};
let DB=null, SB=null;
const key=(pid,f)=>pid+'|'+f;
const costoHora=p=>(Number(p.jornada)||0)/(Number(S.aj.horasJornada)||9);
const obraAct=()=>S.obras.find(o=>o.id===S.obra)||null;
const nombreObra=()=>{const o=obraAct();return o?o.nombre+(o.cliente?' · '+o.cliente:''):'Sin obra seleccionada'};
const deObra=p=>p.obra_id===S.obra;
const enObra=r=>r.obra_id?r.obra_id===S.obra:(S.personal.find(p=>p.id===r.personal_id)?.obra_id===S.obra);
const activos=()=>S.personal.filter(p=>p.activo!==false&&deObra(p));
function elegirObra(id){S.obra=id;try{localStorage.setItem('obra_sel',id)}catch(e){}}
const ordenar=l=>l.slice().sort((a,b)=>(a.numero??999)-(b.numero??999)||a.nombre.localeCompare(b.nombre));
function periodo(ref){const d=parse(ref);const off=(d.getDay()-Number(S.aj.inicioSemana)+7)%7;const a=addD(ref,-off);return{a,b:addD(a,6)}}
const ndias=(a,b)=>Math.round((parse(b)-parse(a))/864e5)+1;
const diasDe=({a,b})=>Array.from({length:ndias(a,b)},(_,i)=>addD(a,i));
const rango=()=>S.rango||periodo(S.ref);
const MAX_DIAS=93;

async function cargarRango(a,b){
  const rows=await DB.asistencias(a,b);
  for(const k of Object.keys(S.asis)){const f=k.split('|')[1];if(f>=a&&f<=b)delete S.asis[k]}
  for(const r of rows)S.asis[key(r.personal_id,r.fecha)]=r;
}
async function refrescar(){
  S.cargando=true;
  S.lluv=S.obra?await DB.lluvias(S.obra):[];
  if(S.tab==='cargar')await cargarRango(S.dia,S.dia);
  if(S.tab==='planilla'||S.tab==='liquidacion'){const p=rango();await cargarRango(p.a,p.b);S.desc=await DB.descuentos(p.a,p.b)}
  S.cargando=false;render();
}

/* ---------- vistas ---------- */
const presets=()=>({
  completa:{ent_am:S.aj.am_ent,sal_am:S.aj.am_sal,ent_pm:S.aj.pm_ent,sal_pm:S.aj.pm_sal},
  manana:{ent_am:S.aj.am_ent,sal_am:S.aj.am_sal,ent_pm:'',sal_pm:''},
  tarde:{ent_am:'',sal_am:'',ent_pm:S.aj.pm_ent,sal_pm:S.aj.pm_sal}});
function estadoDe(r){
  if(!r)return'falta';const P=presets();
  const eq=(x,y)=>['ent_am','sal_am','ent_pm','sal_pm'].every(k=>(t5(x[k])||'')===(y[k]||''));
  if(eq(r,P.completa))return'completa';if(eq(r,P.manana))return'manana';if(eq(r,P.tarde))return'tarde';return'otro';
}

function vCargar(){
  const d=parse(S.dia);
  let lista=ordenar(S.inactivos?S.personal.filter(deObra):activos());
  if(S.filtro){const f=S.filtro.toLowerCase();lista=lista.filter(p=>(p.nombre+' '+(p.categoria||'')).toLowerCase().includes(f))}
  const regs=activos().map(p=>S.asis[key(p.id,S.dia)]).filter(Boolean);
  const hs=regs.reduce((s,r)=>s+r.horas,0);
  const monto=regs.reduce((s,r)=>{const p=S.personal.find(x=>x.id===r.personal_id);return s+r.horas*costoHora(p)},0);
  const sinMarcar=activos().filter(p=>!S.asis[key(p.id,S.dia)]).length;
  const filas=lista.map(p=>{
    const r=S.asis[key(p.id,S.dia)];const e=estadoDe(r);const ab=S.abierto===p.id||e==='otro';
    const b=(k,t,cls='')=>`<button data-act="marcar" data-pid="${p.id}" data-k="${k}" class="${e===k?'on '+cls:''}" aria-pressed="${e===k}">${t}</button>`;
    return `<div class="fila">
      <div class="who"><b>${esc(p.nombre)}</b><small>${esc(p.categoria||'')}${p.activo===false?' · inactivo':''}</small></div>
      <div class="acts bar">
        <div class="seg">${b('completa','Completa')}${b('manana','Mañana','parcial')}${b('tarde','Tarde','parcial')}${b('otro','Otro','parcial')}${b('falta','Falta','falta')}</div>
        <span class="hs">${r?fmtH(r.horas)+' h':'—'}</span>
      </div>

function datosPeriodo(){
  const p=rango();const dias=diasDe(p);
  const conDatos=new Set(Object.values(S.asis).filter(r=>r.fecha>=p.a&&r.fecha<=p.b&&enObra(r)).map(r=>r.personal_id));
  const descO=S.desc.filter(enObra);
  for(const d of descO)conDatos.add(d.personal_id);
  const gente=ordenar(S.personal.filter(x=>(deObra(x)&&x.activo!==false)||conDatos.has(x.id)));
  const filas=gente.map(x=>{
    const regs=dias.map(f=>{const r=S.asis[key(x.id,f)];return r&&enObra(r)?r:null});
    const horas=regs.reduce((s,r)=>s+(r?r.horas:0),0);
    const ch=costoHora(x);const bruto=Math.round(horas*ch);
    const desc=descO.filter(d=>d.personal_id===x.id);
    const totDesc=desc.reduce((s,d)=>s+Number(d.monto),0);
    return{p:x,regs,horas:Math.round(horas*100)/100,dias:horas/(Number(S.aj.horasJornada)||9),ch,bruto,desc,totDesc,neto:bruto-totDesc};
  });
  return{per:p,dias,filas};
}

function letrasGs(n){
  n=Math.round(n);if(n<=0)return 'cero';
  const U=['','uno','dos','tres','cuatro','cinco','seis','siete','ocho','nueve','diez','once','doce','trece','catorce','quince','dieciséis','diecisiete','dieciocho','diecinueve','veinte','veintiuno','veintidós','veintitrés','veinticuatro','veinticinco','veintiséis','veintisiete','veintiocho','veintinueve'];
  const Dd=['','','','treinta','cuarenta','cincuenta','sesenta','setenta','ochenta','noventa'];
  const C=['','ciento','doscientos','trescientos','cuatrocientos','quinientos','seiscientos','setecientos','ochocientos','novecientos'];
  const c999=x=>{if(x===100)return 'cien';const c=Math.floor(x/100),r=x%100;let s=C[c];if(r){s+=(s?' ':'')+(r<30?U[r]:Dd[Math.floor(r/10)]+(r%10?' y '+U[r%10]:''))}return s};
  const miles=x=>{const q=[];const mi=Math.floor(x/1000),re=x%1000;if(mi)q.push(mi===1?'mil':c999(mi).replace(/uno$/,'un')+' mil');if(re)q.push(c999(re));return q.join(' ')};
  const p=[];const mm=Math.floor(n/1e6),resto=n%1e6;
  if(mm)p.push(mm===1?'un millón':miles(mm).replace(/uno$/,'un')+' millones');if(resto)p.push(miles(resto));
  const s=p.join(' ').replace(/veintiun\b/g,'veintiún');return s.charAt(0).toUpperCase()+s.slice(1);
}
window.letrasGs=letrasGs;

function buildPdfLluvias(jsPDF,recs,hoyISO,logo,info){
  const DOWL=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
  const f=s=>ddmmyy(s);
  const hj=info.hj;
  const lostD=r=>r.afectacion==='total'?1:r.afectacion==='parcial'?Math.min(1,(Number(r.horas)||0)/hj):0;
  const nf=v=>String(Math.round(v*100)/100).replace('.',',');
  const list=recs.slice().sort((a,b)=>a.fecha<b.fecha?-1:1);
  let tot=0,par=0,sin=0,eq=0;
  list.forEach(r=>{if(r.afectacion==='total')tot++;else if(r.afectacion==='parcial')par++;else sin++;eq+=lostD(r)});
  const doc=new jsPDF({unit:'mm',format:'a4',orientation:'portrait'});
  const W=210,ML=20,MR=20,TOP=46;
  function membrete(){
    if(logo)doc.addImage(logo,'PNG',ML,13,11.8,12);
    doc.setFont('helvetica','bold');doc.setFontSize(9.5);doc.setTextColor(0);
    doc.text(info.empresa,ML,31);
    doc.setFont('helvetica','normal');doc.setFontSize(7.5);
    const x=W-MR;
    doc.text('Tel: +595 987 179275',x,14.5,{align:'right'});
    doc.text('Juan L. Mallorquín Nro. 1220 c/ Cerro Corá – 3er Piso',x,18,{align:'right'});
    const em='avarogaarq@gmail.com';doc.text(em,x,21.5,{align:'right'});
    const ew=doc.getTextWidth(em);doc.setLineWidth(0.15);doc.line(x-ew,22,x,22);
    doc.text('Encarnación, Paraguay',x,25,{align:'right'});
    doc.setFontSize(8);doc.text('©'+parse(hoyISO).getFullYear()+' | '+info.empresa,W/2,287,{align:'center'});
  }
  let y=TOP;
  doc.setTextColor(0);doc.setFont('times','bold');doc.setFontSize(13);
  doc.text('CONSTANCIA DE DÍAS DE LLUVIA Y AFECTACIÓN EN OBRA',ML,y);y+=7;
  doc.setFontSize(11);
  const kv=(k,v)=>{doc.setFont('times','bold');doc.text(k,ML,y);const kw=doc.getTextWidth(k+' ');doc.setFont('times','normal');doc.text(v,ML+kw,y);y+=5.5};
  kv('Obra:',info.obra);
  if(info.cliente)kv('Cliente:',info.cliente);
  if(info.ubicacion)kv('Ubicación:',info.ubicacion);
  kv('Período:',DOWL[parse(info.inicio).getDay()]+' '+f(info.inicio)+' al '+DOWL[parse(hoyISO).getDay()].toLowerCase()+' '+f(hoyISO));
  kv('Fecha de emisión:',f(hoyISO));
  y+=3;
  doc.setFont('times','bold');doc.text('Resumen',ML,y);y+=6;
  doc.autoTable({startY:y,margin:{left:ML,right:MR,top:TOP},theme:'plain',tableWidth:120,
    body:[['Jornadas con obra parada por lluvia',String(tot)],['Jornadas con afectación parcial',String(par)],['Días con lluvia sin afectación',String(sin)],['Total de días de obra perdidos (equivalente)',nf(eq)+' días']],
    styles:{font:'times',fontSize:10.5,cellPadding:{top:1.2,bottom:1.2,left:0,right:2},textColor:0},
    columnStyles:{1:{halign:'right',fontStyle:'bold'}},
    didParseCell:d=>{if(d.row.index===3){d.cell.styles.fontStyle='bold';d.cell.styles.lineWidth={top:0.3};d.cell.styles.lineColor=0}}});
  y=doc.lastAutoTable.finalY+8;
  doc.setFont('times','bold');doc.setFontSize(11);doc.text('Detalle de jornadas',ML,y);y+=3;
  const body=list.map(r=>[f(r.fecha),DOWL[parse(r.fecha).getDay()],AFL[r.afectacion]||r.afectacion,
    r.afectacion==='sin'?'—':nf(Number(r.horas)||0),nf(lostD(r)),(r.actividades||[]).join(', ')||'—',r.observaciones||'—']);
  doc.autoTable({startY:y,margin:{left:ML,right:MR,top:TOP,bottom:22},
    head:[['Fecha','Día','Afectación','Horas perd.','Días perd.','Trabajos afectados','Observaciones']],
    body:body.length?body:[[{content:'Sin registros en el período.',colSpan:7}]],theme:'grid',
    styles:{font:'times',fontSize:8.5,cellPadding:1.6,textColor:0,lineColor:[150,150,150],lineWidth:0.15,valign:'top'},
    headStyles:{fillColor:[235,235,235],textColor:0,fontStyle:'bold',fontSize:8.5},
    columnStyles:{0:{cellWidth:17},1:{cellWidth:16},2:{cellWidth:17},3:{cellWidth:12,halign:'right'},4:{cellWidth:11,halign:'right'},5:{cellWidth:24},6:{cellWidth:'auto'}}});
  y=doc.lastAutoTable.finalY+6;
  if(y>240){doc.addPage();y=TOP}
  doc.setFont('times','italic');doc.setFontSize(9);
  const nota=doc.splitTextToSize(`Días perdidos equivalentes: cada jornada con obra parada cuenta 1 día; las jornadas con afectación parcial se computan como horas perdidas / ${nf(hj)} (jornada de ${nf(hj)} horas).`,W-ML-MR);
  doc.text(nota,ML,y);y+=nota.length*4+22;
  if(y>270){doc.addPage();y=TOP+22}

  const n=doc.getNumberOfPages();
  for(let i=1;i<=n;i++){doc.setPage(i);membrete();doc.setFont('helvetica','normal');doc.setFontSize(7.5);doc.text('Pág. '+i+' de '+n,W-MR,287,{align:'right'})}
  return doc;
}

async function guardarAsis(pid,campos){
  const prev=S.asis[key(pid,S.dia)]||{personal_id:pid,fecha:S.dia,ent_am:'',sal_am:'',ent_pm:'',sal_pm:'',obs:''};
  const r={...prev,...campos,obra_id:S.obra};r.horas=horasDe(r);
  S.asis[key(pid,S.dia)]=r;render();
  await DB.upsertAsis({personal_id:pid,fecha:S.dia,obra_id:S.obra,ent_am:r.ent_am,sal_am:r.sal_am,ent_pm:r.ent_pm,sal_pm:r.sal_pm,horas:r.horas,obs:r.obs||''});
  toast('Guardado');
}
document.addEventListener('click',async ev=>{
  const t=ev.target.closest('[data-tab],[data-act]');if(!t)return;
  if(t.dataset.tab){S.tab=t.dataset.tab;if(esP(S.tab))S.lastP=S.tab;if(S.tab==='inicio'&&window.INICIO)window.INICIO.refrescar();S.edit=null;render();return refrescar()}
  const a=t.dataset.act;
  if(a==='dia'){S.dia=addD(S.dia,+t.dataset.n);S.abierto=null;return refrescar()}
  if(a==='hoy'){S.dia=hoy;return refrescar()}
  if(a==='sem'){const n=+t.dataset.n;
    if(S.rango){const L=ndias(S.rango.a,S.rango.b);S.rango={a:addD(S.rango.a,n*L),b:addD(S.rango.b,n*L)}}
    else S.ref=addD(S.ref,7*n);return refrescar()}
  if(a==='semhoy'){S.rango=null;S.ref=hoy;return refrescar()}
  if(a==='semanal'){if(S.rango)S.ref=S.rango.b;S.rango=null;return refrescar()}
  if(a==='rapido'){const d=parse(hoy);if(t.dataset.k==='mesant')d.setMonth(d.getMonth()-1);
    const ini=new Date(d.getFullYear(),d.getMonth(),1),fin=new Date(d.getFullYear(),d.getMonth()+1,0);
    S.rango={a:iso(ini),b:iso(fin)};return refrescar()}
  if(a==='ir'){S.dia=t.dataset.f;S.tab='cargar';S.lastP='cargar';return refrescar()}
  if(a==='marcar'){
    const pid=t.dataset.pid,k=t.dataset.k;
    if(k==='falta'){delete S.asis[key(pid,S.dia)];S.abierto=null;render();await DB.borrarAsis(pid,S.dia);return toast('Marcado ausente')}
    if(k==='otro'){S.abierto=S.abierto===pid?null:pid;return render()}
    S.abierto=null;return guardarAsis(pid,presets()[k]);
  }
  if(a==='todos'){
    const P=presets().completa;const faltan=activos().filter(p=>!S.asis[key(p.id,S.dia)]);
    for(const p of faltan){const r={personal_id:p.id,fecha:S.dia,obra_id:S.obra,...P,obs:''};r.horas=horasDe(r);S.asis[key(p.id,S.dia)]=r}
    render();for(const p of faltan){const r=S.asis[key(p.id,S.dia)];await DB.upsertAsis({...r})}
    return toast(`${faltan.length} cargados`);
  }
  if(a==='deldesc'){await DB.delDesc(t.dataset.id);S.desc=S.desc.filter(d=>d.id!==t.dataset.id);S.editDesc=null;render();return toast('Descuento eliminado')}
  if(a==='editdesc'){S.editDesc=t.dataset.id;return render()}
  if(a==='canceldesc'){S.editDesc=null;return render()}
  if(a==='nuevo'){S.edit={activo:true,obra_id:S.obra,numero:(Math.max(0,...S.personal.filter(deObra).map(p=>p.numero||0))+1)};return render()}
  if(a==='editar'){S.edit={...S.personal.find(p=>p.id===t.dataset.pid)};return render()}
  if(a==='cancelar'){S.edit=null;return render()}
  if(a==='nuevaobra'){S.editObra={activa:true};return render()}
  if(a==='editobra'){S.editObra={...S.obras.find(o=>o.id===t.dataset.id)};return render()}
  if(a==='cancelarobra'){S.editObra=null;return render()}
  if(a==='llday'){S.llF=t.dataset.f;S.llConf=false;render();if(window.innerWidth<860)document.getElementById('fll')?.scrollIntoView({behavior:'smooth'});return}
  if(a==='llhoy'){S.llF=hoy;S.llConf=false;return render()}
  if(a==='lldel'){S.llConf=true;return render()}
  if(a==='llno'){S.llConf=false;return render()}
  if(a==='llsi'){const f=S.llF;await DB.delLluvia(S.obra,f);S.lluv=S.lluv.filter(r=>r.fecha!==f);S.llConf=false;render();return toast('Día borrado')}
  if(a==='irll'){S.llF=t.dataset.f;S.llConf=false;S.tab='lluvias';S.lastP='lluvias';return refrescar()}
  if(a==='llpdf'){return descargarConstancia()}
  if(a==='imprimir'){return window.print()}
  if(a==='excel'){return exportarExcel()}
  if(a==='pdf'){return S.tab==='liquidacion'?pdfLiquidacion():pdfPlanilla()}
  if(a==='salir'){await SB.auth.signOut();location.reload()}
});
let deb={};

document.addEventListener('change',ev=>{
  const t=ev.target;
  if(t.id==='dia'&&t.value){S.dia=t.value;return refrescar()}
  if(t.id==='inactivos'){S.inactivos=t.checked;return render()}
  if(t.id==='ll-fecha'&&t.value){S.llF=t.value;S.llConf=false;return render()}
  if(t.name==='af'&&t.form?.id==='fll'){const h=document.getElementById('ll-horas');
    if(t.value==='total'){h.value=hJL();h.disabled=true}else if(t.value==='sin'){h.value=0;h.disabled=true}
    else{h.disabled=false;if(!(Number(h.value)>0&&Number(h.value)<hJL()))h.value=hJL()/2;h.focus()}return}
  if(t.id==='obra-sel'){elegirObra(t.value);S.edit=null;S.abierto=null;return refrescar()}
  if((t.id==='r-a'||t.id==='r-b')&&t.value){
    let{a,b}=rango();if(t.id==='r-a'){a=t.value;if(b<a)b=a}else{b=t.value;if(b<a)a=b}
    if(ndias(a,b)>MAX_DIAS){toast(`Máximo ${MAX_DIAS} días por planilla`);if(t.id==='r-a')b=addD(a,MAX_DIAS-1);else a=addD(b,-(MAX_DIAS-1))}
    S.rango={a,b};return refrescar()}
  if(t.dataset.pid&&t.dataset.f&&t.type==='time'){S.abierto=t.dataset.pid;guardarAsis(t.dataset.pid,{[t.dataset.f]:t.value})}
});
document.addEventListener('submit',async ev=>{
  ev.preventDefault();const f=ev.target;const fd=Object.fromEntries(new FormData(f));
  if(f.id==='fll'){
    const fecha=fd.fecha;const ini=inicioObra();
    if(!fecha||fecha>hoy||fecha<ini)return toast('Elegí una fecha entre el inicio de obra y hoy');
    const af=fd.af||'total';const hj=hJL();
    const horas=af==='total'?hj:af==='sin'?0:Number(document.getElementById('ll-horas').value);
    if(af==='parcial'&&!(horas>0&&horas<=hj))return toast(`Indicá entre 0,5 y ${hj} horas perdidas`);
    const r={obra_id:S.obra,fecha,afectacion:af,horas,mm:fd.mm===''||fd.mm==null?null:Number(fd.mm),
      actividades:new FormData(f).getAll('act'),observaciones:(fd.observaciones||'').trim()};
    await DB.saveLluvia(r);const i=S.lluv.findIndex(x=>x.fecha===fecha);if(i>=0)S.lluv[i]={...S.lluv[i],...r};else S.lluv.push(r);
    S.llF=fecha;render();return toast('Día de lluvia guardado')}
  if(f.id==='fl'){const{data,error}=await SB.auth.signInWithPassword({email:fd.email,password:fd.pass});
    if(error){document.getElementById('app').innerHTML=vLogin('Correo o contraseña incorrectos.');return}return iniciar(data.session)}
  if(f.id==='fp'){const p={...S.edit,numero:fd.numero?Number(fd.numero):null,nombre:fd.nombre.trim(),categoria:fd.categoria.trim(),ci:fd.ci.trim(),
      jornada:Number(fd.jornada)||0,calce:fd.calce.trim(),activo:!!fd.activo,obra_id:fd.obra_id||S.obra};
    const g=await DB.savePersonal(p);const i=S.personal.findIndex(x=>x.id===g.id);if(i>=0)S.personal[i]={...S.personal[i],...g};else S.personal.push(g);
    S.edit=null;render();return toast(p.obra_id!==S.obra?'Guardado y movido a otra obra':'Personal guardado')}
  if(f.id==='fo'){const o={...S.editObra,nombre:fd.nombre.trim(),cliente:fd.cliente.trim(),ubicacion:(fd.ubicacion||'').trim(),inicio:fd.inicio||null,activa:!!fd.activa};
    const nueva=!o.id;const g=await DB.saveObra(o);const i=S.obras.findIndex(x=>x.id===g.id);if(i>=0)S.obras[i]={...S.obras[i],...g};else S.obras.push(g);
    if(nueva||!S.obra)elegirObra(g.id);
    if(g.activa===false&&g.id===S.obra){const otra=S.obras.find(x=>x.activa!==false);if(otra)elegirObra(otra.id)}
    S.editObra=null;render();return toast(nueva?'Obra creada y seleccionada':'Obra guardada')}
  if(f.id==='fa'){S.aj={...S.aj,...fd,horasJornada:Number(fd.horasJornada)||9,horasLluvia:Number(fd.horasLluvia)||8,inicioSemana:Number(fd.inicioSemana)};await DB.saveAjustes(S.aj);render();return toast('Ajustes guardados')}
  if(f.classList.contains('desc-edit')){const id=f.dataset.id;const monto=Number(fd.monto);if(!monto||!fd.fecha)return;
    const antes=S.desc.find(d=>d.id===id);const cambios={personal_id:fd.personal_id,concepto:fd.concepto.trim(),fecha:fd.fecha,monto};
    const nuevoDueno=S.personal.find(p=>p.id===fd.personal_id);if(nuevoDueno?.obra_id)cambios.obra_id=nuevoDueno.obra_id;
    await DB.updDesc(id,cambios);const{a,b}=rango();S.desc=await DB.descuentos(a,b);S.editDesc=null;render();
    const fuera=fd.fecha<a||fd.fecha>b;
    return toast(fuera?'Guardado · la fecha quedó fuera de este período':(antes&&antes.personal_id!==fd.personal_id?'Descuento pasado a '+(nuevoDueno?.nombre||'otra persona'):'Descuento corregido'))}
  if(f.classList.contains('desc-add')){const pid=f.dataset.pid;const monto=Number(fd.monto);if(!monto)return;
    const{a,b}=rango();const fecha=hoy>=a&&hoy<=b?hoy:b;
    const r={personal_id:pid,obra_id:S.obra,fecha,concepto:fd.concepto+(fd.detalle?' · '+fd.detalle:''),monto};
    await DB.addDesc(r);S.desc=await DB.descuentos(a,b);render();return toast('Descuento agregado')}
});

function exportarExcel(){
  if(!window.XLSX)return toast('No se pudo cargar el generador de Excel');
  const{per,dias,filas}=datosPeriodo();const vis=filas.filter(f=>f.horas>0||f.desc.length);
  const p1=[[S.aj.empresa],['Obra: '+nombreObra()],[`Planilla de personal · ${dm(per.a)} al ${dm(per.b)}`],[],
    ['N°','Nombre','Categoría',...dias.map(f=>DC[parse(f).getDay()]+' '+dm(f)),'Días','Horas','Jornada Gs','Total Gs'],
    ...vis.map(x=>[x.p.numero,x.p.nombre,x.p.categoria,...x.regs.map(r=>r?r.horas:''),Number(x.dias.toFixed(2)),x.horas,Number(x.p.jornada),x.bruto])];
  const p2=[[S.aj.empresa],['Obra: '+nombreObra()],[`Liquidación semanal · ${dm(per.a)} al ${dm(per.b)}`],[],['Nombre','Categoría','Fecha','Mañana','Tarde','Horas','Monto Gs']];
  for(const x of vis){
    x.regs.forEach((r,i)=>{if(r)p2.push([x.p.nombre,x.p.categoria,dm(dias[i]),r.ent_am?r.ent_am+'-'+r.sal_am:'',r.ent_pm?r.ent_pm+'-'+r.sal_pm:'',r.horas,Math.round(r.horas*x.ch)])});
    p2.push(['','Subtotal','','','',x.horas,x.bruto]);
    for(const d of x.desc)p2.push(['','Descuento: '+d.concepto,dm(d.fecha),'','','',-Number(d.monto)]);
    p2.push(['','NETO A PAGAR','','','','',x.neto],[]);
  }
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(p1),'Planilla');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(p2),'Liquidación');
  BAJAR_XLSX(wb,`Personal_${(obraAct()?.nombre||'obra').replace(/[^\wáéíóúñÁÉÍÓÚÑ]+/g,'_')}_${per.a}_al_${per.b}.xlsx`);
}

  const U=['','uno','dos','tres','cuatro','cinco','seis','siete','ocho','nueve','diez','once','doce','trece','catorce','quince','dieciséis','diecisiete','dieciocho','diecinueve','veinte','veintiuno','veintidós','veintitrés','veinticuatro','veinticinco','veintiséis','veintisiete','veintiocho','veintinueve'];

  const C=['','ciento','doscientos','trescientos','cuatrocientos','quinientos','seiscientos','setecientos','ochocientos','novecientos'];
  const c999=x=>{if(x===100)return 'cien';const c=Math.floor(x/100),r=x%100;let s=C[c];
    if(r){s+=(s?' ':'')+(r<30?U[r]:D[Math.floor(r/10)]+(r%10?' y '+U[r%10]:''))}return s};
  const mil=x=>{const q=[];const mi=Math.floor(x/1000),re=x%1000;if(mi)q.push(mi===1?'mil':c999(mi).replace(/uno$/,'un')+' mil');if(re)q.push(c999(re));return q.join(' ')};
  const parts=[];const mm=Math.floor(n/1e6),rr=n%1e6;
  if(mm)parts.push(mm===1?'un millón':mil(mm).replace(/uno$/,'un')+' millones');
  if(rr)parts.push(mil(rr));

async function ciArchivo(file){

  catch(e){CI=null;toast('No se pudo leer el Excel');return}
  render();const p=document.querySelector('#cert-root .ci-panel');if(p)p.scrollIntoView({block:'start',behavior:'smooth'})}

  const des=traer?R.des.map(d=>({...d})):[];
  ALL.contratistas.push({id:(crypto.randomUUID?crypto.randomUUID():'c'+Date.now()),obra_id:OBRA_CARGADA,nombre,tipo:(CI.tipo||'Mano de obra').trim(),cuadrilla:false,items,certs,des});
  CI=null;usar(ALL.contratistas.length-1);S.tab='resumen';guardar();render();window.scrollTo(0,0);
  toast(`${nombre} creado con ${items.length} ítems${certs.length?' y '+certs.length+' certificados':''}`)}
document.addEventListener('change',async e=>{if(!document.getElementById('cert-root'))return;const t=e.target;

const iniciales=n=>String(n||'?').replace(/\(.*\)/,'').trim().split(/\s+/).slice(0,2).map(w=>w[0]||'').join('').toUpperCase()||'?';

function datosC(c){return conD(c,()=>{const R=resumen();R.alertas=controles(R);
  const certs=D.certs.map(x=>{const m=montoCert(x);const p=D.des.find(d=>d.cert===x.n);return{n:x.n,desde:x.desde||'',hasta:x.hasta||x.fecha||'',m:m.t,mo:m.o,ma:m.ad,pago:p||null}});
  const pag=R.desO+R.desA,cert=R.certO+R.certA,tot=R.orig+R.adic;
  return{R,certs,pag,cert,tot,sinPagar:Math.max(0,cert-pag),avance:R.orig?R.certO/R.orig:0,estado:R.alertas.some(a=>a[0]==='rojo')?'rojo':R.alertas.length?'amarillo':'verde'}})}
function anilloC(f,tam,clase){const r=44,c=2*Math.PI*r,a=Math.max(0,Math.min(1,f||0));

function barraDinero(pag,sinPagar,tot,leyenda){const f=x=>tot?Math.max(0,Math.min(100,x/tot*100)):0;const resto=Math.max(0,tot-pag-sinPagar);

const PK=()=>window.PDFK;
const enLetras=n=>(window.letrasGs?window.letrasGs(n):letras(n));
const pdfModo=()=>{const el=document.getElementById('pdf-modo');const v=el?el.value:'ejec';try{localStorage.setItem('pdf_modo',v)}catch(e){}return v};
const pdfModoGuardado=()=>{try{return localStorage.getItem('pdf_modo')||'ejec'}catch(e){return 'ejec'}};
const selModo=()=>`<select id="pdf-modo" aria-label="Ítems del PDF" title="Qué ítems lleva el PDF"><option value="ejec" ${pdfModoGuardado()==='ejec'?'selected':''}>PDF: solo ítems ejecutados</option><option value="todos" ${pdfModoGuardado()==='todos'?'selected':''}>PDF: todos los ítems</option></select>`;
function pdfCertificado(n,modo){
  const P=PK();if(!P||!P.ok())return;const c=D.certs.find(x=>x.n===n);if(!c)return;
  const ant=acumHasta(n-1);const doc=P.nuevo('landscape');
  let y=P.titulo(doc,'CERTIFICADO N°'+n+' · '+(D.tipo||'').toUpperCase(),[['Obra:',OBRA.obra],['Cliente:',OBRA.cliente],['Dirección:',OBRA.direccion],['Contratista:',D.nombre],['Período:',c.desde?`${ddm(c.desde)}/${c.desde.slice(0,4)} al ${ddm(c.hasta)}/${c.hasta.slice(0,4)}`:'']]);
  const body=[];let tO=0,tA=0,lastR=null,sub=null;
  const cierra=()=>{if(sub&&(sub.t||sub.ma||sub.mp)){body.push([{content:'Subtotal',colSpan:5,styles:{fontStyle:'bold',halign:'right'}},{content:gs(sub.t),styles:{fontStyle:'bold',halign:'right'}},'','','','',{content:gs(sub.ma),styles:{fontStyle:'bold',halign:'right'}},{content:gs(sub.mp),styles:{fontStyle:'bold',halign:'right'}},{content:gs(sub.mac),styles:{fontStyle:'bold',halign:'right'}}])}};
  for(const it of D.items){
    const a=ant[it.id]||0,p=Number(c.pres[it.id]||0),ac=a+p;
    if(modo==='ejec'?!(ac>0):!(it.pu>0||ac>0))continue;
    if(it.rubro!==lastR){cierra();sub={t:0,ma:0,mp:0,mac:0};body.push([{content:it.rubro||'',colSpan:13,styles:{fillColor:[238,238,238],fontStyle:'bold'}}]);lastR=it.rubro}
    const mA=a*it.pu,mP=p*it.pu,mAc=ac*it.pu;sub.t+=it.cant*it.pu;sub.ma+=mA;sub.mp+=mP;sub.mac+=mAc;
    if(it.sec==='ADIC')tA+=mP;else tO+=mP;
    body.push([it.n,it.desc,it.unidad,qf(it.cant),gs(it.pu),gs(it.cant*it.pu),qf(a),p?qf(p):'',qf(ac),it.cant?pct(ac/it.cant):'',gs(mA),p?gs(mP):'',gs(mAc)]);
  }
  cierra();
  const R=(()=>{const s0=resumen();return s0})();
  y=P.tabla(doc,{startY:y,head:[[{content:'N°'},{content:'Descripción'},{content:'Unid.'},{content:'Cant.'},{content:'P. unit.'},{content:'P. total'},{content:'Anterior'},{content:'Presente'},{content:'Acumulado'},{content:'% av.'},{content:'Monto anterior'},{content:'Monto presente'},{content:'Monto acumulado'}]],
    body,styles:{fontSize:7.2,cellPadding:1.1,overflow:'linebreak',valign:'middle'},headStyles:{fillColor:[230,230,230],textColor:0,fontStyle:'bold',halign:'center',valign:'middle'},columnStyles:{0:{cellWidth:10},1:{cellWidth:'auto',minCellWidth:80},2:{cellWidth:10,halign:'center'},3:{cellWidth:13,halign:'right'},4:{cellWidth:16,halign:'right'},5:{cellWidth:19,halign:'right'},6:{cellWidth:14,halign:'right'},7:{cellWidth:14,halign:'right',fontStyle:'bold'},8:{cellWidth:16,halign:'right'},9:{cellWidth:11,halign:'right'},10:{cellWidth:19,halign:'right'},11:{cellWidth:19,halign:'right',fontStyle:'bold'},12:{cellWidth:20,halign:'right'}}});
  const total=tO+tA;
  if(y>150){doc.addPage();y=P.TOP}
  y=P.tabla(doc,{startY:y+5,theme:'plain',tableWidth:110,margin:{left:297-P.MR-110,right:P.MR,top:P.TOP},body:[['TOTAL CERTIFICADO',gs(tO)],['TOTAL ADICIONAL',gs(tA)],['TOTAL A PAGAR EN GS.',gs(total)]],
    styles:{fontSize:10,fontStyle:'bold'},columnStyles:{1:{halign:'right'}},didParseCell:d=>{if(d.row.index===2){d.cell.styles.lineWidth={top:0.4};d.cell.styles.lineColor=0}}});
  doc.setFont('times','normal');doc.setFontSize(9.5);doc.text('En letras: '+enLetras(total)+' guaraníes.',P.ML,y+6);
  P.firmas(doc,y+6,['Profesional Avaroga Arquitectura S.A\n'+(OBRA.firma||'Arq. Hugo Gaona'),'Contratista\n'+D.nombre]);
  if(modo==='ejec'){doc.setFont('times','italic');doc.setFontSize(8);doc.text('Se muestran solo los ítems con avance ejecutado.',P.ML,y+16)}
  P.cerrar(doc,`Certificado_${n}_${D.nombre}_${c.desde||hoy}${modo==='ejec'?'_ejecutados':''}`);
}

(function(){
/* ============ Módulo Presupuesto de obra ============ */
const pc=x=>isFinite(x)?(Math.round(x*1000)/10).toString().replace('.',',')+'%':'—';
const q2=x=>x?(Math.round(x*100)/100).toString().replace('.',','):'';
const ml=n=>{const a=Math.abs(n||0);if(a<1e6)return (n<0?'−':'')+gs(a);const[e,d]=(a/1e6).toFixed(1).split('.');return (n<0?'−':'')+gs(Number(e))+','+d+' M'};
const sab=s=>{const d=parse(s);d.setDate(d.getDate()-((d.getDay()+1)%7));return iso(d)};
const ddm=s=>s?`${DC[parse(s).getDay()]} ${dm(s)}`:'';
const ES={tab:'resumen',doc:null,oid:undefined,cargando:false,con:[],buscar:'',cert:null,borr:{},per:null};
const precio=i=>(i.mat+i.mo)*(ES.doc.indice||1);
const rnum=r=>String(r||'').split('.')[0].trim();

async function cargar(oid){
  if(ES.cargando)return;ES.cargando=true;
  try{ES.doc=await window.PDB.get(oid)}catch(e){ES.doc=null;toast('No se pudo leer el presupuesto')}
  try{ES.con=window.CDB?await window.CDB.list(oid):[]}catch(e){ES.con=[]}
  ES.oid=oid;ES.cargando=false;ES.cert=null;ES.borr={};ES.raw={};ES.corte=null;ES.cargado=null;ES.raw={};render();
}
const guardar=()=>{if(ES.doc&&window.PDB)window.PDB.save(ES.doc).catch(()=>toast('No se pudo guardar en la base. Revisá la conexión.'))};


/* ---------- vínculo contratistas → presupuesto ---------- */
const nz=t=>String(t||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,' ').trim();
function mapa(){
  const byDesc={},byCant={};
  for(const i of ES.doc.items){const k=rnum(i.rubro)+'|'+nz(i.desc);(byDesc[k]=byDesc[k]||[]).push(i);const k2=rnum(i.rubro)+'|'+nz(i.unidad)+'|'+i.cant;(byCant[k2]=byCant[k2]||[]).push(i)}
  const V=ES.doc.vinculos||{};const M={};
  for(const c of ES.con)for(const it of c.items||[]){
    if(it.sec!=='ORIG')continue;const key=c.id+'|'+it.id;
    if(V[key]){M[key]=V[key]==='-'?null:V[key];continue}
    let m=byDesc[rnum(it.rubro)+'|'+nz(it.desc)];
    if(m&&m.length>1)m=m.filter(x=>Math.abs(x.cant-it.cant)<1e-6);
    if((!m||m.length!==1)&&it.n){const mn=ES.doc.items.filter(x=>rnum(x.rubro)===rnum(it.rubro)&&String(x.n).trim()===String(it.n).trim()&&nz(x.unidad)===nz(it.unidad));if(mn.length===1)m=mn}
    if(!m||m.length!==1)m=byCant[rnum(it.rubro)+'|'+nz(it.unidad)+'|'+it.cant];
    M[key]=m&&m.length===1?m[0].id:undefined;
  }
  return M;
}
const ultHasta=()=>{const cs=(ES.doc.certs||[]).filter(c=>c.hasta);const h=cs.length?cs[cs.length-1].hasta:'';return [h,baseCobrada()?ES.doc.baseHasta||'':''].sort().pop()};
const desdeNuevo=corte=>{const h=ultHasta();let d=h?addD(h,1):((window.ASIS_OBRA&&window.ASIS_OBRA()||{}).inicio||corte);return d>corte?corte:d};
const finMes=d=>{const x=parse(d);return iso(new Date(x.getFullYear(),x.getMonth()+1,0))};
const MESES_P=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const cierreDe=x=>x.hasta||x.desde||x.fecha||'';
/* certificados de contratistas cuyo período termina dentro del rango elegido */
function certsRango(desde,hasta){if(!desde||!hasta)return[];return ES.con.flatMap(c=>(c.certs||[]).filter(k=>{const f=cierreDe(k);return f&&f>=desde&&f<=hasta}).map(x=>{
  let m=0;for(const[k,v]of Object.entries(x.pres)){const it=c.items.find(i=>i.id===k);if(it)m+=v*it.pu}
  const pago=(c.des||[]).find(d=>d.cert===x.n);return{c,x,monto:m,pago}}))}
function semanasPendientes(){const h=ultHasta();const w=new Set();ES.con.forEach(c=>(c.certs||[]).forEach(x=>{const f=cierreDe(x);if(f&&f>h)w.add(f)}));return[...w].sort()}
function avanceDesde(lista){const M=mapa();const pres={},sin=[];
  for(const{c,x}of lista)for(const[k,v]of Object.entries(x.pres)){const it=c.items.find(i=>i.id===k);if(!it||it.sec!=='ORIG')continue;const pid=M[c.id+'|'+k];
    if(pid)pres[pid]=(pres[pid]||0)+v;else if(pid!==null)sin.push({c,it,q:v})}
  return{pres,sin};
}

/* avance acumulado hasta el certificado n (incluye la base de la planilla) */
const baseCobrada=()=>!!(ES.doc.vinculos&&ES.doc.vinculos._base_cobrada==='si');
function acum(n){const a=baseCobrada()?{...(ES.doc.base||{})}:{};for(const c of ES.doc.certs||[]){if(c.n>n)continue;for(const[k,v]of Object.entries(c.pres))a[k]=(a[k]||0)+v}return a}
function totales(){
  const its=ES.doc.items;const mat=its.reduce((s,i)=>s+i.cant*i.mat*(ES.doc.indice||1),0),mo=its.reduce((s,i)=>s+i.cant*i.mo*(ES.doc.indice||1),0);
  const ult=(ES.doc.certs||[]).length?ES.doc.certs[ES.doc.certs.length-1].n:0;const ac=acum(ult);
  const av=its.reduce((s,i)=>s+(ac[i.id]||0)*precio(i),0);
  return{mat,mo,tot:mat+mo,ult,ac,av};
}
function porRubro(){
  const T=totales();const R={};
  for(const i of ES.doc.items){const k=rnum(i.rubro);const r=R[k]=R[k]||{k,nombre:i.rubro,mat:0,mo:0,tot:0,av:0,con:0,cert:0,quien:new Set()};
    r.mat+=i.cant*i.mat*(ES.doc.indice||1);r.mo+=i.cant*i.mo*(ES.doc.indice||1);r.tot+=i.cant*precio(i);r.av+=(T.ac[i.id]||0)*precio(i)}
  for(const c of ES.con){
    const ac={};for(const x of c.certs||[])for(const[k,v]of Object.entries(x.pres))ac[k]=(ac[k]||0)+v;
    for(const it of c.items||[]){if(it.sec!=='ORIG'||!it.pu)continue;const k=rnum(it.rubro);if(!R[k])continue;R[k].con+=it.cant*it.pu;R[k].cert+=(ac[it.id]||0)*it.pu;R[k].quien.add(c.nombre.split(' (')[0])}
  }
  return Object.values(R).sort((a,b)=>Number(a.k)-Number(b.k));
}
function estado(r){
  if(r.con>r.tot+1)return['rojo','Contratado por encima del total del rubro'];
  if(r.con>r.mo+1)return['amarillo',r.con>r.mo*3?'Contratado muy por encima de la mano de obra presupuestada: revisá si la mano de obra quedó dentro de materiales':'Contratado por encima de la mano de obra presupuestada'];
  if(!r.con&&r.mo>0)return['gris','Sin contratar'];
  return['verde','Dentro de lo presupuestado'];

const dot=e=>e==='gris'?'<i class="dot" style="background:var(--line)"></i>':`<i class="dot ${e}"></i>`;

    <div class="kpi"><small>Avance certificado al cliente</small><b>${ml(T.av)}</b><em>${pc(T.av/T.tot)} de la obra</em></div>
  </div>
  <div class="panel p-controles"><div class="bar between" style="padding:12px 14px;border-bottom:1px solid var(--line)"><h3>Controles</h3><span class="sub">Presupuesto contra contratos de mano de obra</span></div>
    ${al.map(([n,h])=>`<div class="alerta">${dot(n)}<div>${h}</div></div>`).join('')||'<div class="alerta"><i class="dot verde"></i><div>Todo dentro de lo presupuestado.</div></div>'}</div>
  <div class="panel tw"><table>

    <tbody>${rs.map(r=>{const[e,t]=estado(r);return `<tr title="${esc(t)}"><td>${dot(e)}</td><td>${esc(r.nombre)}</td><td class="n">${gs(r.mat)}</td><td class="n">${gs(r.mo)}</td><td class="n">${gs(r.tot)}</td><td class="n">${pc(r.tot/T.tot)}</td>
      <td class="n">${r.con?gs(r.con):'—'}</td><td class="n ${r.con>r.mo+1?'up':''}">${r.con?gs(r.con-r.mo):'—'}</td><td>${esc([...r.quien].join(', '))||'<span class="sub">sin contratar</span>'}</td><td>${barra(r.tot?r.av/r.tot:0)}</td></tr>`}).join('')}</tbody>
    <tfoot><tr><td></td><td>Total</td><td class="n">${gs(T.mat)}</td><td class="n">${gs(T.mo)}</td><td class="n">${gs(T.tot)}</td><td class="n">100%</td><td class="n">${gs(tc)}</td><td class="n">${gs(rs.reduce((s,r)=>s+(r.con?r.con-r.mo:0),0))}</td><td></td><td>${barra(T.av/T.tot)}</td></tr></tfoot>
  </table></div>
  <p class="sub">Diferencia = mano de obra contratada − presupuestada, solo en rubros con contrato. Verde: dentro; amarillo: por encima de la mano de obra presupuestada; rojo: por encima del total del rubro; gris: sin contratar.</p>`;
}

  for(const i of ES.doc.items){

/* lo ejecutado por los contratistas, acumulado hasta la fecha de corte, con tope del 100% por ítem */
function ejecutado(corte){
  const bh=ES.doc.baseHasta||'';
  const lista=ES.con.flatMap(c=>(c.certs||[]).filter(k=>{const f=cierreDe(k);if(!f||(bh&&f<=bh))return false;return !corte||(k.desde||f)<=corte}).map(x=>{
    let m=0;for(const[k,v]of Object.entries(x.pres||{})){const it=c.items.find(i=>i.id===k);if(it)m+=v*it.pu}
    return{c,x,monto:m,pago:(c.des||[]).find(d=>d.cert===x.n)}}));
  const{pres,sin}=avanceDesde(lista);const e={...(ES.doc.base||{})};for(const[k,v]of Object.entries(pres))e[k]=(e[k]||0)+v;
  const sobre=[];for(const i of ES.doc.items){if((e[i.id]||0)>i.cant+1e-9){sobre.push({i,q:e[i.id]});e[i.id]=i.cant}}
  return{e,sin,lista,sobre};
}
const tope=(i,ant)=>Math.max(0,i.cant-(ant[i.id]||0));
function sugerido(E,ant){const p={};for(const i of ES.doc.items){const v=Math.min((E.e[i.id]||0)-(ant[i.id]||0),tope(i,ant));if(v>1e-9)p[i.id]=Math.round(v*10000)/10000}return p}
function pendienteMonto(){const certs=ES.doc.certs||[];const ult=certs.length?certs[certs.length-1].n:0;const ant=acum(ult);const E=ejecutado(hoy);let m=0;for(const i of ES.doc.items)m+=Math.max(0,(E.e[i.id]||0)-(ant[i.id]||0))*precio(i);return m}

function vAvance(){
  const certs=ES.doc.certs||[];const ult=certs.length?certs[certs.length-1].n:0;
  if(window.CLI){if(!ult)return `<h2>Avance al cliente</h2><div class="panel" style="padding:16px">Todavía no hay certificados de avance emitidos para esta obra.</div>`;if(ES.cert==null||ES.cert>ult)ES.cert=ult}
  if(ES.cert==null)ES.cert=ult+1;
  const nuevo=ES.cert===ult+1;
  if(!ES.corte)ES.corte=hoy;
  const cv=nuevo?null:certs.find(x=>x.n===ES.cert);
  const ant=acum((nuevo?ult+1:ES.cert)-1);
  const E=nuevo?ejecutado(ES.corte):null;
  if(nuevo&&ES.cargado!==ES.corte){ES.borr=sugerido(E,ant);ES.cargado=ES.corte}
  const c=nuevo?{n:ult+1,pres:ES.borr,desde:desdeNuevo(ES.corte),hasta:ES.corte}:cv;
  const q=(ES.buscar||'').toLowerCase();
  let tP=0,tAc=0,tEj=0;const rows=[];let lastR=null;
  for(const i of ES.doc.items){
    const a=ant[i.id]||0,p=Number(c.pres[i.id]||0),ac=a+p,pu=precio(i);tP+=p*pu;tAc+=ac*pu;const ej=E?(E.e[i.id]||0):ac;tEj+=ej*pu;
    if(q&&!(i.desc+' '+i.n+' '+i.rubro).toLowerCase().includes(q))continue;
    if(!ac&&!p&&!(E&&ej))continue;
    if(i.rubro!==lastR){rows.push(`<tr class="rubro"><td colspan="${nuevo?12:11}">${esc(i.rubro)}</td></tr>`);lastR=i.rubro}
    const lleno=ac>=i.cant-1e-9;
    rows.push(`<tr class="${p?'has':''}"><td class="num">${esc(i.n)}</td><td class="desc">${esc(i.desc)}</td><td>${esc(i.unidad)}</td><td class="n">${q2(i.cant)}</td><td class="n">${gs(pu)}</td>
      ${nuevo?`<td class="n">${q2(ej)||'—'}</td>`:''}<td class="n">${q2(a)}</td>
      <td class="n pres">${nuevo?`<input type="text" inputmode="decimal" autocomplete="off" id="pp-${i.id}" data-pid="${i.id}" data-max="${tope(i,ant)}" value="${esc(ES.raw&&ES.raw[i.id]!=null?ES.raw[i.id]:q2(p))}" ${tope(i,ant)<=1e-9?'disabled title="Ítem al 100%"':''}>`:q2(p)}</td>
      <td class="n">${q2(ac)}</td><td class="n">${pc(i.cant?ac/i.cant:0)}${lleno?' ✓':''}</td><td class="n">${gs(p*pu)}</td><td class="n">${gs(ac*pu)}</td></tr>`);
  }
  const T=totales();
  const chips=certs.map(x=>`<button class="chip-p" data-pact="ver" data-n="${x.n}" aria-pressed="${x.n===ES.cert}">N°${x.n}</button>`).join('')+`<button class="chip-p" style="border-style:dashed" data-pact="ver" data-n="${ult+1}" aria-pressed="${nuevo}">+ Nuevo N°${ult+1}</button>`;
  const tAnt=tAc-tP;
  return `
  <div class="bar between"><div><h2>Avance al cliente · certificado N°${c.n}</h2><div class="sub">${esc(OBRA_P().cliente)} · ${nuevo?'al '+dm(c.hasta)+'/'+c.hasta.slice(0,4):`período ${dm(c.desde)}/${(c.desde||'').slice(0,4)} al ${dm(c.hasta)}/${(c.hasta||'').slice(0,4)}`}</div></div><div class="subnav-p">${chips}</div></div>
  ${nuevo?`<div class="panel" style="padding:14px;display:flex;flex-direction:column;gap:10px">
    <div class="bar"><label class="sub" style="display:flex;flex-direction:column;gap:4px">Ejecutado hasta el<input type="date" id="pp-corte" value="${ES.corte}"></label>
      <button type="button" class="btn ghost" data-pact="hoy">Hoy</button>
      <button type="button" class="btn" data-pact="traer">Volver a calcular desde contratistas</button></div>
    <div class="kpis">
      <div class="kpi"><small>Ejecutado en obra</small><b>${ml(tEj)}</b><em>acumulado al ${dm(ES.corte)}${Object.keys(ES.doc.base||{}).length?' · incluye tu planilla':''}</em></div>
      <div class="kpi"><small>Ya certificado al cliente</small><b>${ml(tAnt)}</b><em>${ult?'certificados N°1 a N°'+ult:'todavía ninguno'}${baseCobrada()?' + planilla':''}</em></div>
      <div class="kpi"><small>Este certificado</small><b>${ml(tP)}</b><em>${tP+1<tEj-tAnt?'menos de lo pendiente (lo editaste)':'todo lo pendiente de certificar'}</em></div>
    </div>
    ${Object.keys(ES.doc.base||{}).length?(()=>{let mb=0;for(const i of ES.doc.items)mb+=Math.min(i.cant,(ES.doc.base||{})[i.id]||0)*precio(i);
      return `<div class="alerta" style="border:1px solid var(--line);border-radius:8px"><i class="dot ${baseCobrada()?'verde':'amarillo'}"></i><div><b>Avance de tu planilla hasta el ${dm(ES.doc.baseHasta||'')}: ${gs(mb)} Gs</b>
        <div class="sub">¿Ya se lo certificaste al cliente?</div>
        <div class="subnav-p" style="margin-top:6px"><button class="chip-p" data-pact="basecob" data-v="no" aria-pressed="${!baseCobrada()}">No, incluirlo en este certificado</button><button class="chip-p" data-pact="basecob" data-v="si" aria-pressed="${baseCobrada()}">Sí, ya está cobrado</button></div></div></div>`})():''}
    <div class="sub">El certificado sale cuando quieras: toma todo lo que certificaron los contratistas hasta esa fecha y le resta lo que ya se le certificó al cliente, así nada se cobra dos veces. Ningún ítem pasa del 100% de su cantidad. Podés corregir a mano la columna <b>Presente</b>.</div>
    ${E.sobre.length?`<div class="hint amarillo">Los contratistas certificaron más que la cantidad del presupuesto en ${E.sobre.length} ítem${E.sobre.length>1?'s':''}; al cliente se le cobra hasta el 100%: ${E.sobre.map(x=>esc(x.i.n+' '+x.i.desc.slice(0,34))+' ('+q2(x.q)+' de '+q2(x.i.cant)+')').join(' · ')}.</div>`:''}
  </div>
  ${panelContratistas(E)}`:''}
  <input type="search" id="p-buscar" placeholder="Buscar ítem o rubro" value="${esc(ES.buscar)}">
  <div class="panel tw"><table>
    <thead><tr><th>N°</th><th>Rubro</th><th>Unid.</th><th class="n">Cant.</th><th class="n">Precio unit.</th>${nuevo?'<th class="n">Ejecutado</th>':''}<th class="n">Anterior</th><th class="n">Presente</th><th class="n">Acumulado</th><th class="n">% av.</th><th class="n">Monto presente</th><th class="n">Monto acumulado</th></tr></thead>
    <tbody>${rows.join('')||`<tr><td colspan="12" class="sub">${nuevo?'Todavía no hay avance de contratistas para certificar.':'Sin avance en este certificado.'}</td></tr>`}</tbody>
  </table></div>
  <div class="totales">
    <div><small>Monto de este certificado</small><b>${gs(tP)}</b></div>
    <div><small>Acumulado al cliente</small><b>${gs(tAc)}</b></div>
    <div><small>Avance de la obra</small><b>${pc(tAc/T.tot)}</b></div>
    ${selP()}
    ${nuevo?`<button class="btn" data-pact="pdfborr" data-n="${c.n}" ${tP?'':'disabled'}>PDF borrador</button><button class="btn primary" data-pact="emitir" ${tP?'':'disabled'}>Emitir certificado N°${c.n}</button>`:`<button class="btn primary" data-pact="pdfav" data-n="${c.n}">Descargar PDF</button>${c.n===ult?`<button class="btn ghost" data-pact="anular" data-n="${c.n}">${ES.anular===c.n?'¿Anular el N°'+c.n+'?':'Anular'}</button>`:''}`}
    <div class="letras">En letras: ${tP?letrasGs(tP)+' guaraníes':'—'}</div>
  </div>`;
}

function panelContratistas(E){
  const sem=E.lista;const tot=sem.reduce((s,x)=>s+x.monto,0);const sin=E.sin;
  const its=ES.doc.items.filter(i=>sin.some(x=>rnum(x.it.rubro)===rnum(i.rubro)));
  return `<div class="panel"><details><summary style="padding:12px 14px;cursor:pointer"><b>Certificados de contratistas considerados</b> <span class="sub">· ${sem.length} certificado${sem.length===1?'':'s'} · ${gs(tot)} Gs pagados a contratistas${ES.doc.baseHasta?' · desde el '+dm(addD(ES.doc.baseHasta,1)):''}</span></summary>
    ${sem.length?`<div class="tw"><table><thead><tr><th>Contratista</th><th>Certificado</th><th>Semana</th><th class="n">Monto</th><th>Pago</th></tr></thead><tbody>
      ${sem.map(x=>`<tr><td>${esc(x.c.nombre.split(' (')[0])} <span class="sub">${esc((x.c.tipo||'').replace('Mano de obra · ',''))}</span></td><td>N°${x.x.n}</td><td class="num">${x.x.desde?dm(x.x.desde)+' – ':''}${dm(cierreDe(x.x))}</td><td class="n">${gs(x.monto)}</td><td>${x.pago?'pagado el '+ddm(x.pago.fecha):'<span class="sub">pendiente</span>'}</td></tr>`).join('')}</tbody>
      <tfoot><tr><td>Total</td><td></td><td></td><td class="n">${gs(tot)}</td><td></td></tr></tfoot></table></div>`

      <div class="tw"><table><tbody>${sin.map(x=>`<tr><td>${esc(x.c.nombre.split(' (')[0])}</td><td class="desc">${esc(x.it.n+' '+x.it.desc)} <span class="sub">(${q2(x.q)} ${esc(x.it.unidad)})</span></td>
        <td><select data-vinc="${x.c.id}|${x.it.id}"><option value="">Elegir ítem…</option><option value="-">No suma avance al cliente</option>${its.filter(i=>rnum(i.rubro)===rnum(x.it.rubro)).map(i=>`<option value="${i.id}">${esc(i.n+' '+i.desc.slice(0,60))} (${esc(i.unidad)})</option>`).join('')}</select></td></tr>`).join('')}</tbody></table></div></div></div>`:''}
  </div>`;
}

/* ---------- PDF ---------- */
function pdfResumen(){
  if(!PDFK.ok())return;const T=totales();const rs=porRubro();const doc=PDFK.nuevo('landscape');const o=OBRA_P();
  let y=PDFK.titulo(doc,'RESUMEN DEL PRESUPUESTO DE OBRA',[['Obra:',o.obra],['Cliente:',o.cliente],['Ubicación:',o.ubicacion],['Fecha:',dm(hoy)+'/'+hoy.slice(0,4)]]);
  y=PDFK.tabla(doc,{startY:y,head:[['Rubro','Materiales','Mano de obra','Total rubro','Incid.','M.O. contratada','Diferencia','Contratista','Avance cliente']],
    body:rs.map(r=>[r.nombre,gs(r.mat),gs(r.mo),gs(r.tot),pc(r.tot/T.tot),r.con?gs(r.con):'—',r.con?gs(r.con-r.mo):'—',[...r.quien].join(', ')||'sin contratar',pc(r.tot?r.av/r.tot:0)]),
    foot:[['Total',gs(T.mat),gs(T.mo),gs(T.tot),'100%',gs(rs.reduce((s,r)=>s+r.con,0)),'','',pc(T.av/T.tot)]],styles:{fontSize:8},
